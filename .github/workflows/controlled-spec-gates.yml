name: Controlled specification gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out controlled source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked checker dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Reject tracked build products, path disclosure, and recognized secrets
        run: python tools/repo/check_repository_hygiene.py

      - name: Check headless acceptance evidence is current and canonically retained
        run: python tools/mps/check_headless_build_currency.py

      - name: Check workspace constraints
        run: python tools/repo/check_workspace_location.py --enforce

      - name: Check session controls describe the controls that exist
        run: python tools/spec/check_session_controls.py

      - name: Check controlled HLR mirror
        run: python tools/mps/build_hlr_import_bundle.py --check

      - name: Check MPS language layering
        run: python tools/mps/check_language_skeleton.py

      - name: Check MPS materialization plan
        run: python tools/mps/check_materialization_plan.py

      - name: Check MPS concept feature specification
        run: python tools/mps/check_concept_features.py

      - name: Derive Stage A assurance metrics from their entity populations
        run: python tools/spec/report_assurance_metrics.py --check

      - name: Check MPS module graph against the blueprint
        run: python tools/mps/check_module_graph.py --checkpoint MPS-4

      - name: Check persisted enumeration values resolve to their own enumeration
        run: python tools/mps/check_enum_persistence.py

      - name: Check imported HLR roots are counted only where they belong
        run: python tools/mps/check_hlr_root_placement.py

      - name: Check declared model persistence against the layout on disk
        run: python tools/mps/check_model_persistence.py

      - name: Check the neutral export still matches the MPS model
        run: python tools/mps/export_hlr_corpus.py --check

      - name: Bind the persisted HLR model to the neutral export, then compare the export against the source baseline over the 119 requirements
        run: python tools/mps/check_stage_b_equivalence.py

      - name: Check frozen MPS-2 role ontology
        run: python tools/mps/check_role_ontology.py

      - name: Check namespaced source relations
        run: python tools/spec/check_seed_namespace.py

      - name: Check safety and assurance classification
        run: python tools/spec/apply_classification_migration.py --check

      - name: Check clinical adapter allocations
        run: python tools/spec/fix_clinical_adapter_allocations.py --check

      - name: Check hazard trace graph
        run: python tools/spec/build_trace_graph.py --check

      - name: Check hazard-derived risk register
        run: python tools/spec/build_risk_register.py --check --gate 0

      - name: Check component view crosswalk
        run: python tools/spec/build_component_crosswalk.py --check

      - name: Check constructed component, requirement, and sub-requirement records
        run: python tools/spec/check_construction_records.py

      - name: Check session controls are current
        run: python tools/spec/check_session_controls.py

      - name: Check controlled specification reconciliation
        run: python tools/spec/check_controlled_specs.py

      - name: Check explicit Stage A approval state
        run: python tools/spec/check_approval_state.py --stage A

      - name: Check Gate 0 readiness
        run: python tools/spec/check_gate_readiness.py --gate 0

      - name: Check generated V&V matrix
        shell: pwsh
        run: ./scripts/generate_vv_check_matrix.ps1 -Check

      - name: Confirm generated-source checks leave no diff
        run: git diff --exit-code

      # NF-21. This gate stands substantively RED -- exit 1, seven declared evidence
      # obligations still OPEN -- and is expected to until those obligations are resolved. It
      # used to run thirteenth of thirty-four. GitHub Actions stops a job at the first failing
      # step, and this workflow declares no continue-on-error, no if-condition and no
      # aggregation, so the twenty-one steps after it never executed. They are declared
      # mandatory and were unreachable, and had been for as long as the RED has stood.
      #
      # It is last so that every other mandatory control executes first. The RED is not
      # hidden, made conditional or aggregated away: this step still fails, and the workflow
      # still fails with it. What changes is that the other controls now report before it
      # does. tests/test_workflow_reachability.py holds the invariant, which is reachability
      # rather than this position -- any control standing nonzero has to be placed so nothing
      # mandatory is stranded behind it, or carry an explicit execution-preserving mechanism.
      - name: Reconcile declared evidence obligations against observed evidence
        run: python tools/mps/check_evidence_reconciliation.py

  document-build:
    needs: structural-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out controlled source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked checker dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Install pdfLaTeX and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile nineteen standalone documents and combined suite
        run: python tools/docs/compile_controlled_docs.py

      - name: Build nonclinical review-artifact provenance manifest
        run: python tools/release/build_pdf_manifest.py --release-status review

      - name: Upload controlled-document review artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcpl-nltps-controlled-documentation-review
          path: output/pdf/
          if-no-files-found: error
          retention-days: 30
