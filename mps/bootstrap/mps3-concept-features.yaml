        to name the semantics it projects, so the positive control matters as much as the negative
        one.'
    - id: PRJ-C-002
      statement: A professional projection concept declares no property, child or reference that re-expresses
        clinical state. It introduces no prescription, candidate plan, dose constraint, approval state
        or workflow state of its own; every such object is referenced through a holder.
      source_constraint: the projection introduces no clinical semantics of its own
      applies_to:
      - TherapyProjection
      - TherapyView
      - TherapyTask
      traceability: authorization projection
      enforcement: gate-level structural rule, tools/mps/check_concept_features.py containment check
        plus tools/mps/check_role_ontology.py projection rules
      proof_status: active at MPS-3, proven at gate level
      negative_example: A concept TherapyPrescription or TherapyPlan owned by nltps.roles.therapy,
        or TherapyTask gaining a property typed AutonomyLevelEnum or AuthorityClassEnum, which would
        re-express authority in the projection layer.
      positive_example: TherapyTask.taskKind typed TherapyTaskKindEnum, an enumeration owned by this
        language describing an interaction, not authority.
    - id: PRJ-C-003
      statement: A professional projection concept may contain only concepts owned by its own language
        or by a transitive EXTENDS ancestor. A DEFAULT dependency permits references and never containment.
      source_constraint: containment stays within the EXTENDS ancestry
      applies_to:
      - TherapyProjection
      - TherapyView
      - TherapyTask
      traceability: MPS representation scaffolding
      enforcement: gate-level structural rule, tools/mps/check_concept_features.py containment check
      proof_status: active at MPS-3, proven at gate level
      negative_example: TherapyView declaring a child targeting ClinicalObjectType, which nltps.roles.therapy
        can see only through the DEFAULT dependency on nltps.clinicalintent. The gate rejects it as
        containment through a DEFAULT dependency.
      positive_example: TherapyView.subjects containing SemanticTargetRef, owned by nltps.roles.common,
        which nltps.roles.therapy EXTENDS. This must not be rejected.
    - id: PRJ-C-004
      statement: A professional projection binds exactly one intended ProfessionalRole. The binding
        establishes professional context only; it is not an authorization and confers no permission.
      source_constraint: the professional projection resolves to its intended professional context
      applies_to:
      - TherapyProjection
      traceability: authorization projection
      enforcement: MPS metamodel cardinality 1 for presence, verified empirically at the MPS-3 freeze;
        plus a gate rule that the binding targets ProfessionalRole and not OperationalRole, RoleCapability
        or AuthorizedActor
      proof_status: active at MPS-3
      negative_example: TherapyProjection.intendedRole retargeted at OperationalRole, which would
        conflate the credential with the workflow function and contradict mps2-role-ontology.yaml
        separation_of_concerns. Separately, a TherapyProjection instance with intendedRole unset,
        which MPS reports as "No reference in the obligatory role 'intendedRole'" on the reference
        descriptor.
      positive_example: intendedRole bound to the RadiationTherapist ProfessionalRole instance, with
        authority still decided by RoleCapability.
      note: The MPS-3 freeze re-tested obligatory-role enforcement empirically and found that MPS
        does report a missing mandatory reference, on the reference descriptor rather than in the
        node-level problems array. No additional checking rule is therefore written for presence;
        the read-back requirement is that the materialization session inspects feature descriptors,
        not only node-level problems.
    - id: PRJ-C-005
      statement: The projection layer declares no authorization feature. No professional concept references
        RoleCapability, AuthorityPolicy or AuthorizedActor, and none declares a property typed by
        an enumeration owned by a semantic-core language. Seeing a command in an editor is not evidence
        of authority to execute it.
      source_constraint: editor visibility does not grant authorization
      applies_to:
      - TherapyProjection
      - TherapyTask
      traceability: authorization projection
      enforcement: gate-level structural rule, tools/mps/check_role_ontology.py
      proof_status: active at MPS-3, proven at gate level
      negative_example: TherapyTask gaining a reference to RoleCapability, which would let the projection
        carry its own authorization decision, or a property typed AutonomyLevelEnum, which would let
        it restate the A4 discriminator that CLI-C-005 owns.
      positive_example: TherapyTask referencing an ActionDefinition through the inherited ActionRef
        holder. The action is named; the authority to perform it is resolved elsewhere, by AuthorityPolicy
        and CLI-C-005.
    - id: PRJ-C-006
      statement: The therapy surface expresses verification, recording and escalation. It carries
        no approval and no release member, so treatment-readiness verification can never express plan-release
        authority.
      source_constraint: a professional surface expresses only its own profession's interaction kinds
      applies_to:
      - TherapyTask
      traceability: source-derived professional interaction
      enforcement: 'MPS metamodel typing: taskKind is typed by an enumeration owned by this language,
        and the four professional enumerations share no member; tools/mps/check_role_ontology.py checks
        the disjointness and the profession-specific prohibitions'
      proof_status: active at MPS-3, proven at gate level
      negative_example: TherapyTask.taskKind retyped as RadoncTaskKindEnum, or TherapyTaskKindEnum
        gaining a member belonging to another profession's surface. Both are rejected by the projection
        rules.
      positive_example: 'TherapyTask.taskKind typed TherapyTaskKindEnum. delivery_readiness_recording
        records that setup and parameters were verified. It is not a release decision: no release
        or approval member exists in this enumeration, so recording readiness cannot be mistaken for
        authorizing delivery of an unapproved plan.'
    - id: PRJ-C-007
      statement: A professional view is read-only by construction. It declares no ActionRef child
        and no action-bearing feature, so a review surface cannot become an actionable one by editing
        an instance.
      source_constraint: read-only review surfaces are distinguished from actionable ones
      applies_to:
      - TherapyView
      traceability: workflow projection
      enforcement: gate-level structural rule, tools/mps/check_role_ontology.py
      proof_status: active at MPS-3, proven at gate level
      negative_example: TherapyView gaining a child targeting ActionRef, or a boolean actionable property
        that an instance could flip. The structural absence is the enforcement; a flag would not be.
      positive_example: TherapyView holding only subjects, each a SemanticTargetRef.
    - id: PRJ-C-008
      statement: Professional projections of different professions reference the same authoritative
        semantic object. No profession owns a copy of an object another profession also inspects.
      source_constraint: different professional projections reference one authoritative semantic object
      applies_to:
      - TherapyProjection
      - TherapyView
      traceability: workflow projection
      enforcement: MPS behavioural demonstration on instances at MPS-3, plus the gate-level prohibition
        on profession-owned semantic concepts
      proof_status: active at MPS-3, behavioural proof owed at MPS-MAT-005C
      negative_example: Two profession-owned copies of one candidate plan, for example a TherapyPlan
        concept holding its own dose data. Rejected at gate level by PRJ-C-002 before any instance
        exists.
      positive_example: 'The frozen shared-state proof case: a RadoncView subject and a PhysicsView
        subject whose SemanticTargetRef.target resolve to the same CandidatePlan node reference, demonstrated
        by comparing the resolved target node references and finding them equal.'

cardinality_audit:
  method: >-
    A controlled experiment run against the live toolchain during this freeze, on one
    concept, nltps.governance.structure.RequirementBaseline, in the proof sandbox. One
    probe omitted the mandatory child version, the other omitted the mandatory reference
    lifecycleState. Both probes were deleted afterwards and the sandbox model restored
    byte-identical.
  results:
    - feature_kind: child
      cardinality: "1"
      node_level_problems: silent
      feature_descriptor: "ERROR: No child in the obligatory role 'version'"
      file_inspection: silent
      native_build: passes
    - feature_kind: reference
      cardinality: "1"
      node_level_problems: silent
      feature_descriptor: "ERROR: No reference in the obligatory role 'lifecycleState'"
      file_inspection: silent
      native_build: passes
  finding: >-
    Children and references behave identically. MPS does enforce cardinality 1 on both,
    and reports the violation on the feature descriptor rather than in the node-level
    problems array. Neither is caught by file inspection or by a native build.
  correction: >-
    This overturns the finding recorded at MPS-2, which stated that MPS does not enforce
    cardinality 1 on a reference. That conclusion came from a reader that printed only the
    node-level problems array and therefore discarded the diagnostic. The defect was the
    reader, not the toolchain. stage-a-checklist.yaml MPS-MAT-005B and CLAUDE.md are
    corrected in the same commit. The MPS-2 acceptance itself is unchanged: CLI-C-006 was
    demonstrated with five separate diagnostics and remains proven.
  consequence_for_mps3: >-
    Structural cardinality is a proven enforcement mechanism for presence, so no MPS-3
    constraint writes a redundant presence rule. The obligation moves to read-back
    discipline instead: a session that inspects only node-level problems will not see an
    obligatory-role violation.
  explicit_presence_rules_required: >-
    None. Every MPS-3 reference declared cardinality 1 is intendedRole, whose presence the
    metamodel reports. CLI-C-006 keeps its explicit reference checks from MPS-2: they are
    now defence in depth and an attributable, constraint-named diagnostic rather than a
    substitute for absent enforcement.

instantiability_at_freeze:
  method: >-
    Cumulative across mps1, mps2 and this specification, computed by
    check_concept_features.compute_reachability. Traversal starts at rootable concepts,
    follows child containment, counts children inherited from superconcepts, and allows
    subconcept substitution. An abstract concept is instantiable only through a concrete
    subconcept that is itself reachable.
  paths:
    RoleProjection:
      status: instantiable
      path: "<Prof>Projection (concrete, rootable) is a subconcept of RoleProjection"
      note: >-
        RoleProjection stays abstract and non-rootable. It becomes instantiable because a
        concrete subconcept is reachable, which is the distinction the MPS-2 lapse-rule fix
        introduced.
    RoleCommand:
      status: instantiable
      path: "<Prof>Projection (root) -> tasks -> <Prof>Task, a concrete subconcept of RoleCommand"
    SemanticTargetRef:
      status: instantiable
      path: >-
        <Prof>Projection (root) -> views -> <Prof>View -> subjects -> SemanticTargetRef,
        and independently <Prof>Projection -> tasks -> <Prof>Task -> targets (inherited
        from RoleCommand) -> SemanticTargetRef
    ActionRef:
      status: instantiable
      path: "<Prof>Projection (root) -> tasks -> <Prof>Task -> actions (inherited) -> ActionRef"
    WorkflowStateRef:
      status: instantiable
      path: "<Prof>Projection (root) -> tasks -> <Prof>Task -> states (inherited) -> WorkflowStateRef"
    OperationalRoleRef:
      status: instantiable
      path: "<Prof>Projection (root) -> tasks -> <Prof>Task -> roles (inherited) -> OperationalRoleRef"
  orphan_report_after_mps3: empty
  no_semantic_core_leak: >-
    Adding the twelve concepts makes sixteen concepts newly reachable: the twelve
    themselves and the four roles.common holders. No foundation, governance,
    clinicalintent or realization concept becomes reachable. EXTENDS makes a language's
    concepts available as superconcepts and DEFAULT makes them referable; neither creates
    a containment path, and reachability follows containment only. This was computed, not
    asserted.

deferral_transitions:
  - constraints: [ROL-C-002, ROL-C-003]
    from: deferred at MPS-2, non_instantiability
    to: ACTIVE at MPS-3, deferral lapsed automatically
    affected_concepts: [RoleCommand, SemanticTargetRef]
    trigger: >-
      The concrete professional projections make RoleCommand and SemanticTargetRef
      instantiable. non_instantiability is the class that lapses automatically on
      instantiability, so no human reactivation decision is required and none was made;
      check_materialization_plan fails while a lapsed deferral remains recorded as active.
    contrast_with_gov_c_007: >-
      GOV-C-007 was semantic_model_absence, which never lapses on its own and required the
      deliberate reclassification recorded at MPS-2. These two are the other class.
    carried_to: MPS-MAT-005C
    not_proven_here: >-
      Lapsing makes the obligation active, not demonstrated. The behavioural proof belongs
      to MPS-3 materialization and is owed against MPS-MAT-005C.
    proof_design:
      ROL-C-002:
        affected_concept: RoleCommand
        instantiability_path: "<Prof>Projection (root) -> tasks -> <Prof>Task"
        negative_example: >-
          A <Prof>Task containing an ActionDefinition directly instead of an ActionRef
          holder. The specification gate rejects the shape; the behavioural demonstration
          is that no such child role exists on an instantiated task.
        positive_control: >-
          A <Prof>Task holding an ActionRef whose action resolves to an ActionDefinition,
          accepted with no problem reported.
        expected_mechanism: >-
          MPS metamodel containment typing, read back from the instantiated task, plus the
          gate-level containment check.
      ROL-C-003:
        affected_concept: SemanticTargetRef
        instantiability_path: >-
          <Prof>Projection (root) -> views -> <Prof>View -> subjects -> SemanticTargetRef
        negative_example: >-
          A holder carrying a second reference or a multi-valued one; the specification
          gate rejects a multi-valued reference outright.
        positive_control: >-
          A SemanticTargetRef instance carrying exactly one resolved target, accepted.
        expected_mechanism: >-
          MPS metamodel cardinality on the holder reference, now empirically confirmed to
          report an unset obligatory reference on the reference descriptor.

shared_state_proof_design:
  claim: >-
    Two different professional projections reference one authoritative semantic object,
    and neither owns a copy.
  construction: >-
    One CandidatePlan-typed ClinicalObjectType instance already exists in the proof
    sandbox under PlanIntentProof. A RadoncProjection holds a RadoncView whose subjects
    contain a SemanticTargetRef targeting it; a PhysicsProjection holds a PhysicsView
    whose subjects contain a SemanticTargetRef targeting the same node.
  evidence_required: >-
    Read both SemanticTargetRef target references back from MPS and compare the resolved
    node references for equality. Equal references are the proof; two structurally similar
    objects would not be.
  negative_control: >-
    A profession-owned duplicate, for example a RadoncPlan concept, is rejected at gate
    level by PRJ-C-002 before any instance can exist.
  carried_to: MPS-MAT-005C

gov_c_007_unchanged: >-
  GOV-C-007 was discharged at MPS-2 by CLI-C-005 and its five-case actor-kind matrix.
  MPS-3 neither recreates nor moves it. The professional projections consume the
  authorization model; they do not own the A4 authority predicate, and no MPS-3 constraint
  restates it.

