schema_version: "0.1"
register_id: MPS3-CF-001
title: MPS-3 concept feature specification, the four professional projection languages
status: proposed_pending_accountable_review
decision: ADR-001
architecture_baseline: ENG-PKG-01-v0.6
implementation_state: specification_not_live_mps_serialization

purpose: >-
  The blueprint names twelve concepts across four professional languages and stops at the
  name. This file fixes owner, superconcept, rootability, properties, datatypes, children,
  references, cardinalities, editors and constraints before the first concept is created,
  so MPS-3 is transcription against a reviewed design rather than design at the keyboard.

authority: >-
  Proposed. Nothing here is approved, and creating a concept in MPS does not approve it.
  Freezing fixes the shape the materialization session must transcribe; it makes no claim
  of clinical correctness, risk acceptability, or approval.

governing_invariant: >-
  Semantic languages own authoritative state. Professional role languages own projections,
  commands, review surfaces and role-specific authoring interactions. There is exactly one
  authoritative object for treatment intent, prescription and constraint state, candidate
  plan, workflow state, approval state, evidence, technical review state and
  treatment-readiness state, and it lives in a semantic-core language. A professional
  language references those objects and never copies them.

why_three_concepts_per_profession: >-
  The allocation was tested rather than assumed. Each professional surface needs a
  concrete rootable projection, a read-only review grouping, and an actionable command;
  that is three. The six or seven candidate interactions per profession are not concepts:
  each is a member of a profession-owned enumeration on the command, and the clinical verb
  it invokes is an ActionDefinition instance in clinicalintent reached through the
  inherited ActionRef holder. Making a concept per verb would put clinical vocabulary in
  the projection layer, which is precisely what the governing invariant forbids, and would
  duplicate ActionDefinition. Twelve concepts is therefore the design answer and not a
  count preserved for its own sake; the cumulative ceiling stays 78 because the design did
  not move it.

blueprint_amendment:
  what: >-
    Each professional language gains a DEFAULT dependency on nltps.clinicalintent, in
    language-skeleton.json and in spec/architecture.yaml mps_language_constraints.
  why: >-
    The projection must name the professional context it is written for, and
    ProfessionalRole is owned by clinicalintent. Before the amendment a professional
    language could see only itself, nltps.roles.common and nltps.foundation, so
    intendedRole had no legal target. DEFAULT is the correct kind: the dependency policy
    defines it as visibility for behavior, constraints and references only, and the
    containment gate continues to reject any attempt to contain a clinicalintent concept.
  what_it_did_not_change: >-
    No concept was added or removed. The MPS-3 ceiling derives to 78 before and after.
  rejected_alternatives: >-
    Binding context through the inherited OperationalRoleRef holder would conflate the
    credential with the workflow function, which mps2-role-ontology.yaml
    separation_of_concerns forbids. A string property naming the profession would be an
    uncontrolled string that resolves to no authoritative node.

representation_policy: >-
  MPS offers three primitive datatypes and no real or date; nothing in MPS-3 needs either.
  MPS properties are single-valued and reference links are 1 or 0..1, so every projection
  collection is a child of a holder concept. No property or reference in this
  specification is multi-valued.

authorization_separation: >-
  Authority is never expressed in the projection layer. A professional task names an
  interaction with a profession-owned enumeration and names an action by referencing an
  ActionDefinition; whether an actor may perform that action is decided by AuthorityPolicy,
  RoleCapability and the CLI-C-005 predicate that discharged GOV-C-007 at MPS-2. MPS-3
  neither owns nor restates that predicate. The four task-kind enumerations share no
  member, so the separation between clinical approval, technical release review, planning
  interaction and readiness verification is structural: a task cannot carry another
  profession's interaction kind, whatever the editor offers.

read_back_requirement: >-
  MPS-2 created 34 of 37 links with the metamodel default cardinality while every call
  returned ok true and the model check reported no problems. For MPS-3 the materialization
  session shall read every created link back individually and compare sourceCardinality
  and metaClass against this specification, feature by feature. Batch-call success and a
  clean model check are not evidence. Read-back shall inspect the feature descriptors on
  each node, not only the node-level problems array: obligatory-role violations for both
  children and references are reported there and are invisible to a reader that looks only
  at the node level.

datatypes:
- name: RadoncTaskKindEnum
  kind: enumeration
  owner: nltps.roles.radonc
  logical_type: enumeration
  mps_type: EnumerationDeclaration
  values:
  - prescription_review
  - target_intent_review
  - clinical_priority_review
  - candidate_plan_comparison
  - clinical_tradeoff_acceptance
  - plan_revision_request
  - clinical_approval
  source: ConOps professional interaction surfaces
  traceability: source-derived professional interaction
  carried_by: RadoncTask.taskKind
  note: clinical_approval is the only approval member anywhere in the projection layer, and it is
    expressible only here. It names the interaction; whether a particular actor may perform it is
    decided by RoleCapability and CLI-C-005, not by this enumeration. An EnumerationDeclaration is
    not a ConceptDeclaration, so the four enumerations cost nothing against the 78 concept ceiling.
- name: PhysicsTaskKindEnum
  kind: enumeration
  owner: nltps.roles.physics
  logical_type: enumeration
  mps_type: EnumerationDeclaration
  values:
  - technical_plan_review
  - machine_configuration_review
  - robustness_review
  - dose_algorithm_review
  - technical_release_review
  - independent_verification_request
  - qa_safety_escalation
  source: ConOps professional interaction surfaces
  traceability: source-derived professional interaction
  carried_by: PhysicsTask.taskKind
  note: technical_release_review is a technical judgement, not a clinical one. clinical_approval does
    not exist in this enumeration, so no physics task can express physician clinical approval. An
    EnumerationDeclaration is not a ConceptDeclaration, so the four enumerations cost nothing against
    the 78 concept ceiling.
- name: DosimetryTaskKindEnum
  kind: enumeration
  owner: nltps.roles.dosimetry
  logical_type: enumeration
  mps_type: EnumerationDeclaration
  values:
  - planning_strategy_authoring
  - optimization_objective_setting
  - candidate_generation
  - candidate_refinement
  - tradeoff_documentation
  - physics_review_request
  source: ConOps professional interaction surfaces
  traceability: source-derived professional interaction
  carried_by: DosimetryTask.taskKind
  note: 'Every member is authoring, documentation or request. There is deliberately no approval member
    of any kind: preparing a plan is not approving it, and the enumeration is where that distinction
    is made unforgeable. An EnumerationDeclaration is not a ConceptDeclaration, so the four enumerations
    cost nothing against the 78 concept ceiling.'
- name: TherapyTaskKindEnum
  kind: enumeration
  owner: nltps.roles.therapy
  logical_type: enumeration
  mps_type: EnumerationDeclaration
  values:
  - treatment_setup_review
  - treatment_parameter_verification
  - transfer_verification
  - delivery_readiness_recording
  - setup_conflict_escalation
  source: ConOps professional interaction surfaces
  traceability: source-derived professional interaction
  carried_by: TherapyTask.taskKind
  note: 'delivery_readiness_recording records that setup and parameters were verified. It is not a
    release decision: no release or approval member exists in this enumeration, so recording readiness
    cannot be mistaken for authorizing delivery of an unapproved plan. An EnumerationDeclaration is
    not a ConceptDeclaration, so the four enumerations cost nothing against the 78 concept ceiling.'
languages:
  nltps.roles.radonc:
    professional_responsibility: clinical intent and clinical acceptability
    intended_professional_role: RadiationOncologist
    concepts:
    - owner: nltps.roles.radonc
      name: RadoncProjection
      rootable: true
      abstract: false
      superconcept: RoleProjection
      traceability: authorization projection
      intent: 'File-per-root Radiation Oncologist workspace. It is the concrete rootable projection
        that gives clinical intent and clinical acceptability a professional surface over shared semantic
        state. It owns no clinical state: every object it presents is reached by reference through
        a holder, never contained. Being concrete and rootable is what finally makes the roles.common
        infrastructure instantiable.'
      source: language-skeleton.json root_concepts; mps2-role-ontology.yaml roles_common_holder_purpose;
        ADR-001 role-language ownership invariant
      properties: []
      inherited_properties:
      - name: projectionName
        from: RoleProjection
        type: string
        cardinality: '1'
      children:
      - name: views
        target: RadoncView
        cardinality: 0..n
      - name: tasks
        target: RadoncTask
        cardinality: 0..n
      references:
      - name: intendedRole
        target: ProfessionalRole
        cardinality: '1'
        note: 'The professional context this projection is written for. It is a reference into clinicalintent
          through the DEFAULT dependency added for MPS-3, so it is visibility without containment.
          It establishes intended context and confers nothing: authority is resolved by RoleCapability
          and the CLI-C-005 predicate, never by this link.'
      editor: radiation oncologist projection <projectionName> for <intendedRole> { <views> <tasks>
        }
      editor_responsibilities:
      - shows the bound ProfessionalRole read-only, so professional context is visible but not silently
        editable from the projection surface
      - groups read-only views above actionable tasks so the two are never confused at the point of
        use
      - surfaces validation feedback from the constraint set inline on the offending task rather than
        on the root
      constraints:
      - PRJ-C-001
      - PRJ-C-002
      - PRJ-C-003
      - PRJ-C-004
      - PRJ-C-005
      - PRJ-C-008
    - owner: nltps.roles.radonc
      name: RadoncView
      rootable: false
      abstract: false
      superconcept: BaseConcept
      traceability: workflow projection
      intent: 'A read-only review surface grouping the shared semantic objects a Radiation Oncologist
        inspects, for example prescription and candidate-plan review for one patient-free governance
        case. It is read-only by construction rather than by a flag: it declares no ActionRef child,
        so there is no structural way for a view to carry an action.'
      source: language-skeleton.json non_root_concepts; role-specific review views
      properties:
      - name: viewName
        type: string
        cardinality: '1'
        note: 'A display label for the grouping. It carries no semantics: every object under review
          is a typed SemanticTargetRef, so the label can never be the only thing identifying what
          is shown.'
      children:
      - name: subjects
        target: SemanticTargetRef
        cardinality: 0..n
        note: Holders owned by roles.common, contained legally through EXTENDS. Each carries one scalar
          reference to a GovernedElement, which is how two professions inspect one authoritative object.
      references: []
      editor: radonc view <viewName> { <subjects> }
      editor_responsibilities:
      - renders every subject read-only, with the referenced object's own identifier shown rather
        than a local copy of its name
      - offers no action affordance at all, matching the structural absence of ActionRef
      constraints:
      - PRJ-C-002
      - PRJ-C-003
      - PRJ-C-007
      - PRJ-C-008
    - owner: nltps.roles.radonc
      name: RadoncTask
      rootable: false
      abstract: false
      superconcept: RoleCommand
      traceability: source-derived professional interaction
      intent: One actionable Radiation Oncologist interaction with governed semantic state. The interaction
        it represents is typed by RadoncTaskKindEnum and the action it invokes is a referenced ActionDefinition,
        so neither the clinical verb nor the authority to perform it lives in this language. Being
        a concrete RoleCommand is what makes RoleCommand and the four holders instantiable.
      source: ConOps professional interaction surfaces; mps2-role-ontology.yaml roles_common_holder_purpose
      properties:
      - name: taskKind
        type: RadoncTaskKindEnum
        cardinality: '1'
        note: Typed, not a string. The profession's interaction vocabulary is an enumeration owned
          by this language, which is what makes the boundary between professions structural instead
          of advisory.
      inherited_properties:
      - name: commandName
        from: RoleCommand
        type: string
        cardinality: '1'
      inherited_children:
      - name: targets
        from: RoleCommand
        target: SemanticTargetRef
        cardinality: 0..n
      - name: actions
        from: RoleCommand
        target: ActionRef
        cardinality: 0..n
      - name: states
        from: RoleCommand
        target: WorkflowStateRef
        cardinality: 0..n
      - name: roles
        from: RoleCommand
        target: OperationalRoleRef
        cardinality: 0..n
      children: []
      references: []
      editor: radonc task <taskKind> <commandName> { on <targets> invoking <actions> in <states> as
        <roles> }
      editor_responsibilities:
      - shows taskKind as a typed choice, never free text
      - shows the invoked ActionDefinition and its autonomyLevel read-only, so the user can see that
        an A4 action is being proposed without the editor implying it will be permitted
      - 'presents the task as a request: the surface never renders an outcome, because the outcome
        is decided by the governed workflow'
      - escalation and review-request kinds render identically to other kinds, so no visual affordance
        suggests additional authority
      constraints:
      - PRJ-C-002
      - PRJ-C-003
      - PRJ-C-005
      - PRJ-C-006
    constraints:
    - id: PRJ-C-001
      statement: A professional projection may reference authoritative semantic state owned by another
        language, provided that language is declared as a dependency. Reference visibility follows
        the declared EXTENDS ancestry and DEFAULT dependencies, and nothing else.
      source_constraint: professional projections reference authoritative semantic state through declared
        dependencies
      applies_to:
      - RadoncProjection
      traceability: authorization projection
      enforcement: gate-level structural rule, tools/mps/check_concept_features.py reference visibility
        check
      proof_status: active at MPS-3, proven at gate level
      negative_example: RadoncProjection.intendedRole targeting ProfessionalRole while nltps.roles.radonc
        declares no dependency on nltps.clinicalintent. The gate rejects the reference as targeting
        a language the owner cannot see.
      positive_example: 'The frozen design: nltps.roles.radonc declares nltps.clinicalintent DEFAULT,
        so intendedRole resolves. False rejection here would make the whole projection layer unable
        to name the semantics it projects, so the positive control matters as much as the negative
        one.'
    - id: PRJ-C-002
      statement: A professional projection concept declares no property, child or reference that re-expresses
        clinical state. It introduces no prescription, candidate plan, dose constraint, approval state
        or workflow state of its own; every such object is referenced through a holder.
      source_constraint: the projection introduces no clinical semantics of its own
      applies_to:
      - RadoncProjection
      - RadoncView
      - RadoncTask
      traceability: authorization projection
      enforcement: gate-level structural rule, tools/mps/check_concept_features.py containment check
        plus tools/mps/check_role_ontology.py projection rules
      proof_status: active at MPS-3, proven at gate level
      negative_example: A concept RadoncPrescription or RadoncPlan owned by nltps.roles.radonc, or
        RadoncTask gaining a property typed AutonomyLevelEnum or AuthorityClassEnum, which would re-express
        authority in the projection layer.
      positive_example: RadoncTask.taskKind typed RadoncTaskKindEnum, an enumeration owned by this
        language describing an interaction, not authority.
    - id: PRJ-C-003
      statement: A professional projection concept may contain only concepts owned by its own language
        or by a transitive EXTENDS ancestor. A DEFAULT dependency permits references and never containment.
      source_constraint: containment stays within the EXTENDS ancestry
      applies_to:
      - RadoncProjection
      - RadoncView
      - RadoncTask
      traceability: MPS representation scaffolding
      enforcement: gate-level structural rule, tools/mps/check_concept_features.py containment check
      proof_status: active at MPS-3, proven at gate level
      negative_example: RadoncView declaring a child targeting ClinicalObjectType, which nltps.roles.radonc
        can see only through the DEFAULT dependency on nltps.clinicalintent. The gate rejects it as
        containment through a DEFAULT dependency.
      positive_example: RadoncView.subjects containing SemanticTargetRef, owned by nltps.roles.common,
        which nltps.roles.radonc EXTENDS. This must not be rejected.
    - id: PRJ-C-004
      statement: A professional projection binds exactly one intended ProfessionalRole. The binding
        establishes professional context only; it is not an authorization and confers no permission.
      source_constraint: the professional projection resolves to its intended professional context
      applies_to:
      - RadoncProjection
      traceability: authorization projection
      enforcement: MPS metamodel cardinality 1 for presence, verified empirically at the MPS-3 freeze;
        plus a gate rule that the binding targets ProfessionalRole and not OperationalRole, RoleCapability
        or AuthorizedActor
      proof_status: active at MPS-3
      negative_example: RadoncProjection.intendedRole retargeted at OperationalRole, which would conflate
        the credential with the workflow function and contradict mps2-role-ontology.yaml separation_of_concerns.
        Separately, a RadoncProjection instance with intendedRole unset, which MPS reports as "No
        reference in the obligatory role 'intendedRole'" on the reference descriptor.
      positive_example: intendedRole bound to the RadiationOncologist ProfessionalRole instance, with
        authority still decided by RoleCapability.
      note: The MPS-3 freeze re-tested obligatory-role enforcement empirically and found that MPS
        does report a missing mandatory reference, on the reference descriptor rather than in the
        node-level problems array. No additional checking rule is therefore written for presence;
        the read-back requirement is that the materialization session inspects feature descriptors,
        not only node-level problems.
    - id: PRJ-C-005
      statement: The projection layer declares no authorization feature. No professional concept references
        RoleCapability, AuthorityPolicy or AuthorizedActor, and none declares a property typed by
        an enumeration owned by a semantic-core language. Seeing a command in an editor is not evidence
        of authority to execute it.
      source_constraint: editor visibility does not grant authorization
      applies_to:
      - RadoncProjection
      - RadoncTask
      traceability: authorization projection
      enforcement: gate-level structural rule, tools/mps/check_role_ontology.py
      proof_status: active at MPS-3, proven at gate level
      negative_example: RadoncTask gaining a reference to RoleCapability, which would let the projection
        carry its own authorization decision, or a property typed AutonomyLevelEnum, which would let
        it restate the A4 discriminator that CLI-C-005 owns.
      positive_example: RadoncTask referencing an ActionDefinition through the inherited ActionRef
        holder. The action is named; the authority to perform it is resolved elsewhere, by AuthorityPolicy
        and CLI-C-005.
    - id: PRJ-C-006
      statement: 'The radonc surface expresses clinical review and clinical approval. It expresses
        no technical release, no machine configuration, no optimization objective and no delivery
        readiness: those members do not exist in RadoncTaskKindEnum, so a radonc task cannot carry
        them at all.'
      source_constraint: a professional surface expresses only its own profession's interaction kinds
      applies_to:
      - RadoncTask
      traceability: source-derived professional interaction
      enforcement: 'MPS metamodel typing: taskKind is typed by an enumeration owned by this language,
        and the four professional enumerations share no member; tools/mps/check_role_ontology.py checks
        the disjointness and the profession-specific prohibitions'
      proof_status: active at MPS-3, proven at gate level
      negative_example: RadoncTask.taskKind retyped as PhysicsTaskKindEnum, or RadoncTaskKindEnum
        gaining a member belonging to another profession's surface. Both are rejected by the projection
        rules.
      positive_example: RadoncTask.taskKind typed RadoncTaskKindEnum. clinical_approval is the only
        approval member anywhere in the projection layer, and it is expressible only here. It names
        the interaction; whether a particular actor may perform it is decided by RoleCapability and
        CLI-C-005, not by this enumeration.
    - id: PRJ-C-007
      statement: A professional view is read-only by construction. It declares no ActionRef child
        and no action-bearing feature, so a review surface cannot become an actionable one by editing
        an instance.
      source_constraint: read-only review surfaces are distinguished from actionable ones
      applies_to:
      - RadoncView
      traceability: workflow projection
      enforcement: gate-level structural rule, tools/mps/check_role_ontology.py
      proof_status: active at MPS-3, proven at gate level
      negative_example: RadoncView gaining a child targeting ActionRef, or a boolean actionable property
        that an instance could flip. The structural absence is the enforcement; a flag would not be.
      positive_example: RadoncView holding only subjects, each a SemanticTargetRef.
    - id: PRJ-C-008
      statement: Professional projections of different professions reference the same authoritative
        semantic object. No profession owns a copy of an object another profession also inspects.
      source_constraint: different professional projections reference one authoritative semantic object
      applies_to:
      - RadoncProjection
      - RadoncView
      traceability: workflow projection
      enforcement: MPS behavioural demonstration on instances at MPS-3, plus the gate-level prohibition
        on profession-owned semantic concepts
      proof_status: active at MPS-3, behavioural proof owed at MPS-MAT-005C
      negative_example: Two profession-owned copies of one candidate plan, for example a RadoncPlan
        concept holding its own dose data. Rejected at gate level by PRJ-C-002 before any instance
        exists.
      positive_example: 'The frozen shared-state proof case: a RadoncView subject and a PhysicsView
        subject whose SemanticTargetRef.target resolve to the same CandidatePlan node reference, demonstrated
        by comparing the resolved target node references and finding them equal.'
  nltps.roles.physics:
    professional_responsibility: technical correctness and technical release readiness
    intended_professional_role: MedicalPhysicist
