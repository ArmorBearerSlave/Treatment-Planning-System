        worktree_index_baseline_blob: a698ce13eb679605a93baa42a58e826c73a63234
        all_three_equal: true
      - path: mps/NLTPSGovernance/tests/nltps.modeltests/nltps.modeltests.msd
        worktree_index_baseline_blob: 91133fc2da7f83bf0b8cedb03ab2f3a55bceb8a6
