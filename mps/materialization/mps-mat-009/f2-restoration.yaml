destroyed_measurement_baseline:
  classification: MEASUREMENT FAILURE, retained separately, not reconstructed
  what_was_lost: >-
    The producer workspace's pre-experiment derived path-set manifest. It was never captured,
    because a cold generation was run over that workspace -- deleting all 34 generated
    directories and regenerating them with the experimental test present -- before the
    requirement to capture it existed.
  cause: the remediation actor's own action, one command before the requirement arrived
  why_it_is_recorded_rather_than_reconstructed: >-
    A reconstruction is not the historical observation. The independent cold baseline
    reconstruction below is a different object with a different warrant, and describing it as
    the destroyed manifest would be exactly the substitution this programme exists to refuse.
  what_survives_of_it: >-
    The PERTURBED derived manifest was captured before any further change: 1947 files
    project-wide, 11 under tests/nltps.modeltests, including the three experimental paths
    GOV_C_004_literal_hazard_mitigates_verification_claim_Test.java, the corresponding .class
    and its $TestBody.class. That is an observation of the perturbed state, not of the
    pre-experiment state.
  consequence_for_the_verdict: >-
    None, because the comparison performed is A against B rather than pre-experiment against
    post-restoration, and A is authoritative on stronger grounds. The loss is recorded because
    a destroyed measurement baseline is a finding whether or not a substitute exists.

independent_cold_baseline_reconstruction:
  label: INDEPENDENT COLD BASELINE RECONSTRUCTION
  explicitly_not: the destroyed historical pre-experiment manifest
  workspace: the independent repair workspace, never MPS-attached during this experiment
  admissibility:
    criterion: >-
      Model admissibility is determined by the model under generation, not by HEAD. Changes
      elsewhere in the workspace -- tools/, mps/materialization/, the finding register, the
      remediation instrumentation -- are not inputs to MPS generation and do not disqualify it.
    model_tree_sha256: 7a7f23626af65d467e9d72253d68f7c1819a3c1b6a9f8b7f22b1b26bde7774d3
    equals_baseline: true
    git_diff_mps_NLTPSGovernance: clean
    git_diff_cached_mps_NLTPSGovernance: clean
    git_status_mps_NLTPSGovernance: empty
    head_incidentally: 1b588953b31205ace9d3a2adb35280008d2cdd9e
    head_not_relied_upon: true
  procedure:
    - derived output verified absent before generation; zero derived directories present
    - worker system, config, log and reports state cleared
    - cold regenerate and compile with the pinned MPS toolchain, MPS-261.25134.779
    - exit code 0, 57 seconds
  why_it_is_authoritative_for_derived_set_comparison: >-
    It is regenerated from the baseline model into a workspace that had never accumulated any
    derived output at all, rather than inferred from a historically accumulated work tree. A
    historically accumulated tree can carry residue from earlier runs -- which is the whole
    substance of POST-MPS4-01 -- so it answers "what has this tree got" rather than "what does
    this model produce". Only the second question is the one restoration needs answered.

