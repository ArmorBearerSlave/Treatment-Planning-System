    - model_tree_sha256 == 7a7f23626af65d467e9d72253d68f7c1819a3c1b6a9f8b7f22b1b26bde7774d3
    - git diff --exit-code == clean
    - git diff --cached --exit-code == clean
    - >-
      for every path git status names: hash-object(worktree) == index blob == baseline blob
  observed:
    head: 1b588953b31205ace9d3a2adb35280008d2cdd9e
    model_tree_sha256: 7a7f23626af65d467e9d72253d68f7c1819a3c1b6a9f8b7f22b1b26bde7774d3
