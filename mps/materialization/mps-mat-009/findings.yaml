      This finding said at C6 that "a branch with an empty population is an untested branch,
      and C6 is what emptied it". That is false and is withdrawn. It asserted a transition
      from occupied to empty which never happened: the prose sub-case had zero
      canonical-CLOSED members before C6, at C6, and after it. The wording is preserved here
