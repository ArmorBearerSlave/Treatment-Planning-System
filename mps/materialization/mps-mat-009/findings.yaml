  - id: MI-R-04
    origin: independent review of ae47513
    acceptance_blocking: true
    locus: [MEASUREMENT_PATH]
    title: One MI regression failed on a cold tree; another passed vacuously
    claim: >-
      Round 1's derived_manifest controls enumerated the repository's own project directory,
