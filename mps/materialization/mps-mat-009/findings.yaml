  - id: NF-16
    origin: >-
      independent review of 3e397dc, the C6 completion-model checkpoint
    observed_at_object: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
    no_primary_artifact_retention_is_declared: >-
      The review's primary artifacts were not transported. This record is the controlled
      statement of the finding, and its measurements below were independently reproduced
      here rather than copied from the review.
    acceptance_blocking: false
    state: OPEN
    locus: [MEASUREMENT_PATH]
    title: >-
      The completion field had two different presence semantics across the branches that
      consume it
    claim: >-
      The controlled rule says a repair_completion_object is declared, not that it is truthy.
      completion_declaration_problems tested key membership and was right. Four other
      branches tested truthiness. A completion field physically present with a falsy value --
      written with no value, or as "", 0, or false -- was therefore rejected by one observer
      while being silently redirected or skipped by those four. The same field had two
      populations depending on who asked.
    truthiness_consumers_at_c6:
      at_object: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
      method: >-
        Derived by parsing the module at that object and attributing every .get() call on the
        completion field to its enclosing definition. Named rather than counted, because a
        count is what was wrong here: NF-16 originally said three and there were four.
      units:
        - closure_target
        - CompletionObjectMutations.test_the_original_repair_field_was_never_rewritten
        - CompletionObjectMutations.test_no_completion_declaration_moved_a_finding_to_closed
        - CompletionObjectMutations.test_prose_without_the_typed_field_confers_nothing
      also_present_but_not_a_declaration_test: >-
        CompletionObjectMutations.test_exact_match_to_the_registered_review_object_passes read
        the field with .get() and compared the result for equality. It is listed separately
        because it selects rather than tests declaration, and it was repaired at C7 with the
        other four.
    withdrawn_consumer_count: >-
      This finding said "Three other branches tested truthiness" and named closure_target and
      two safety controls. That was wrong: the fourth,
      test_prose_without_the_typed_field_confers_nothing, was repaired at C7 in the same
      commit and was described in the C7 report as "a fourth site of the same class", but the
      controlled record was never brought level with what the repair actually covered. The
      wording is preserved rather than deleted. An understated defect population is the
      failure this register already names -- a diagnostic count is not a defect population --
      and here the record understated a population its own author had already enumerated
      correctly elsewhere.
    what_the_redirection_would_have_done: >-
      For a CLOSED finding declaring an unreadable completion object, closure_target under
      the C6 form returns the repair field instead. Where the repair field names the reviewed
      object -- which is the normal case for a closed finding, and is exactly NF-13's shape --
      the closure comparison then succeeds. closure_problems alone would have passed a finding
      whose completion declaration could not be read.
    why_it_was_not_exploitable: >-
      completion_declaration_problems resolves its population by key membership, so it
      rejected every falsy value independently and the aggregate suite stayed red. That is a
      property of two controls failing together, not a property either one has. Nothing
      coupled them and nothing would have noticed if one moved; the safety controls had no
      failure mode of their own for this input. Recorded as a soundness gap in the completion
      model's internal consistency rather than as an exploitable defect, because that is what
      it is.
    independently_reproduced:
      method: >-
        Behavioural, not by source inspection. Each falsy value was written into the register
        as YAML, loaded, and each consumer executed against the loaded record. Failure
        sensitivity was established by reinstating the C6 form of closure_target and
        re-running the controls.
      falsy_values_exercised: [null, empty string, zero, false]
      note: >-
        The four values are not interchangeable illustrations of one case. 0 and false are the
        ones a reader would not predict, because they are the values YAML produces from input
        that looks like data rather than like absence -- the same coercion that produced the
        C6 integer-sha defect this register already records.
    withdrawn_measurement: >-
      This finding recorded "controls_red_against_the_c6_form: 9" and
      "controls_green_against_the_c7_form: 12" under a single at_object of 3e397dc. Both
      halves were wrong. The two numbers are not in the same unit -- 9 counted subtest failure
      RECORDS emitted by the runner, where one test method reporting four values contributes
      four, and 12 counted TEST METHODS in the class. Comparing them invites the reading that
      three controls were unaffected, which is not what either number says. And both were bound
      to 3e397dc, at which the controls did not exist: they were written at C7. The wording is
      preserved and the numbers are not restated, because a bare count is what failed here.
    discriminating_controls:
      what_this_is: >-
