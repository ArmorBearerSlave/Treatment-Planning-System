        sits outside the enforced job, and nothing has been established falsely about any
        control. This follows NF-25, which was non-blocking because no declared control failed
        to establish what it is declared to establish, and NF-27's prospective-gap basis. The
        asymmetry between the two boundary controls is recorded because it is the part a
        disposition needs, not because it is currently load-bearing.
    not_repaired_here: >-
      This is record transport. The predicate is not widened. Widening it is not obviously the
      whole repair either, since the boundary control's fail-open direction is the actual
      weakness and would remain after any finite list of recognised forms.
    residual: >-
      Open.

  - id: NF-30
