        a control that does not discriminate and omitted one that does.
      how_the_error_arose: >-
        Recorded because it is the more useful half. C8 replaced a bare count with named
        identities, which was the right correction, and then took the names from a measurement
        of a mutation the record described differently. Replacing a cardinality with an
        identity does not make evidence exact by itself. The identity has to be measured
