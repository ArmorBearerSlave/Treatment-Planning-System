  - id: NF-31
    origin: independent review of 00c6e2f, transported as IR-01
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: true
    state: OPEN
    locus: [MEASUREMENT_PATH, EVIDENCE]
    title: >-
      A changed closure model was used to move lifecycle state without the controlled pre-use
      independent-verification condition being demonstrably satisfied
    claim: >-
      repair_completion_rule.no_closure_transition_in_c6 states that a changed closure model must
      itself be independently verified before it is used to move controlled finding state. At
      00c6e2f that model was used to move four findings to CLOSED. No registered review declares
      that it verified the changed mechanism. The condition could therefore only have been
      satisfied by implication -- a later cumulative review of a descendant object that happens to
      contain the mechanism -- which is ancestry reasoning, and this register forbids ancestry as a
      substitute for exact object identity everywhere else.
    independently_reproduced: >-
      Reproduced at 00c6e2f before any repair. Zero of the thirteen registered reviews carry any
      mechanism-verification declaration under any key; the count is derived by scanning review
      record keys rather than by reading prose. There is consequently no artifact stating that the
      C6 mechanism was verified, at which object, or with what verdict.
    why_it_is_acceptance_blocking:
      determination: true
      reasoning: >-
        The register's convention marks a finding blocking when a declared control cannot establish
        what it is declared to establish. This control is declared in the controlled rule text and
        has no mechanism at all: nothing reads it, nothing enforces it, and the one occasion it
        governed passed unobserved. The gap is occupied rather than prospective, which is the NF-20
        basis for blocking rather than the NF-27 basis for non-blocking.
    not_repaired_by_reopening: >-
      Quarantining the four findings withdraws the state movement. It does not supply the missing
      mechanism, and this finding stays open until the pre-use condition is typed and observed.

  - id: NF-32
    origin: independent review of 00c6e2f, transported as IR-02
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: true
    state: OPEN
    locus: [EVIDENCE]
    title: >-
