    title: Controlled narrative in the finding register had gone stale
    claim: >-
      Two statements in the controlled record had stopped being true. NF-09's residual said
      "25 of 34 records remain state debt" while the population had become 39 records, 14
      canonical and 25 in debt. And finding_state_control described the historical
      heterogeneity as "two field names" when three relevant representations existed:
      canonical state, legacy status, and legacy disposition.
    recorded_as_a_finding_because: >-
      Repository convention already treats controlled-record inaccuracy as a finding rather
      than as an edit: RT-F-03, RT-F-04 and RT-F-05 were exactly that. Absorbing this into
      the repair commit without a record would make the register quieter about its own
      errors than about anyone else's.
    repair: this checkpoint, commit C4
    disposition: >-
      The NF-09 residual now gives the state-debt count without a denominator and names
      finding_state_control.exceptions as the derivation, rather than restating "25 of 39"
      and recreating the fragile-cardinality defect NF-01 already recorded. The
      three-representation description replaces the two-field-name one. The frozen 58d18db
      discovery baseline is preserved as measured, with an added statement of which fields it
      counted -- two, not three -- which is why its 20 "carrying neither" in fact included six
      carrying a disposition. That omission is what NF-10 later exposed.
    not_done: >-
      The historical measurement is not recomputed. A baseline that is quietly refreshed
      whenever it disagrees with the present is not a baseline.
