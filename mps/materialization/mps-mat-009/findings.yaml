    acceptance_blocking: true
    state: OPEN
    locus: [MEASUREMENT_PATH]
    title: >-
      The reachability observer read execution preservation as key presence, so declaring a
      key that preserves nothing defeated it
    claim: >-
      C8B's observer treated the presence of continue-on-error or if on a step as proof that
      the step still executes after an earlier failure. Neither key means that. `if: success()`
      is the default condition and does not run after an earlier failure; `continue-on-error:
      false` is the default value and preserves nothing. The observer asked whether a key was
      written, and the platform question is whether the step will still execute.
    independently_reproduced:
      at_object: 0db0213be250a05bf32b9466ee836a6ebf31eb19
      method: >-
        The historical topology was restored in disposable state -- reconciler at step 13 of
        34 with 21 mandatory controls behind it -- and the observer run over it.
      control_without_any_bypass: >-
        21 of 21 downstream controls correctly reported unreachable.
      with_if_success_on_19_of_21: >-
        Only 2 reported. The 19 carrying the key dropped out of the stranded population.
      with_if_success_on_all_21: >-
        No reachability problem reported at all. The historical defect was fully present and
        the observer was silent.
      with_continue_on_error_false_on_all_21: >-
        No reachability problem reported at all.
      restoration: >-
        The workflow was restored and confirmed byte-identical by an empty git diff.
    why_it_is_acceptance_blocking:
      determination: true
      reasoning: >-
        The observer exists because 21 declared mandatory controls had silently not run. A
        bypass consisting of writing the platform's own DEFAULT values is not an exotic
        mutation -- `if: success()` and `continue-on-error: false` are what those settings
        already mean when absent, so a maintainer could reintroduce the defect while believing
        they had made the workflow more explicit. This is the MI-R-05 shape, a guard that
        misses the defect shape it was written for, and it is blocking for the same reason.
    repair: >-
      C9B. Execution preservation is answered by VALUE, over a conservative recognised subset,
      and the two keys are no longer conflated. `if` governs whether a step runs at all;
      `continue-on-error` governs whether a step's own failure stops the job. They are asked of
      different steps: a later control survives either because it declares that it runs
      regardless, or because the blocking step's failure is tolerated.
    recognised_semantics:
      runs_after_an_earlier_failure: [always(), failure(), '!cancelled()']
      does_not_run_after_an_earlier_failure: [success(), cancelled(), 'no if key at all']
      failure_tolerated: ['continue-on-error: true']
      failure_not_tolerated: ['continue-on-error: false', 'no continue-on-error key at all']
      everything_else: >-
        Unresolved. An arbitrary condition and any ${{ }} expression are reported as
        measurements this observer cannot make, and they also count as stranded, so an
        unsupported form fails closed in both directions. No general expression evaluator is
