  - id: RT-F-06
    origin: independent review of d6faf77
    reviewed_object: d6faf77d517a2b369033c38a99155f666982ff1e
    acceptance_blocking: true
    blocking_scope: review-population observer design gap
    state: CLOSED
    title: A commit-scoped review was undiscoverable by a record-file-derived population
    discovered_by: independent review of d6faf77
    historical_object: d6faf77d517a2b369033c38a99155f666982ff1e
    repair: this commit
    the_gap: >-
      The population assumed every reviewable unit had a backing record file, so a legitimate
      commit-scoped review could hold a register entry that no record-file-derived population
      could discover, making it invisible to the very control meant to detect omission.
    disposition: >-
      Closed by typing membership source inside the authoritative reviewable_units
      declaration rather than adding a second classifier. E is every register entry; F is
      every reviewable_units member whose kind is record_file_backed. Both directions are
      enforced, commit-scoped units are members without a synthetic record file, and directory
      classification is defined only over record-backed units because only those have a record
      path.
    closure_derived_from: >-
      tests/test_review_records.py MutationControls A through F, none of which depends on a
      hard-coded list of review ids.

