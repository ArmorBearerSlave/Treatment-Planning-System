  - id: REC-OBS-01-METHOD
    origin: independent review of d6faf77
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH]
    title: A literal-name search cannot establish the absence of readers
    the_error_as_committed: >-
      A search for the literal string mps-mat-009 across tools/, tests/ and .github/ returned
      nothing, and absence of readers was inferred from it. The inference does not hold: a
      reader may acquire its target through a parent glob, a recursive walk, tracked-file
      enumeration, graph traversal, or any other broader population definition, and in this
      case two readers did exactly that.
    durable_rule: >-
      Absence of a literal reference to X is not absence of an observer of X.
    operationally: >-
      A name or reference search is a discovery and recall aid. Evidence of whether X is
      observed is the resolved population of each candidate reader: identify the function
      that produces that reader's input population, execute or instrument it against the
      object in question, inspect the result, and test membership. Source inspection locates
      the population function; it is not the membership proof.
    why_it_generalises: >-
      The same shape recurs whenever a search stands in for a measurement. It is the
      searching equivalent of the finding this programme keeps making: an instrument credited
      with a discrimination it does not perform.

