        controls actually distinguish the two implementations. Identities, not a cardinality,
        so it does not go stale when a control is added beside them.
      historical_red_at_the_c6_object:
        object: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
        statement: >-
          The C6 implementation is what the C7 controls were written against. No control
          existed at this object, so nothing was measured here and nothing is claimed here.
      mutation_identity:
        what_is_reinstated: >-
          The body of closure_target is replaced by the C6 form as it stood verbatim at
          3e397dc line 82, spelled with the literal field name -- a return of
          finding.get("repair_completion_object") or finding.get("repair").
        why_the_spelling_is_part_of_the_mutation_identity: >-
          NF-26. It is not incidental. A variant spelling the same defect through the
          COMPLETION_FIELD constant produces a DIFFERENT discriminator set, because one control
          asserts on the literal text of that constant access and therefore responds to the
          constant form and not to the literal one. A mutation named only as "the C6 form" does
          not determine its own answer, and the earlier version of this block described one
          spelling while having measured the other.
      c7_control_behaviour:
        object: 2f10b3e97e7461870700afb69db0ec6401326518
        control_population: >-
          CompletionPresenceSemantics as it exists at that object: twelve test methods.
        measured_by: >-
          The mutation above applied in a detached worktree at that object, the class executed,
          and the worktree removed. Measured where those controls exist, not at an earlier
          object.
        discriminating_test_methods:
          - CompletionPresenceSemantics.test_no_falsy_declared_value_silently_falls_back_to_repair
          - CompletionPresenceSemantics.test_a_falsy_declaration_on_a_closed_finding_is_reported_as_declared_not_as_absent
          - CompletionPresenceSemantics.test_no_consumer_decides_declaration_by_truthiness
      c8_control_behaviour:
        object: 0db0213be250a05bf32b9466ee836a6ebf31eb19
        control_population: >-
          The same class at that object, twelve test methods.
        measured_by: The same mutation, in a detached worktree at that object.
        discriminating_test_methods:
          - CompletionPresenceSemantics.test_no_falsy_declared_value_silently_falls_back_to_repair
          - CompletionPresenceSemantics.test_a_falsy_declaration_on_a_closed_finding_is_reported_as_declared_not_as_absent
          - CompletionPresenceSemantics.test_no_consumer_decides_declaration_by_truthiness
          - CompletionPresenceSemantics.test_the_safety_controls_resolve_that_same_population
        what_changed_from_c7: >-
          One more control discriminates, because C8 routed the uniformity check through a
          population that includes TestCase methods. That is NF-20's repair showing up here,
          and it is why identities are recorded rather than a count: the set changed for a
          reason that has nothing to do with this finding.
      c9_control_behaviour:
        object: >-
          not named. This block is written in the commit it would describe, and a record cannot
          name the object that contains it.
        how_to_obtain_it: >-
          Apply the mutation identified above in a detached worktree at whatever object carries
          this file and run CompletionPresenceSemantics. The procedure is stated so the
          measurement can be taken rather than transcribed, and no commit sha is predicted.
      withdrawn_discriminator_claim: >-
        NF-26. Both the C7 and C8 blocks above previously named
        CompletionPresenceSemantics.test_the_predicate_is_defined_once as a discriminating
