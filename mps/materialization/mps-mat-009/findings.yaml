    why_it_is_acceptance_blocking:
      determination: true
      reasoning: >-
        The contradiction is about the state field itself, which is this register's primary
        governed property, and the gap was occupied at the moment it mattered. NF-20's
        occupied-gap basis applies rather than NF-27's unoccupied-gap basis. It is distinguished
        from NF-01 and NF-12, which are stale-narrative findings about cardinalities that no
        lifecycle decision consumed.
    repair: >-
      C10A. Every instance is rewritten as an explicitly historical statement bound to the object
      it describes, under repair_completion_note_scope and superseded_by_retained_review_scope. The
