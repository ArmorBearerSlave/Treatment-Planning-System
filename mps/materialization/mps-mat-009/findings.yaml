    the_abbreviated_historical_identity: >-
      REV-F2 records later_committed_as as edd6b0b, seven characters. It resolves in this
      repository today, and that is exactly why it is NOT expanded: rewriting a historical
      reviewer's evidence so a future comparison becomes convenient is manufacturing
      provenance. It is left as written. What C8A adds is that the consequence is stated -- an
      abbreviation can never equal a full closure target, and a control reports it if a
