  - id: NF-17
    origin: >-
      observed while classifying NF-15 at C6, misclassified there as an instance of NF-15,
      and separated at C7 on the independent review's rejection of that classification
    observed_at_object: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
    no_primary_artifact_retention_is_declared: >-
      Self-observed and reproduced in this workspace; no review artifact exists to retain.
    acceptance_blocking: false
    state: OPEN
    locus: [EVIDENCE, MEASUREMENT_PATH]
    title: >-
      Finding locus values are not constrained to the declared vocabulary, and no observer
      checks membership
    claim: >-
      The register declares a locus vocabulary of three members and uses a fourth. Nothing
      enforces the correspondence in either direction, so a locus-scoped reader selecting on
      the declared vocabulary silently drops part of one finding's classification, and one
      selecting on observed values reports a member the register does not define.
    independently_reproduced:
      at_object: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
      declared_vocabulary: [SYSTEM, EVIDENCE, MEASUREMENT_PATH]
      values_actually_used: [EVIDENCE, MEASUREMENT_PATH, PROCESS]
      undeclared_but_used:
        PROCESS: [F1]
      declared_but_unused: [SYSTEM]
      findings_carrying_no_locus_key: [RT-F-08]
      findings_carrying_a_null_locus: []
    no_observer_validates_membership:
      method: >-
        Established behaviourally, not by searching for the name. A wholly fabricated value,
        TOTALLY_UNDECLARED_LOCUS_VALUE, was written into a finding's locus and the full
        regression suite and every gate that reads this file were executed over it.
      result: >-
        507 tests passed and check_path_citations, check_repository_hygiene and
        check_session_controls all returned 0 with the fabricated value present.
        check_evidence_reconciliation returned 1, which is its standing state, and reproduced
        the same seven OPEN obligations -- so its exit was unrelated to the injection.
      restoration: >-
        The injected value was reverted and the file confirmed byte-identical by an empty
        git diff, not by re-reading the field.
      why_this_and_not_a_search: >-
        A search for the word locus across tools and tests returns nothing, and that is not
        the same proposition. Readers acquire this file through populations -- a glob, a
        tracked-file enumeration, a directory walk -- so several observers read it without
        naming any field in it. What had to be established is whether any of them constrains
        this value, and only executing them over a violating value establishes that.
    why_it_is_not_the_same_defect_as_nf_15: >-
      NF-15 is about the type and semantics of repair identity: one field holding two kinds of
      value, one of which cannot resolve to the object the closure rule compares against. This
      is about a declared vocabulary whose membership nothing enforces. They share only that
      both fields are uncontrolled, which is too coarse to be a classification -- combining
      them would make one disposition answer two unrelated questions, and the C6 record did
      exactly that until the independent review rejected it.
    why_it_is_not_acceptance_blocking: >-
      No control, gate or acceptance item consumes locus. Nothing currently depends on it
      being correct, which is the same reason nothing currently detects that it is not.
    required_disposition_question: >-
      Whether F1's locus is retyped or PROCESS is added to the declared vocabulary, and
      whether SYSTEM is retained now that nothing uses it. Both are classification questions
      about what F1 is, and F1 is one of the original independent-review findings, so its
      classification belongs to a reviewer and not to the implementer. A membership control
      should follow that decision rather than precede it, since a control written now would
      have to encode a guess about which way the question is answered.
    not_repaired_here: >-
      C7 does not repair the locus vocabulary. The finding is recorded and left OPEN.

