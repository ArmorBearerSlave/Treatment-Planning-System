  - id: NF-33
    origin: independent review of 00c6e2f, transported as IR-03
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: true
    state: OPEN
    locus: [MEASUREMENT_PATH]
    title: >-
      Review scope and per-finding lifecycle authority are not positively enforced, so the suite
      accepted finding-review warrant pairings the reviews never authorized
    claim: >-
      The closure observer requires a resolving review reference, exact object identity and a
      closing review-LEVEL verdict. It requires nothing from the review about the finding. A review
      whose own declared scope is "repair support only; not lifecycle disposition", and which
      grants closure authority to nothing, therefore served as the closure warrant for four
      findings with zero reported problems. Closure authority was inferred from a review-level
      verdict rather than granted per finding.
    independently_reproduced: >-
      Reproduced twice at 00c6e2f, in memory, against the committed records. First, the record as
      committed: closure_problems returns an empty list while the named warrant declares "not
      lifecycle disposition" and carries no warrants_closure_of key at all. Second, an arbitrary
      pairing: NF-12, a finding that review adjudicates for no closure, was set CLOSED against the
      same review and the observer again returned zero problems.
    why_it_is_acceptance_blocking:
      determination: true
      reasoning: >-
        A declared control -- the closure warrant rule -- cannot establish the thing it exists to
        establish, and the gap is occupied: it admitted the four transitions this checkpoint is
        recovering from. Blocking on the NF-20 basis.
    what_the_repair_must_not_do: >-
      Exact object identity is not to be weakened in either direction. The repair adds a positive
