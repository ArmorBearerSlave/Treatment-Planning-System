      C6 gave six of the seven prose-valued findings a typed repair_completion_object, so
      their closure target is a resolvable commit. NF-09 is the seventh and is deliberately
      left without one. What that changed is the potential OPEN population that would depend
      on the prose sub-case if it were ever proposed for closure: seven findings before C6,
