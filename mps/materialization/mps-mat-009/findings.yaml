        3188a11: 0
        349f2dc: 0
        3e397dc: 0
      canonical_closed_reaching_the_sha_sub_case:
        3188a11: 4
        349f2dc: 5
        3e397dc: 5
      potential_open_population_depending_on_the_prose_sub_case:
        3188a11: 8
        349f2dc: 7
        3e397dc: 1
      note: >-
