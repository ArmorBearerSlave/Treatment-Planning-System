  - id: NF-38
    origin: independent review of 00c6e2f, transported as IR-08
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: false
    state: OPEN
    locus: [MEASUREMENT_PATH]
    title: >-
      A real finding is hard-coded as a lifecycle-sensitive mutation fixture, coupling that
      finding's eventual legitimate closure to unrelated controls
    claim: >-
      Several completion-model controls select NF-01 by literal id as their mutation subject, and
      the mutation helper replaces only the first occurrence of the anchor, so the fixture is NF-01
      by virtue of its position in the file and its OPEN state. A control asserting that removing
      the typed field leaves no closure problem holds only while NF-01 is OPEN. A future actor with
      the authority to close NF-01 would have to edit controls that have nothing to do with NF-01.
    independently_reproduced: >-
      Established by reading the controls: the literal id appears as the fixture selector, and the
      helper's replacement count of one makes file position load-bearing.
    repair: >-
      C10C. Every fixture subject is derived from the record -- the findings declaring the
      completion object under test, sorted, first -- rather than named. The presence-semantics
      fixtures also stopped touching disk: the defect they reproduce exists once YAML has loaded
      the value, so the mutation is in memory and never reaches the filesystem.
    failure_sensitivity_demonstrated: >-
      A dedicated control closes the fixture subject IN MEMORY under a valid warrant -- one that
      resolves and carries a per-finding closure grant, not a forced state -- and requires the
      completion, closure, authority, state-completeness and presence-semantics observers all to
      remain clean. A second control derives the subject from the record and requires its id to
      appear nowhere in this module as a string literal, so the coupling cannot return quietly.
      The two controls that previously asserted the subject was OPEN now assert what they actually
      measure: that the record stays in the population the control ranges over.
    deliberately_not_done: >-
      NF-01 is not closed, and its lifecycle state is unchanged -- and specifically not changed
      to make any control convenient. The repair is that closing it would no longer require
      editing controls that have nothing to do with it.
    why_it_is_not_acceptance_blocking:
      determination: false
      reasoning: >-
        Prospective and unoccupied. NF-01 is OPEN, is not proposed for closure, and no control has
        yet obstructed a legitimate transition. NF-27's basis. It is recorded and repaired anyway,
        because a control whose correctness depends on a governed value it does not declare is
        unsound independently of that value's current state.

  - id: NF-39
    origin: independent review of 00c6e2f, transported as IR-09
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: false
    state: OPEN
    locus: [EVIDENCE]
    title: >-
      A governance disposition cites a live line number with no object scope
    claim: >-
      NF-01's disposition records that the residual sentence "is live at CLAUDE.md line 380". A line
      number is not a semantic reference: it is invalidated by any edit above it, it carries no
      object scope, and it cannot be resolved by a reader at any object other than the one the
      writer happened to have. The finding this citation appears in is itself the finding about
      transcribed values that go stale without announcing that they have.
    independently_reproduced: >-
      Reproduced by reading the citation and attempting to resolve it: the number is unscoped, and
      the record names no object against which a later reader could check whether it still points at
      the sentence intended.
    repair: >-
      C10C. The citation is replaced by a semantic locus under NF-01's governance disposition:
      artifact, section, the quoted proposition, the object the observation was made at, and the
      artifact's blob digest at that object so a reader can confirm they hold the same bytes. The
      line number is not updated to its current location; the original wording is preserved inside
      the withdrawal notice.
    failure_sensitivity_demonstrated: >-
      Controls resolve every declared locus rather than inspecting it: the object must resolve to
      a commit, the recorded blob digest must equal the artifact at that object, and both the
      section heading and every quoted fragment must be present in those bytes. A further control
      refuses any locus field that reintroduces a line-number reference, excepting the withdrawal
      notice that quotes the old one.
    why_it_is_not_acceptance_blocking:
      determination: false
      reasoning: >-
        A narrative citation defect inside a disposition rationale; no mechanism consumes it. The
        same basis as NF-01 and NF-12, which are non-blocking stale-citation findings.
    repair_must_not_be: >-
      Updating the number to its current location. That preserves the defect with a fresher value,
      which is the correction this register has already recorded getting wrong twice.
