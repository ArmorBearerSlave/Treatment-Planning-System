schema_version: "0.1"
register_id: MPS-MAT-009-FINDINGS
title: Controlled finding set arising from the MPS-MAT-009 independent adversarial review
status: open

purpose: >-
  The reviewer froze seven findings and repaired none of them. Frozen findings that live
  only in a review document are not controlled: nothing re-runs them, nothing fails while
  they stand, and nothing notices when a repair makes one of them untrue. This register
  makes each finding an object the gate suite can read, so that a repair is a state
  transition rather than a claim.

  It also carries findings the review did not make. Two are calibration probes released
  after 009 closed, and one is a gap the review's own method exposed without naming. They
  are attributed to post-009 calibration, never to the reviewer.

source_review:
  item: MPS-MAT-009
  verdict: FAIL
  reviewed_commit: 1b588953b31205ace9d3a2adb35280008d2cdd9e
  reviewed_model_tree_sha256: 7a7f23626af65d467e9d72253d68f7c1819a3c1b6a9f8b7f22b1b26bde7774d3
  findings_frozen: true
  repairs_by_reviewer: none
  report:
    original_sha256: 944554063bf57a8c76aadc93d5c26c814e4a3d3f4cf3e06e9985119555c2ea22
    original_bytes: 50638
    retained_as: mps/materialization/evidence/MPS-MAT-009/review-report.html
    retained_form: canonical
    normalization_rule: evidence_canonicalization/v1
    note: >-
      The retained copy is the frozen report with the declared canonicalization rule
      applied, because the report quotes host-profile paths in its own F1 finding text and
      the disclosure control must remain fully active over retained evidence. Both hashes
      are recorded, so the retained copy is provably a declared derivation of the frozen
      original rather than a rewrite of it. The original is unmodified.

immutability:
  baseline_commit: 1b588953b31205ace9d3a2adb35280008d2cdd9e
  rule: >-
    Every reproducer below is stated against the baseline commit and remains runnable
    there. A repair is recorded as a NEW observation at a later commit; no failed
    observation is overwritten by a repaired one, and no reproducer is edited to stop
    reproducing.

loci:
  SYSTEM: a defect in the modelled system
  EVIDENCE: a defect in what the acceptance record carries
  MEASUREMENT_PATH: the system may be correct; the instrument cannot establish that it is

transported_finding_records:
  what_this_is: >-
    Some findings here did not arise from the MPS-MAT-009 review whose report is retained
    above. The RT-F family arose from a later independent review, of d6faf77, whose report was
    never transported into the controlled evidence tree. Those findings are transported
    finding records: the proposition travelled, the primary did not.
  the_boundary: >-
    A transported finding record is not the review it came from. It carries what must be
    fixed and why, so a clone can dispose of it. It does not carry the review's reasoning, its
    other observations, or any artifact that would let a later reader re-adjudicate the review
    itself. Where an evidentiary question turns on the original report, the record says the
    primary is unavailable rather than implying otherwise.
  primary_retention: >-
    Each such finding carries primary_artifact_retention, drawn from the vocabulary declared
    in independent-reviews.yaml rather than a second one invented here. Every RT-F finding is
    external_not_retained. No repository-relative path is cited for any of them, because a
    path a clone cannot resolve is worse than no path.
  what_this_does_not_claim: >-
    That the complete independent-review history is clone-contained. It is not. The property
    established is narrower and is the one that matters for disposition: the controlled
    finding is semantically actionable from a clone.

finding_record_completeness:
  applies_to: >-
    Every finding carrying state: OPEN. An open finding is one a future actor must act on, so
    it has to say what it is; a closed one records what was done and is read through its
    disposition. Scoping the rule to OPEN is deliberate and is the whole of what this control
    claims.
  requires: >-
    At least one substance field, present and substantive. An id, a class and a state together
    are an index entry, not a finding: they say something exists without saying what, and a
    future actor holding only them cannot begin.
  substance_fields: [claim, proposition, corrected_claim, observation]
  minimum_substance_characters: 120
  also_requires: >-
    Any finding naming a reviewed_object states primary_artifact_retention, so that "the
    finding is here" and "the review that produced it is here" cannot be confused by silence.
  does_not_require: >-
    Retention of the external review primary. The property is that the controlled finding is
    semantically actionable from a clone -- not that the complete external review history is
    clone-contained. Requiring the latter would force either fabrication or deletion of true
    findings, and both are worse than an honest external_not_retained.
  observer: tests/test_review_records.py

finding_state_control:
  purpose: >-
    NF-09. A state-scoped observer is only as good as the population it ranges over, and
    this register's state representation was heterogeneous. Three relevant representations
    existed, not two: the canonical `state` field, a legacy `status` field, and a legacy
    `disposition` field. Canonical values appeared in the first, lowercase values and prose
    in the second, and closure claims in the third, while most records carried none of them.
    A closure-warrant rule keyed on state == CLOSED would therefore have been a correct
    rule applied to an accidentally incomplete population -- passing not because every
    finding was substantiated but because most were invisible to it.
  canonical_states:
    - OPEN
    - CLOSED
    - ACCEPTED
  canonical_field: state
  authoritative_field_note: >-
    NF-10. `state` is the SOLE authoritative lifecycle-state field. `status` and
    `disposition` are legacy representations and confer no OPEN, CLOSED or ACCEPTED
    semantics whatever, no matter what they contain. A record whose disposition reads
    "closed" is not closed; it is state debt whose legacy text says closed.
  legacy_fields:
    - status
    - disposition
  exception_representation_rule: >-
    Each exception must declare, per legacy field, whether it is present and -- when
    present -- the sha256 of its exact value. The observer checks that declaration
    against the record and fails on any mismatch. Before NF-10 the declaration was the
    unchecked assertion `observed_state: absent`, which was false for six records:
    five carried `disposition: closed` and one carried a prose disposition, so a
    legacy closure claim was sitting inside an exception that said nothing was there.
    `excerpt` is a human aid and is NEVER checked.
  rule: >-
    Every finding record must carry a canonical state in the `state` field, or appear in
    the exceptions below with a non-empty controlled reason. Nothing else passes.
  what_an_exception_means: >-
    ONLY that the controlled state representation for that record is presently absent or
    legacy. It does not mean OPEN, CLOSED, ACCEPTED, verified, repaired, or dispositioned
    in any way. In particular it must never be read as closure: prose cannot move
    controlled finding state, and a narrative report saying "closed" does not make a
    controlled closure until the record acquires canonical CLOSED and a resolving
    closure warrant.
  not_adjudicated_here: >-
    This checkpoint normalizes the state POPULATION so that state-scoped observers range
    over a controlled set. It does not adjudicate the legacy dispositions themselves;
    NF-09 carries that queue. State normalization and substantive disposition are
    different operations and are deliberately not combined.
  observed_baseline:
    measured_at: >-
      58d18db, before this checkpoint. These figures describe the population AT DISCOVERY and
      deliberately do not track the current file, which has since gained the NF records later
      checkpoints add. A baseline that silently follows the thing it measures is not a
      baseline, so the numbers below are frozen rather than refreshed.
    fields_counted: >-
      The original measurement bucketed two fields only: the canonical `state` field and the
      legacy `status` field. It did not count the legacy `disposition` field, which is why
      the 20 records recorded here as carrying neither in fact included six that carried a
      disposition -- five of them reading closed. That omission is exactly what NF-10 later
      exposed. The figures are preserved as taken, with this clarification of their scope,
      rather than silently recomputed.
    finding_records: 34
    canonical_state_records: 9
    records_with_neither_state_nor_status: 20
    legacy_lowercase_status_records: 3
    legacy_prose_status_records: 2
    measured_by: enumerating the finding records and bucketing both field names
  exceptions:
    F1:
      legacy_representation:
        status:
          present: false
        disposition:
          present: false
      reason: >-
        No legacy representation of any kind. This record predates the controlled finding-
        state vocabulary and says nothing anywhere about its own resolution.
