    repair: >-
      C8B, deliberately a separate commit from the record and observer work in C8A. The
      substantive RED is not hidden, neutralized or made conditional. The reconciler step is
      moved to the end of the structural-gates job, after every other mandatory control and
      after the terminal generated-source diff. It still fails, and the job still fails with
      it; what changes is that the other controls report first.
    why_not_continue_on_error: >-
      continue-on-error on this step would turn a substantive evidence failure into a passing
      workflow, which is defeating the observer rather than satisfying it. The requirement was
      that mandatory controls execute, not that CI go green, and moving the step achieves the
      first without touching the second. A control asserts that this step carries no
      execution-preserving key, so the cheaper repair cannot be substituted later.
    reachability_observer:
      path: tests/test_workflow_reachability.py
      invariant: >-
        No mandatory control may sit behind a control that is nonzero in the repository's
        current state unless that control declares an execution-preserving mechanism. The
        invariant is reachability, not this step's position and not today's step count.
      populations_derived_not_declared: >-
        The control steps are parsed from the workflow. The standing-nonzero set is derived by
        EXECUTING the controls rather than by naming which one is red, because a named list
        agrees with itself rather than with the repository. The required-reachable set names
        control classes by the tool that implements each, so a class removed from the workflow
        is reported rather than silently satisfied.
      failure_sensitivity_demonstrated: >-
        The observer restores the workflow as it stood at 2f10b3e, in disposable state, and
        requires that topology to be reported unreachable; the file is then restored and
        byte-identity asserted. The historical RED is therefore reproduced by the control
        itself on every run, not transcribed from a one-time measurement.
      reached_by: >-
        The workflow's regression step, which runs unittest discovery over tests/. It is
        therefore subject to the same reachability property it observes, and is positioned
        before the reconciler like every other mandatory control.
    residual: >-
      Open. Closure requires independent review of C8.

  - id: NF-22
    origin: independent review of 2f10b3e, returned NOT INDEPENDENTLY VERIFIED
    observed_at_object: 2f10b3e97e7461870700afb69db0ec6401326518
    no_primary_artifact_retention_is_declared: >-
      The review's report is not in this repository; each of the three claims was reproduced
      here against the objects named.
    acceptance_blocking: false
    state: OPEN
    locus: [EVIDENCE]
    title: >-
      NF-16's own evidence record understated its defect population, compared two
      incommensurable counts, and bound both to an object where the controls did not exist
    claim: >-
      Three inaccuracies in a single record. It said "Three other branches tested truthiness"
      when there were four -- the fourth was repaired in the same commit and described
      correctly in that commit's report, so the record understated a population its author had
      already enumerated. It recorded 9 red against 12 green as though comparable, where 9
      counted subtest failure records emitted by the runner and 12 counted test methods in a
      class. And it bound both figures to at_object 3e397dc, at which the controls did not
      exist, having been written at 2f10b3e.
    independently_reproduced:
      consumer_population_at_3e397dc: >-
        Four units read the completion field by .get() as a declaration test: closure_target
        and three CompletionObjectMutations methods. A fifth read it by .get() for equality
        selection. Derived by parsing the module at that object and attributing each call to
        its enclosing definition.
      unit_mismatch: >-
        Re-running the same experiment at C8 gives eleven subtest failure records over five
        distinct test methods, in a class of twelve. Neither eleven nor nine is commensurable
        with twelve, and the fact that the numbers moved for reasons unrelated to this finding
        is itself the argument against recording them.
      object_scope: >-
        CompletionPresenceSemantics was introduced at 2f10b3e. No control of that class existed
        at 3e397dc, so no measurement of C7 control behaviour can be bound to that object.
    why_it_is_not_acceptance_blocking:
      determination: false
      reasoning: >-
        The load-bearing proposition of NF-16 -- that the defect existed, that it was not
        exploitable, and what its repair is -- reproduces intact. No control, gate or
        acceptance item consumes any of the three inaccurate figures. That is the same basis on
        which NF-14 is non-blocking.
      the_contrary_precedent_stated_deliberately: >-
        RT-F-05, "Temporal population count implied a state that never existed", is
        acceptance_blocking, and the object-scope half of this finding is that same shape. The
        distinction relied on here is that RT-F-05's counts were cited in support of a
        conclusion, and NF-16's are not cited by anything. That distinction is fine enough that
        a reviewer could reasonably overrule it, and it is recorded rather than smoothed over
        so that they can.
    repair: >-
      C8A. The consumer population is named rather than counted; the withdrawn count is
      preserved with the reason it was wrong. The two incommensurable figures are withdrawn and
      not restated -- what replaces them is the identities of the discriminating test methods,
      separately for C7 behaviour at 2f10b3e and C8 behaviour, with the subtest-record figure
      stated as the same fact in a different unit rather than as a second measurement. The C8
      scope names no object, because a record cannot name the commit that contains it, and the
      procedure is stated so the measurement can be repeated instead.
    residual: >-
      Open. Closure requires independent review of C8.
