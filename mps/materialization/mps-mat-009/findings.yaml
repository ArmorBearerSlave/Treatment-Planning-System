  - id: NF-34
    origin: independent review of 00c6e2f, transported as IR-04
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: false
    state: OPEN
    locus: [EVIDENCE]
    title: >-
      The disposition record described two amended controls as strictly stronger when one was a
      strict weakening and the other was incomparable
    claim: >-
      The register observation added at 00c6e2f states that the amended control "asserts now the
      property that is actually permanent and is strictly stronger". Neither amendment was strictly
      stronger. Control A replaced "every finding declaring a completion object must be OPEN" with
      "a finding that has left OPEN must have closed against its declared completion object": the
      old proposition was wrong but strictly stronger, and the new one admits states the old
      refused, so the change is a weakening that happens to be correctly scoped. Control B traded
      one detection direction for another and is incomparable, not ordered.
    why_it_matters: >-
      Describing a weakening as a strengthening is the defect class this register exists to catch,
      appearing in the rationale for the change that produced the failed disposition. A reader
      auditing whether a control was relaxed to permit a transition is told it was not.
    why_it_is_not_acceptance_blocking:
      determination: false
      reasoning: >-
        The minimum the convention supports. The claim is narrative inside a methodological
        observation; no mechanism consumes it, no control resolves it, and the amended controls are
        separately observed. NF-26 and NF-30 were non-blocking on the same basis -- an inaccuracy
        inside a rationale rather than in a mechanism.
    repair: >-
      C10A. The claim is amended in place to state the actual ordering relation of each amendment,
      and the historical wording is preserved as withdrawn rather than deleted.

  - id: NF-35
    origin: independent review of 00c6e2f, transported as IR-05
    reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    primary_artifact_retention: external_not_retained
    acceptance_blocking: false
    state: OPEN
    locus: [MEASUREMENT_PATH]
    title: >-
      Committed mutation controls edit controlled files in place and restore only in a Python
      finally block, so process termination can leave controlled state modified
    claim: >-
      The mutation helper writes a modified controlled file to disk, yields, and restores in
      finally. A SIGKILL, a power loss or an interpreter crash between those points leaves a
      tracked controlled file modified, and the next actor inherits a dirty tree whose contents
      look authored. The restoration is only as reliable as the process performing it.
    independently_reproduced: >-
      Established by inspection of the helper and by the absence of any recovery path outside the
      interpreter: there is no pre-image on disk, no journal, and no check at import that a prior
      run left the tree modified.
    repair: >-
      C10C. tests/controlled_mutation.py writes the original bytes to a journal entry and flushes
      them to the platform BEFORE the controlled file is touched, and discards that entry only
      after byte-identical restoration is verified. recover() runs on import of any module that
      mutates, so a run beginning after a death repairs the tree and says so rather than measuring
      a state nobody authored. The order is the mechanism: journalling after the write would
      reproduce the defect with more machinery.
    failure_sensitivity_demonstrated: >-
      A real child process journals and mutates the controlled finding register, then is killed
      with Popen.kill -- uncatchable, so no finally, no atexit, no handler. The control asserts the
      file is genuinely modified at that moment and that the pre-image is already journalled, then
      requires recovery to restore it byte-identically, by digest, and to return Git's own view of
      the path -- porcelain status and filtered blob id -- to the state captured before the
      mutation. That comparison is against a pre-mutation snapshot and NOT against HEAD: the
      register legitimately carries uncommitted work, so requiring a clean tree would assert the
      commit state of unrelated edits rather than the effect of the cycle, and reported RED while
      the mechanism was working. The blob id is what carries the observation, because the
      porcelain flag reads the same modified value before and during the mutation; the control
      proves on each run that the comparison can still distinguish a recovered file from an
      unrecovered one. A torn journal entry is reported and left in place rather than applied,
      because restoring a partial pre-image would write garbage over a good file.
    also_repaired: >-
      Three unjournalled writes to the controlled finding register inside the state-completeness
      controls, which the helper never covered. A population-derived control now scans every test
      module for writes to a controlled record path outside the journal, resolving each module's
      own path constants from its parse tree.
    residual: >-
      Open. tests/test_workflow_reachability.py still restores the workflow file in its own
      finally and was deliberately not converted: nine mutation scenarios assert byte-identity
      inside themselves, and this finding is non-blocking. The exposure is named rather than left
      as an oversight, and is smaller -- the workflow is not a controlled record, and a modified
      copy fails the reachability observer loudly rather than reading as authored content. A
      control asserts that this residual still describes the file.
    why_it_is_not_acceptance_blocking:
      determination: false
      reasoning: >-
        Prospective and unoccupied. No run has been observed to terminate mid-mutation, every
        committed control asserts byte-identical restoration, and the tree has been verified clean
        after every suite execution. NF-27's basis: a gap that is real, unoccupied, and closed
        anyway, because a population narrower than its claim is unsound independently of what
        happens to be sitting in the difference.

  - id: NF-36
    origin: independent review of 00c6e2f, transported as IR-06
