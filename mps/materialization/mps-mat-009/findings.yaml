  - id: P1
    origin: post-009 calibration probe
    attribution_note: >-
      Released into the controlled finding set after MPS-MAT-009 closed. NOT a reviewer
      finding, and not part of the frozen 009 report.
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH]
    title: The gate suite cannot express measurement invalidity, so a broken measurement reads as a finding
    claim: >-
      check_headless_build_currency.py distinguishes a failed measurement from an adverse
      verdict by returning 2 and printing MEASUREMENT INVALID. It is the only gate that
      does. Every other gate returns 1 for both "the object is defective" and "I could not
      measure the object", so the two are indistinguishable to a reader and to CI. The
      review met this directly: its first attempt to bisect F1 extracted commits with git
      archive, the gate raised "fatal: not a git repository" and returned non-zero at every
      commit including known-good ones, and that reads exactly like a finding. The reviewer
      caught it; the suite did not help.
    corroborating_first_person_observation: >-
      The same class recurred during this remediation. A probe written to count host-profile
      paths in the frozen review report reported zero matches, which reads as "the report is
      clean". The report contains three. The probe's own regular expression had been mangled
      by shell escaping before it reached Python, so the measurement was invalid and its
      output was a confident wrong answer about the object. It was caught by re-running the
      scan through the gate's own compiled patterns instead of a retyped copy.
    precommit:
      disposition: record_as_a_controlled_finding_and_state_the_repair_shape
      expected_post_repair_behavior:
        - >-
          The finding is carried in this register with its own reproducer, so it is a
          tracked object rather than an observation in a transcript.
      repair_shape_if_authorised: >-
        A shared exit convention across the gate suite: 0 verdict-pass, 1 verdict-fail,
        2 measurement-invalid, with each gate's precondition failures routed to 2. This is a
        suite-wide interface change affecting every CI step and is scoped deliberately, not
        folded into a finding repair.
      failure_sensitivity_conditions:
        - >-
          Any repair must be demonstrated by making a gate's precondition fail and observing
          exit 2 rather than exit 1, on a tree known to be defect-free.

  - id: P2
    origin: post-009 calibration probe
    attribution_note: >-
      Released into the controlled finding set after MPS-MAT-009 closed. NOT a reviewer
      finding, and not part of the frozen 009 report.
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH, EVIDENCE]
    title: >-
      Every control verifies project shape; nothing binds the evidence to the intended
      project instance
    claim: >-
      model_tree_sha256 answers "is this the same model", which is a question about content.
      It cannot answer "is this the intended project", which is a question about identity.
      Two independent clones of this repository at the baseline commit produce the identical
      model tree hash and pass every gate identically, so no control in the suite can
      distinguish evidence produced from the project under review from evidence produced
      from any other working copy of the same shape.
    first_person_observation: >-
      Directly observed during this remediation and not hypothetical. The MPS IDE holding
      the model write lock has a different working copy open than the one this repair is
      authored in, and the retained green JUnit report records a third path in its
      idea.config.path property. All three carry the same model tree hash, and every gate
      passes in each. The package therefore cannot state which working copy produced its
      evidence, only that some working copy of that shape did.
    why_it_is_not_merely_pedantic: >-
      The premise the whole build clause rests on, coldness, is a property of a particular
      run in a particular tree. F3 shows the record does not observe it. P2 shows the record
      could not attribute it to a tree even if it did.
    precommit:
      disposition: record_as_a_controlled_finding_and_state_the_repair_shape
      expected_post_repair_behavior:
        - The finding is carried in this register with its first-person observation intact.
      repair_shape_if_authorised: >-
        A run identity recorded alongside each verdict: the working-copy path class, the git
        common directory identity, and the MPS project instance the run addressed, recorded
        as observations rather than assertions. Whether project instance identity SHOULD be
        controlled is a governance question about what the acceptance claim is asserting,
        and is named rather than decided here.
      failure_sensitivity_conditions:
        - >-
          Any repair must be demonstrated by producing evidence in one working copy and
          showing that a control refuses it when presented as evidence for another.

  - id: P3
    origin: post-009 remediation, exposed by the review's method
    attribution_note: >-
      Not a reviewer finding. The review's own experiments make it visible, but the frozen
      report does not name it.
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH]
    title: Execution co-identity gap; the executed tests are never bound to the authored model
    claim: >-
      The model-test verdict records identities that are Java method names in a generated
      test class. The build verdict records a model tree hash. Nothing binds the two: no
      control establishes that the class that executed was generated from the model tree the
      verdict is keyed on, rather than from an older test_gen tree that happens to be
      present. The currency gate compares the recorded tree hash to the current tree, which
      answers whether the MODEL moved, not whether the EXECUTED ARTIFACT came from it.
    why_it_is_live: >-
      This is the same defect class as POST-MPS4-01, moved from generation to execution. A
      warm output tree kept a project green that could not be built at all; a warm test_gen
      tree can equally keep a test verdict green that the current model does not produce.
      Coldness would close it, and F3 establishes that coldness is not observed.
    relationship_to_other_findings: >-
      Depends on F3. Repairing F3 supplies the observation this finding needs; until then P3
      cannot be closed by argument.
    precommit:
      disposition: record_as_a_controlled_finding_repair_gated_on_F3
      expected_post_repair_behavior:
        - >-
          Once coldness is observed rather than asserted, a cold run's test verdict is bound
          to the model tree by construction, because no generated artifact predating the run
          survives it. The receipt records that binding explicitly rather than leaving it to
          be inferred.
      failure_sensitivity_conditions:
        - >-
          A test verdict recorded from a run that was not observed cold must not be able to
          claim co-identity with the model tree.

