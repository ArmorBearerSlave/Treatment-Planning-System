  - id: NF-24
    origin: independent review of 0db0213, returned NOT INDEPENDENTLY VERIFIED
    observed_at_object: 0db0213be250a05bf32b9466ee836a6ebf31eb19
    no_primary_artifact_retention_is_declared: >-
