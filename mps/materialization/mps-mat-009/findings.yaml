      imports the same measurement function.
    closure_derived_from: >-
      tests/test_measurement_invalid_exit.py
      AssuranceMetricsStates.test_the_production_cli_cannot_be_pointed_at_substitute_sources,
      which asserts both that the options are absent from --help and that supplying one
