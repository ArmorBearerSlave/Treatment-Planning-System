  - id: MI-R-04
    origin: independent review of ae47513
    acceptance_blocking: true
    locus: [MEASUREMENT_PATH]
    title: One MI regression failed on a cold tree; another passed vacuously
    claim: >-
      Round 1's derived_manifest controls enumerated the repository's own project directory,
      whose derived output is gitignored. On a cold clone that population is empty, so the
      positive control compared zero paths against zero paths and passed while establishing
      nothing, and the discrepancy control could not construct a difference and failed.
    disposition: closed
    closed_by: >-
      Every fixture is now built by the test in a temporary directory with an exactly known,
      non-empty population. No control reads source_gen, classes_gen, test_gen,
      test_gen.caches or any other gitignored product.
    closure_derived_from: >-
      DerivedManifestStates.test_valid_measurement_over_a_non_empty_population_exits_0, which
      asserts len(paths) > 0 before accepting the verdict and then asserts the exact
      three-path population; and a full-suite run from a fresh clone with no derived output.

  - id: MI-R-05
    origin: independent review of ae47513
    acceptance_blocking: true
    locus: [MEASUREMENT_PATH]
    title: The static anti-pattern guard missed the actual historical defect shape
    claim: >-
      Round 1's guard was a line-oriented substring test. The historical defect in
      report_assurance_metrics.py was a raise SystemExit( ... ) wrapped across lines with the
      marker on a continuation line, which no line-oriented pattern can see. The guard passed
      while the defect was present in exactly the form it was written to catch.
    disposition: closed
    closed_by: >-
      An AST-based detector that finds a raise whose exception is a SystemExit call carrying a
      string argument containing the marker, independent of wrapping, indentation or quote
      style; plus behavioural coverage of both historical branches at the process boundary.
    closure_derived_from: >-
      AstGuardIsProvenBeforeItIsTrusted, six synthetic controls including the wrapped
      multiline form, the parenthesised f-string, the permitted integer forms and the
      permitted print-and-return form; and
      AssuranceMetricsStates.test_the_historical_vv_claim_count_branch_exits_2, which
      exercises the exact branch that carried the defect.
    scope_note: >-
      The detector finds one anti-pattern. It is not proof of ternary exit semantics across
      the repository, and the behavioural controls remain authoritative for the two repaired
      sites. Its honest limit is recorded as a control of its own: a marker assembled at
      runtime by concatenation of expressions is outside what it reads.

  - id: MI-EXIT-01-VVCOUNT-TENSION
    origin: independent review of ae47513, preserved for Probe 1
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH]
    title: >-
      Is a self-contradicting measuring source a measurement failure or a governance finding?
    the_case: >-
      The trace graph declares vv_claim_count = N while only M of its records carry a
      vv_claim_id. report_assurance_metrics treats that as MEASUREMENT INVALID.
    the_reasoning_accepted_for_now: >-
      The measuring source contradicts itself, and the instrument cannot know which of the two
      populations is authoritative. Reporting either number would be reporting a figure it has
      no basis to prefer, and reporting a discrepancy against the controlled record would
      attribute to the record a defect that may belong to the graph.
    why_it_is_a_tension: >-
      A source that disagrees with itself is arguably a substantive finding about that source
      rather than a failure to measure. The current encoding says the instrument declines to
      adjudicate; a different reading would say it has adjudicated the graph.
    status: >-
      Preserved as a semantic judgement requiring later Probe 1 review. It is NOT converted
      into a settled repository-wide rule by this repair. MI-EXIT-01 requires only that the
      currently frozen interpretation be encoded distinctly from a substantive governance
      discrepancy, which it now is.

  - id: REC-OBS-01
    origin: post-MI-EXIT-01 independent review
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH]
    title: >-
      No dedicated observer treated the MPS-MAT-009 artifacts as a review-record population
    superseded_claim:
      wording: >-
        Nothing in tools/, tests/ or .github/ read anything under
        mps/materialization/mps-mat-009/.
      status: FALSE, withdrawn
      falsified_by: independent review of d6faf77
      retained_because: >-
        The wording is kept so the correction is auditable. Deleting a false claim leaves no
        trace that it was made, and how it was reached is more instructive than the claim.
    corrected_claim: >-
      Before the review-record normalization checkpoint, no dedicated mechanical observer
      treated the controlled MPS-MAT-009 artifacts as a review-record population or checked
      review-result consistency across that population.
    the_distinction_that_matters: >-
      Generic enumeration of files is not semantic observation of those files as review
      records. Both check_path_citations and the repository hygiene gate were resolving all
      nine files as members of their populations throughout; neither had any notion of a
      review result, a verdict, a reviewed object, or a missing disposition.
    evidence_by_resolved_population:
      method: >-
        Each candidate reader's population-producing function was executed and its resolved
        population inspected for membership, rather than its source being searched for the
        target's name.
      check_path_citations:
        population_function: scanned_files()
        resolved_cardinality: 105
        target_members_present: 9
        acquired_through: the mps/materialization *.yaml entry in SCAN
      repository_hygiene:
        population_function: git ls-files --cached --others --exclude-standard
        resolved_cardinality: 390
        target_members_present: 9
    qualitative_contrast: >-
      Other controlled registers already had dedicated subject-specific observers; the
      MPS-MAT-009 review-record population did not. No reader count is asserted, here or
      anywhere: a count of name references would preserve the same category error with a
      cleaner definition.
    first_dedicated_observer: >-
      tests/test_review_records.py, added at d6faf77 and corrected in this checkpoint. It is
      the first dedicated observer of these controlled artifacts as a review-record
      population.
    state: OPEN
    residual: >-
      One observer over one property is not coverage. It now establishes population
      membership and completeness, review-status presence, review-unit membership, schema
      consistency, and the authority and non-identity constraints. It does not establish
      adjudication soundness, the factual truth of any finding, evidence adequacy, the
      correctness of any disposition, or the historical truth of external review events.
      PopulationObserved does not imply AdjudicationSound.

  - id: REC-OBS-01-METHOD
    origin: independent review of d6faf77
    acceptance_blocking: false
    locus: [MEASUREMENT_PATH]
    title: A literal-name search cannot establish the absence of readers
    the_error_as_committed: >-
      A search for the literal string mps-mat-009 across tools/, tests/ and .github/ returned
      nothing, and absence of readers was inferred from it. The inference does not hold: a
      reader may acquire its target through a parent glob, a recursive walk, tracked-file
      enumeration, graph traversal, or any other broader population definition, and in this
      case two readers did exactly that.
    durable_rule: >-
      Absence of a literal reference to X is not absence of an observer of X.
    operationally: >-
      A name or reference search is a discovery and recall aid. Evidence of whether X is
      observed is the resolved population of each candidate reader: identify the function
      that produces that reader's input population, execute or instrument it against the
      object in question, inspect the result, and test membership. Source inspection locates
      the population function; it is not the membership proof.
    why_it_generalises: >-
      The same shape recurs whenever a search stands in for a measurement. It is the
      searching equivalent of the finding this programme keeps making: an instrument credited
      with a discrimination it does not perform.

