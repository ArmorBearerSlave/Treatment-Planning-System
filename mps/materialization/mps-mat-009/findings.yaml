      sha_present_empty_string_with_later_committed_as: redirected to later_committed_as
      sha_present_zero_with_later_committed_as: redirected to later_committed_as
      sha_present_false_with_later_committed_as: redirected to later_committed_as
      both_fields_present: resolved to sha by incidental precedence, with no stated rule
    why_it_is_acceptance_blocking: >-
      It could admit a closure match against an object the review did not review, which is the
      property that makes NF-05, NF-06 and NF-11 acceptance_blocking in this register. It is
      not currently reachable -- only REV-F2 carries later_committed_as and no finding closes
      against it -- but unreachability here is a fact about today's records, not a property of
