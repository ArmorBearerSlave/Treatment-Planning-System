      C8A. Identity selection is keyed to the declared kind rather than to which field is
      truthy: kind commit carries its identity in sha, kind working_tree in
      later_committed_as, and a field that does not match its kind is reported. Declaration is
      key membership. Both fields present is an explicit reported outcome rather than a
      precedence. Every rejected case yields None, and None never equals a closure target, so
