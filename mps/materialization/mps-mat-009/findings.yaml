  - id: NF-21
    origin: independent review of 2f10b3e, returned NOT INDEPENDENTLY VERIFIED
    observed_at_object: 2f10b3e97e7461870700afb69db0ec6401326518
    no_primary_artifact_retention_is_declared: >-
      The review's report is not in this repository; the topology below was reproduced here.
    acceptance_blocking: true
    state: OPEN
    locus: [MEASUREMENT_PATH, EVIDENCE]
    title: >-
      Most of the controlled workflow's mandatory controls have no execution path, because a
      standing-RED gate runs before them
    claim: >-
      The structural-gates job runs check_evidence_reconciliation as step 13 of 34. That gate
      is legitimately and persistently nonzero -- exit 1, a substantive verdict that seven
      declared evidence obligations remain OPEN. The workflow declares no continue-on-error,
      no if-condition and no aggregation anywhere, so under GitHub Actions fail-fast semantics
      the job stops there and the 21 steps after it never execute. They are declared mandatory
      and are unreachable.
    independently_reproduced:
      at_object: 2f10b3e97e7461870700afb69db0ec6401326518
      reconciler_step_position: 13
      total_steps_in_job: 34
      steps_after_it: 21
      continue_on_error_present_anywhere: false
      conditional_execution_present_anywhere: false
      reconciler_exit_code: 1
      reconciler_exit_semantics: >-
        Valid measurement, substantive failure. Not the measurement-invalid code, which would
        be 2 and would mean the instrument could not establish anything.
      unreachable_control_classes:
        - assurance metrics
        - module graph
        - enum persistence
        - HLR root placement
        - model persistence
        - neutral export and Stage-B equivalence
        - role ontology
        - source relations
        - safety and assurance classification
        - clinical adapter allocations
        - hazard trace graph
        - risk register
        - component view crosswalk
        - construction records
        - session controls currency
        - controlled specification reconciliation
        - approval state
        - Gate 0 readiness
        - V&V matrix
        - terminal generated-source diff
    why_it_is_acceptance_blocking:
      determination: true
      reasoning: >-
        This required explicit analysis rather than inheritance from the review's wording. The
        register's convention marks a finding blocking when a declared control cannot establish
        what it is declared to establish. F1 is acceptance_blocking on exactly that basis -- a
        gate declared in the reviewed commit's own CI workflow does not pass -- and this is the
        stronger form of the same thing: twenty-one declared mandatory controls do not merely
        fail, they never run. Every green result CI has ever reported for them since the
        reconciler began standing RED is an absence of evidence presented by the workflow's
        own structure as though the controls had been satisfied. It is also not self-limiting:
        the reconciler is expected to stay RED until the evidence obligations are resolved, so
        the unreachability persists for as long as the condition it reports does.
      what_it_does_not_mean: >-
        It does not mean those controls fail. They pass when run locally, and were run locally
        at this checkpoint. It means CI establishes nothing about them.
    repair: >-
      C8B, deliberately a separate commit from the record and observer work in C8A. The
      substantive RED is not hidden, neutralized or made conditional. The reconciler step is
      moved to the end of the structural-gates job, after every other mandatory control and
      after the terminal generated-source diff. It still fails, and the job still fails with
      it; what changes is that the other controls report first.
    why_not_continue_on_error: >-
      continue-on-error on this step would turn a substantive evidence failure into a passing
      workflow, which is defeating the observer rather than satisfying it. The requirement was
      that mandatory controls execute, not that CI go green, and moving the step achieves the
      first without touching the second. A control asserts that this step carries no
      execution-preserving key, so the cheaper repair cannot be substituted later.
    reachability_observer:
      path: tests/test_workflow_reachability.py
      invariant: >-
        No mandatory control may sit behind a control that is nonzero in the repository's
        current state unless that control declares an execution-preserving mechanism. The
        invariant is reachability, not this step's position and not today's step count.
      populations_derived_not_declared: >-
        The control steps are parsed from the workflow. The standing-nonzero set is derived by
        EXECUTING the controls rather than by naming which one is red, because a named list
        agrees with itself rather than with the repository. The required-reachable set names
        control classes by the tool that implements each, so a class removed from the workflow
        is reported rather than silently satisfied.
      failure_sensitivity_demonstrated: >-
        The observer restores the workflow as it stood at 2f10b3e, in disposable state, and
        requires that topology to be reported unreachable; the file is then restored and
        byte-identity asserted. The historical RED is therefore reproduced by the control
        itself on every run, not transcribed from a one-time measurement.
      reached_by: >-
        The workflow's regression step, which runs unittest discovery over tests/. It is
