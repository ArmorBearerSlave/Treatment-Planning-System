      commit_sha_valued_ids: [RT-F-03, RT-F-04, RT-F-05, RT-F-06, NF-13]
      prose_valued: 7
      prose_valued_ids: [NF-01, NF-05, NF-06, NF-09, NF-10, NF-11, NF-12]
      field_absent: 31
    mechanism: >-
      closure_problems compares reviewed_sha(review) against closure_target(finding) by string
      equality. Where the target is prose, that comparison is false for every possible review,
      and the diagnostic it emits reports a reviewed-object mismatch -- naming a truncation of
      the prose as though it were an object -- rather than saying the target was never an
      object at all. It fails closed, so nothing is wrongly closed by it; what it does is
