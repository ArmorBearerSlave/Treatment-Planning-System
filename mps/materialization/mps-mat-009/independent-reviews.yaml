            later record diverges from this and the divergence has a determinable cause.
        - finding: NF-06
          determination: SUPPORTED
          residual: >-
            RT-F-06's closure predates its warrant -- disclosed by the reviewer and undetectable
            by the mechanism, which has no timestamp input. Support is materially conditional on
            NF-10 and NF-11.
          conditionality_note: >-
            The reviewer demonstrated that at C1/63694e5 NF-06's rule existed but the governed
            population was not yet trustworthy, and that at exactly 3188a11 NF-10 and NF-11 make
            it trustworthy, which is why SUPPORTED holds there. NF-06's historical introduction
            commit is not rewritten and no claim is made that it was independently supportable
            at C1.
        - finding: NF-10
          determination: SUPPORTED
          residual: >-
            25 records remain state debt and unadjudicated, and the observer does not judge the
            quality of an exception's reason. NF-10's mechanism being supported is a different
            proposition from NF-09's residual queue being resolved; neither is adjudicated here.
        - finding: NF-11
          determination: SUPPORTED
          residual: NONE
        - finding: NF-12
          determination: SUPPORTED
          residual: >-
            NF-12's own claim carries an unscoped historical cardinality, 39/14/25, which
            reproduces at 1db9948 but not at the later repair object or the current one. Not
            repaired here.
    per_finding_authority:
      NF-01:
        repair_support: VERIFIED
        closure_authority: DENIED
        basis: >-
          repair_support is the typed reading of this review's own retained determination
          SUPPORTED, through the controlled retained_determination_to_repair_support mapping, and
          is bound to the artifact's bytes rather than transcribed. closure_authority is DENIED
          because the retained artifact states its scope as repair support only and states no
          finding to be CLOSED; DENIED records what the artifact says rather than leaving the
          question unanswered.
      NF-05:
        repair_support: VERIFIED
        closure_authority: DENIED
        basis: as NF-01; SUPPORTED in the retained bytes, and lifecycle disposition disclaimed.
      NF-06:
        repair_support: VERIFIED
        closure_authority: DENIED
        basis: as NF-01; SUPPORTED in the retained bytes, and lifecycle disposition disclaimed.
      NF-10:
        repair_support: VERIFIED
        closure_authority: DENIED
        basis: as NF-01; SUPPORTED in the retained bytes, and lifecycle disposition disclaimed.
      NF-11:
        repair_support: VERIFIED
        closure_authority: DENIED
        basis: as NF-01; SUPPORTED in the retained bytes, and lifecycle disposition disclaimed.
      NF-12:
        repair_support: VERIFIED
        closure_authority: DENIED
        basis: as NF-01; SUPPORTED in the retained bytes, and lifecycle disposition disclaimed.
    per_finding_authority_note: >-
      NF-33 / IR-03 and NF-36 / IR-06. This is the review that now supplies repair support at
      3188a11, in place of REV-C5-CUMULATIVE.verified_repairs_of, and it is the one review in the
      register whose determinations are bound to retained bytes. The closure_authority column is
      uniformly DENIED and that is the whole point of the model: at 00c6e2f this review was used as
      the closure warrant for four findings while its own artifact disclaimed exactly that, and no
      control could see the contradiction because closure authority was inferred from the
      review-LEVEL verdict. It is now stated per finding, and it says no.
    scope_note: >-
      The reviewer's independence limitation, recorded as disclosed and not strengthened. The
      reviewer did not author C1 through C9, did not transport findings or reviews, and authored
      neither REV-C5-CUMULATIVE, nor verified_repairs_of, nor the finding-side
      independent_review_support records -- so it created none of the assertions it was asked to
      verify. It DID perform the C7, C8 and C9 independent reviews, and is therefore the actor
      that returned INDETERMINATE for these same six findings at all three. That is a material
      limitation: it arrives with a prior expectation, formed at 2f10b3e, that several of these
      mechanisms hold. The artifact records two mitigations -- every proposition derived from
      3188a11 alone by reading and executing that object, and active falsification which did
      find residuals in four of the six plus the NF-05 divergence. The artifact states in its
      own words that a reviewer with no prior role in this sequence would still be preferable.
      Account-level separation is not demonstrable and is not claimed: every commit in this
      lineage carries one Git identity, and independence is asserted on participation, never
      inferred from author metadata.
    warrants_closure_of_note: >-
      Deliberately absent. Six SUPPORTED determinations are repair support, not lifecycle
      disposition, and the artifact says so itself. No finding names this review as its
      closure_review, no warrants_closure_of key is written, and no finding state moves. A
      separate governance disposition actor weighs support against residual and
      acceptance-blocking status; converting support into closure here would be the transport
      actor making that decision by writing a field.
    what_this_does_not_repair: >-
      REV-C5-CUMULATIVE is untouched. Its unretained primary and its remediation-authored
      verified_repairs_of remain exactly as recorded, and this artifact is a separate evidence
      object rather than a retrofit that would make the old review look as though it had always
      been supported. The historical provenance problem is now answered by new evidence, not
      erased.

  - review_id: REV-POST-C9-DISPOSITION
    subject: >-
      The post-C9 disposition checkpoint, reviewed as the cumulative object at which four
      findings were moved to CLOSED and two controls were amended
    reviewed_object:
      kind: commit
      sha: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
    verdict: FAIL
    verdict_label_as_returned: >-
      00c6e2f / POST-C9 DISPOSITION CHECKPOINT -- NOT INDEPENDENTLY VERIFIED
    verdict_note: >-
      FAIL is this register's existing non-closing verdict value and is used unchanged; the
      reviewer's literal wording is preserved beside it in verdict_label_as_returned. No new
      verdict value was invented for this result and closing_verdicts is untouched.
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed technical reviewer / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    primary_artifact_retention: external_not_retained
    primary_artifact_retention_note: >-
      The report is not in this repository and is not claimed to be. No path is cited for it and
      nothing was reconstructed after the fact to stand in for it. This record deliberately does
      NOT declare `retained`: that value means a primary artifact was transported under the F1
      rule and bound by the digest of its retained bytes, and no such transport happened here.
    what_it_found_about_the_four_mechanisms: >-
      The substantive repairs named by NF-05, NF-06, NF-10 and NF-11 were independently
      reproduced and found technically sound. That determination is recorded because it is what
      the reviewer said, and it is deliberately not converted into anything else: technical
      soundness of a repair is not authority to move lifecycle state, and treating the reviewer's
      approval of four mechanisms as a warrant would reproduce the exact defect this review
      returned. See warrants_closure_of_note below.
    findings_returned:
      - IR-01 transported as NF-31
      - IR-02 transported as NF-32
      - IR-03 transported as NF-33
      - IR-04 transported as NF-34
      - IR-05 transported as NF-35
      - IR-06 transported as NF-36
      - IR-07 transported as NF-37
      - IR-08 transported as NF-38
      - IR-09 transported as NF-39
    findings_returned_note: >-
      Classification of each as acceptance-blocking or not was decided against this register's
      own convention -- a finding is blocking when a declared control cannot establish what it is
      declared to establish, and the occupied/unoccupied distinction of NF-20 against NF-27
      settles the marginal cases. Severity was not copied from the review's prose. Five are
      blocking and four are not, and each carries its reasoning.
    warrants_closure_of_note: >-
      Absent, and necessarily so. This is a failing verdict, which is not in closing_verdicts, so
      it confers no closure on anything. It also confers no repair support: no verified_repairs_of
      key is written and none may be derived from its favourable technical findings about the four
      mechanisms. A failed checkpoint review is not a per-finding repair review, and the technical
      praise inside it is not a lifecycle instrument.
    verified_repairs_of_note: >-
      Deliberately absent for the same reason. The reviewer reproduced four repairs and found them
      sound; that is recorded in what_it_found_about_the_four_mechanisms as narrative, not as a
      typed authority field, because this review's object is the disposition checkpoint and its
      verdict on that object is FAIL.
    consequence_for_lifecycle_state: >-
      The four findings moved CLOSED at the reviewed object are returned to OPEN at C10A under a
      typed lifecycle_quarantine that preserves every repair field, the completion declarations and
      the historical independent-review support. This withdraws a lifecycle claim, not a technical
      one.
    obligation_effect: >-
      None. MPS-MAT-009#0 remains OPEN: this reviewer is unnamed, and an unnamed technical review
      establishes independence from the implementer and nothing about named human authority. No
      acceptance item, evidence obligation, metric or model artifact is altered by this record.


methodological_observations:

  - id: git_clean_does_not_establish_execution_cold
    proposition: >-
      Verification applicability may depend on derived state that Git does not represent.
    not_a_generic_warning: >-
      This is a witnessed contrast between two reviews, not advice. It is recorded because
      the round-1 suite was reported green by the remediation actor and was not green.
    witnessed_contrast:
      round_1:
        workspace: remediation workspace
        git_state: clean
        carried: ignored derived state
        reported_by_remediation_actor: 404 PASS
        independent_cold_reproduction: 1 failure
      round_2:
        cold_state_established_before_execution: true
        result: 414 of 414 PASS
        independently_repeated_from_another_cold_clone: true
    consequence_adopted: >-
      MI-EXIT-01 controls build their own fixtures in temporary directories and read no
      gitignored product, so the suite's verdict does not depend on what a working tree
      happens to be carrying.

  - id: path_citation_grammar_does_not_recognize_equivalent_absent_path_forms
    raised_by: REV-C5-CUMULATIVE
    proposition: >-
      The path-citation grammar recognizes a repository-relative path in one syntactic form
      only. Naming the same absent artifact with Windows separators, or with a leading ./, is
      not recognized as a citation and passes.
    demonstrated: >-
      Independent mutation in disposable state. The repository-relative form was refused at
      exit 1; the backslash form and the leading-./ form of the same non-existent artifact
      were both accepted at exit 0. Backticked and nested-path forms were correctly refused.
    why_it_is_an_observation_and_not_a_finding: >-
      Nothing in the controlled record relies on it. C5 did not repair NF-13 by respelling a
      path; it removed the citation and described the artifact instead, which is truthful
      independently of the grammar. The exposure is prospective: a future actor could make
      this class of defect disappear by changing separators rather than by correcting the
      representation, and the gate would go green.
    not_repaired_here: >-
      Widening the grammar changes a verified mechanism and is out of scope for a
      record-transport step. If it is taken up it belongs with NF-13's closure question.

  - id: retained_html_evidence_is_outside_the_path_citation_population
    raised_by: REV-C5-CUMULATIVE
    proposition: >-
      The path-citation observer scans .py, .yaml, .yml, .json and .xml under declared roots,
      plus CLAUDE.md. Retained HTML evidence is not in that population, so a
      repository-relative-looking path inside a retained report is structurally unobserved.
    instance: >-
      mps/materialization/evidence/MPS-MAT-009/review-report.html still contains a
      repository-relative form of the JUnit Jupiter report path, inside a preformatted block
      describing where a build writes its reports. The path is not reproduced here, for the
      reason NF-13 records: it names transient derived output that no clone has, so writing it
      into a scanned artifact would recreate that finding rather than describe it.
    recorded_while_transporting_this_observation: >-
      The first draft of this entry did quote the path in full. check_path_citations refused it
      from a cold tree on the next run, naming this file as the citer. The control caught the
      transport actor committing the very defect the observation describes, which is a better
      demonstration that it works than any assertion here would be.
    why_it_is_not_a_defect_to_repair: >-
      That file is a hash-bound retained primary. Editing it to satisfy an observer would
      corrupt retained evidence to improve a gate, which is the wrong direction. The boundary
      is recorded so that it is stated rather than discovered later and mistaken for an escape.

  - id: path_citation_reaches_the_mandatory_path_through_the_regression_suite
    raised_by: REV-C5-CUMULATIVE
    proposition: >-
      tools/spec/check_path_citations.py is not a separate step in
      .github/workflows/controlled-spec-gates.yml. It reaches the mandatory execution path
      only through tests/test_path_citations.py, which the workflow's regression step runs.
    why_this_is_adequate: >-
      The coupling is real and was exercised: the defect NF-13 records failed the full
      regression from a cold clone, which is how it was caught. The control is on the
      mandatory path; it is reached indirectly.
    the_thing_worth_stating: >-
      CLAUDE.md lists the gate among its prescribed verification commands, which can read as
      though it were its own CI step. It is not. Anyone reasoning about which controls run in
      CI should read the workflow rather than the command list.


  - id: the_c6_causal_claim_about_emptying_a_branch_was_inaccurate
    raised_by: independent review of 3e397dc
    proposition: >-
      NF-15 asserted at C6 that "a branch with an empty population is an untested branch, and
      C6 is what emptied it". No such transition occurred: the prose sub-case of the repair
      fallback had zero canonical-CLOSED members before C6, at C6, and after it.
    independently_reproduced: >-
      Confirmed here by classifying the register at 3188a11, 349f2dc and 3e397dc. CLOSED
      findings reaching the prose sub-case: 0, 0, 0. CLOSED findings reaching the sha
      sub-case: 4, 5, 5. What C6 reduced is the potential OPEN population that would depend on
      the prose sub-case, from 7 to 1.
    disposition: >-
      Corrected in the controlled record at C7. NF-15 carries the accurate proposition, the
      three-object measurement, and the withdrawn wording under withdrawn_causal_claim. Not
      promoted to a finding of its own, because it is a defect in a finding's own statement
      and the finding is the right place to correct it.
    the_thing_worth_stating: >-
      The false clause was written by the actor whose commit it credited. An implementer
      measuring a population once, at the end, and attributing the number to its own change is
      the shape here; the measurement was never taken before the change it was said to have
      caused.

  - id: cumulative_repair_verification_has_two_representations_and_no_binding_observer
    raised_by: independent review of 3e397dc
    proposition: >-
      Cumulative repair verification is stated twice. The review side carries typed
      verified_repairs_of and not_verified_repairs_of on REV-C5-CUMULATIVE; the finding side
      carries prose independent_review_support on each finding. The two currently agree, and
      nothing observes that they do.
    why_it_is_an_observation_and_not_a_finding: >-
      Nothing in the controlled record relies on their agreement. The typed side is what
      completion_declaration_problems resolves; the prose side is explicitly non-authoritative
      under the same rule that makes closure_note non-authoritative, so a divergence would
      mislead a reader without moving any controlled state. Promoting it would also invite the
      repair the next line refuses.
    not_repaired_here: >-
      No synchronization mechanism is introduced at C7. A binding observer would have to
      decide which side is authoritative, and that decision is not the implementer's while the
      typed side's provenance is itself under review -- see the next observation.

  - id: verified_repairs_of_was_authored_by_the_remediation_actor
    raised_by: independent review of 3e397dc
    proposition: >-
      verified_repairs_of and not_verified_repairs_of were written into REV-C5-CUMULATIVE by
      the implementation and remediation actor, inside a controlled entry that represents an
      independent review. The entry's structure does not distinguish what the reviewer
      established from what the implementer inferred the reviewer had established.
    what_this_does_not_establish: >-
      That authorship is not evidence of what the independent reviewer verified. The list is a
      claim about the review, made by someone who was not the reviewer, and it must not be
      read as the review's own output.
    consequence_for_the_next_review: >-
      The next independent review determines, per finding, whether each verification
      relationship is supported by the actual review evidence. Until then the completion model
      must not be used to move controlled finding state, which is why C7 closes nothing.
    why_it_is_an_observation_and_not_a_finding: >-
      It is a provenance limitation of a record C7 deliberately leaves standing, disclosed so
      the next reviewer can assess it. Recording it as a finding would imply a repair, and the
      only repair is the review itself.
    not_cured_here: >-
      C7 does not change these records to cure the independence boundary, and no reviewer
      identity or authorship is fabricated. REV-C5-CUMULATIVE, verified_repairs_of, the
      finding-side independent_review_support and the C6 completion declarations are all
      preserved as written so they can be assessed.

  - id: retention_applicability_is_keyed_to_one_object_reference_field
    raised_by: independent review of 3e397dc
    proposition: >-
      finding_record_completeness requires primary_artifact_retention of any finding naming a
      reviewed_object. The requirement is keyed structurally to that field name, so a finding
      that names an object through a different field is outside it.
    instances_in_this_register: >-
      NF-15, NF-16 and NF-17 each name an object through observed_at_object and are therefore
      not subject to the requirement. Each declares no_primary_artifact_retention_is_declared
      with a reason, which is disclosure rather than compliance -- the rule did not ask.
    why_it_is_an_observation_and_not_a_finding: >-
      The rule's stated scope is what it claims, and it does not overstate itself. Nothing has
      escaped a retention obligation it was under; the question is whether the obligation
      should reach further, which is a scoping decision about the rule.
    not_repaired_here: >-
      The retention model is not broadened at C7. Widening it to any object-naming field would
      change what a large number of existing records are required to carry, which is a
      controlled change to the rule and not an implementation detail.


  - id: the_closure_machinery_lives_in_a_test_module
    raised_by: REV-C7-CUMULATIVE
    proposition: >-
      The closure, completion and identity observers are defined in
      tests/test_closure_warrant.py rather than in a tool under tools/. Every other controlled
      gate is a script with its own exit code.
    why_it_is_an_observation_and_not_a_finding: >-
      A test can be a mandatory observer if its execution path is guaranteed, and the location
      is not what made anything unreachable. Two real reachability defects were found alongside
      it and both are repaired: NF-18, direct invocation collecting only part of the module,
      and NF-21, the CI job stopping before most of its declared controls. Promoting the
      location itself would be an architectural preference, and building a second tool to hold
      the same predicates would create the two-representations problem this register already
      records for cumulative repair verification.
    what_would_change_the_assessment: >-
      If the module's execution path stopped being guaranteed -- removed from the regression
      step, or reachable only through a route that collects part of it -- the location would
      stop being incidental. That is why NF-18's control compares collected identities across
      both invocation routes rather than checking that the file merely runs.


  - id: document_build_is_publication_not_a_mandatory_control
    raised_by: REV-C8-CUMULATIVE, as the classification question behind NF-25
    proposition: >-
      The controlled workflow has a second job, document-build, declared `needs:
      structural-gates` with no condition. structural-gates now ends RED on the standing
      evidence reconciler, so document-build does not run. The question the review raised is
      whether that is a reachability defect.
    determination: >-
      It is not. document-build is publication activity and carries no mandatory control.
    how_it_was_determined: >-
      Derived from the repository rather than assumed. Its two commands are
      tools/docs/compile_controlled_docs.py and tools/release/build_pdf_manifest.py, both
      producers with no check mode: neither asserts anything about the model, the corpus or
      the record, and neither can fail in the way a control fails. Both appear in
      spec/readiness.yaml only as EVIDENCE CITATIONS for remediation items -- the tool's
      existence is what is cited, not its execution in CI. check_gate_readiness and
      check_approval_state neither invoke them nor read output/pdf. CLAUDE.md does not list
      them among its verification commands. The job's product is an uploaded review artifact
      which spec/readiness.yaml itself residualises as not a governed or clinically authorized
      release.
    consequence_adopted: >-
      The workflow topology is unchanged, and no job-level condition is added. What is repaired
      instead is the observer's wording, which claimed "every mandatory control in the
      controlled workflow" while enforcing a property of one job. The claim is narrowed to the
      population it actually enforces.
    what_would_change_the_assessment: >-
      A control moving into document-build, or a gate coming to depend on output/pdf. The
      observer therefore fails if a job outside its declared scope acquires a command that
      looks like a control, rather than silently continuing to describe one job.

  - id: replacing_a_count_with_an_identity_does_not_by_itself_make_evidence_exact
    raised_by: REV-C8-CUMULATIVE, generalising NF-26
    proposition: >-
      C8 corrected NF-16 by replacing two incommensurable counts with named test identities.
      That was the right correction and it was still wrong, because the names were measured
      against a mutation the record described differently -- "the C6 form", which has two
      spellings that produce two different discriminator sets.
    the_thing_worth_stating: >-
      An identity is only more exact than a cardinality if the thing it identifies is itself
      pinned. Naming the discriminating controls made the evidence look precise while leaving
      the mutation, and therefore the answer, undetermined. Where a measurement depends on an
      intervention, the intervention needs an identity too, and it needs to be the one that was
      actually applied.
    consequence_adopted: >-
      NF-16 now records the mutation verbatim, including the spelling, states why the spelling
      is load-bearing, and binds each discriminator set to the object at which those controls
      exist.


  - id: the_25_record_queue_was_attached_to_nf_05_by_a_misplaced_edit
    raised_by: >-
      REV-3188A11-PER-FINDING found the divergence; the mechanical cause was established during
      this transport
    proposition: >-
      NF-05's independent_review_support carries a block about adjudicating "the 25 state-debt
      records". The retained review found that at 3188a11 NF-05 has no residual key and makes no
      reference to that population in any field, and that the queue belongs to NF-09 -- as
      NF-10's residual states in the same register. A disposition actor relying on the later
      prose would apply to NF-05 a residual NF-05 does not carry.
    the_divergence_is_confirmed_and_its_cause_is_determinable: >-
      NF-05 has no residual key. Two blocks that were written for NF-09 --
      why_no_completion_object_is_declared and
      what_would_make_a_completion_object_truthful_later -- are present on NF-05 and absent from
      NF-09. They were introduced at 3e397dc by an edit that anchored on the closing sentence of
      NF-09's why_this_does_not_close_the_finding and replaced the FIRST occurrence; NF-05
      carries closing text the anchor also matched, and NF-05 precedes NF-09 in the file. So the
      addition landed on the wrong finding and NF-09 never received it.
    why_this_is_recorded_rather_than_repaired: >-
      This is record transport. Moving the blocks is a record repair, and §9 of the governing
      brief requires the contradiction to be stated rather than history silently rewritten. The
      misplacement is left exactly where it is, NF-05 carries a pointer to this observation, and
      whoever disposes of NF-05 or NF-09 relocates them deliberately.
    what_it_means_for_disposition: >-
      NF-05's SUPPORTED determination carries residual NONE. Any disposition of NF-05 that
      declines closure on the strength of a 25-record queue would be declining on NF-09's
      residual. Equally, NF-09 is currently missing the abstention text that explains why it
      takes no completion object, which does not change NF-09's state but does make its record
      less self-explanatory than it was written to be.
    the_generalisation: >-
      An anchored first-occurrence replacement is a population selection, and this register's
      recurring defect is a population that is not what its author believed. The same failure
      shape as NF-20 and NF-27, in an editing script rather than an observer, and it went
      unnoticed for three checkpoints because nothing reads a finding's prose.


  - id: a_transport_step_control_had_encoded_its_own_step_as_a_permanent_invariant
    raised_by: the governance disposition actor, on its own prior work
    proposition: >-
      The retained-artifact binding control added at the evidence-transport step asserted two
      things that were true of that commit and are not rules of the model: that no finding may
      cite a retained per-finding review as its closure_review, and that every SUPPORTED
      finding must still be OPEN. The first is contradicted by the closure rule itself, which
      expressly matches a finding's closure_review against a review whose reviewed object
      equals the finding's closure target. The second denies the disposition authority the
      transport step was explicitly deferring to.
    how_it_surfaced: >-
      It blocked the first legitimate disposition. Four findings whose closure mechanics
      resolve exactly, on a warrant the control itself had just verified, could not be closed
      without the control failing.
    a_second_instance_in_the_same_commit: >-
      CompletionObjectMutations carried the same defect from three checkpoints earlier, under
      the docstring "C6 changes the model; it performs no closure transition": it asserted
      that every finding declaring a repair_completion_object must be OPEN. A completion
      object exists so that such a finding can eventually close against exactly that object,
      so the assertion made C6's own mechanism permanently unusable and would have been
      satisfied forever by never dispositioning anything. Amended to the property C6 actually
      built -- a finding that has left OPEN must have closed against its DECLARED completion
      object and nothing else -- which constrains the transition rather than forbidding it.
      Sensitivity demonstrated both ways: repointing a closed finding at a review of another
      object, and stripping its warrant entirely, are each refused by the amended control and
      independently by the closure observer.
    two_instances_one_shape: >-
      Both controls were written by an actor that was, at the time, correctly forbidden from
      moving state, and both wrote that prohibition into a permanent invariant instead of into
      the commit. Neither was detectable while no one tried to act, which is why both surfaced
      on the same day the next authority in the sequence first exercised its own.
    what_was_done: >-
      The control was amended, not removed, and the amendment is disclosed in its docstring.
      What it asserts now is that a SUPPORTED determination alone never moves a finding out of
      OPEN, and that any finding which has left OPEN must carry a typed closure_review that
      resolves under the closure rule, with the closure observer -- untouched -- deciding
      whether it resolves. Failure sensitivity was demonstrated by forcing a SUPPORTED finding
      to CLOSED with no warrant: the amended control and the closure observer both refuse it,
      where the previous version could not tell an unwarranted closure from a warranted one
      because it forbade both.
    withdrawn_ordering_claim:
      withdrawn_wording: >-
        "What it asserts now is the property that is actually permanent and is strictly
        stronger", and, of the same change, "which is a narrower permission and a wider
        detection".
      why_it_is_withdrawn: >-
        NF-34 / IR-04. Neither amendment was strictly stronger, and describing a weakening as a
        strengthening is the defect class this register exists to catch -- here inside the
        rationale for the change that produced a disposition which then failed independent
        review. The wording is preserved above rather than deleted, and the actual ordering
        relation of each amendment is stated below.
      control_A_completion_object_mutations:
        relation: strict weakening
        old_proposition: >-
          Every finding declaring a repair_completion_object must be OPEN.
        new_proposition: >-
          A finding declaring a repair_completion_object that has left OPEN must have closed
          against exactly that declared object.
        why_this_ordering: >-
          The old proposition refused every state in which such a finding is not OPEN. The new
          one admits a proper subset of those refused states -- the warranted closures. Every
          record the new proposition accepts, the old one rejected; the converse does not hold.
          That is a strict weakening. It is defended as CORRECTLY SCOPED rather than as
          stronger: the old proposition was wrong, because it made C6's own mechanism
          permanently unusable and would have been satisfied forever by never dispositioning
          anything. A wrong proposition can be strictly stronger, and this one was.
      control_B_retained_artifact_binding:
        relation: incomparable
        old_proposition: >-
          No finding may cite a retained per-finding review as its closure_review, and every
          finding carrying a SUPPORTED determination must still be OPEN.
        new_proposition: >-
          A SUPPORTED determination alone never moves a finding out of OPEN, and a finding that
          has left OPEN must carry a typed closure_review that resolves under the closure rule.
        why_this_ordering: >-
          Neither proposition implies the other. The old one detects any citation of a retained
          review as warrant, which the new one permits; the new one detects an unwarranted
          closure of a SUPPORTED finding, which the old one could not distinguish from a
          warranted one because it forbade both. One detection direction was traded for
          another. The two are incomparable, and no ordering claim is available in either
          direction.
      what_this_correction_does_not_say: >-
        It does not say the amendments were wrong to make, and it does not restore either old
        proposition. It says the record described the change inaccurately. Whether a correctly
        scoped weakening was the right change is a question for review; asserting it was a
        strengthening removed that question from the reader.
    why_this_is_not_weakening_a_control_to_pass_a_disposition: >-
      The substantive closure controls are untouched and now carry the weight. The amended
      clause moved from "this transition may not happen" to "this transition may happen only
      through a resolving warrant". That is a weakening of the clause, correctly scoped and not
      a strengthening; the ordering relation of both amendments is stated in
      withdrawn_ordering_claim above and the earlier characterisation is withdrawn there. A
      control that forbids a legitimate authority from acting is not a strong control; it is a
      control measuring the wrong proposition, and it would have been satisfied forever by
      never dispositioning anything.
    the_generalisation: >-
      A control written at step N can silently encode step N's own invariant as the model's.
      The same shape as NF-20 and NF-27 -- a claim wider than the mechanism, or a mechanism
      narrower than its claim -- appearing this time in a control the author wrote one commit
      earlier, and caught only because the next authority in the sequence tried to act.

  - id: a_third_control_had_encoded_its_own_step_as_a_permanent_invariant
    raised_by: the C10B remediation actor, on the control amended one checkpoint earlier
    proposition: >-
      test_a_supported_determination_confers_no_closure_by_itself, as amended at the disposition
      step, asserted that a SUPPORTED finding which has left OPEN must name THAT retained review
      as its warrant. True of the disposition, and not a rule: under the authority model a
      SUPPORTED finding closes against whichever review GRANTS it closure authority, and the
      retained review grants none -- so the clause required precisely the warrant the model now
      forbids. It was written in the same commit whose register observation recorded two earlier
      instances of this exact shape.
    the_ordering_relation: >-
      Incomparable, and stated as such rather than as a strengthening. The old clause accepts a
      SUPPORTED finding closed against the retained review, which the new one refuses; the new one
      accepts a SUPPORTED finding closed against another granting review, which the old one
      refused. Neither implies the other. NF-34 exists because the previous checkpoint claimed a
      strengthening it did not have, so the relation is named here rather than characterised.
    what_it_asserts_now: >-
      That the retained review grants closure authority to nothing, and that any SUPPORTED finding
      which has left OPEN carries a warrant that both resolves under the closure rule and grants
      authority for that finding. Both halves are executed against the observers rather than
      asserted from the control's own reading.
    why_three_instances_matter_more_than_three_fixes: >-
      Every one was written by an actor correctly forbidden from moving state at the time, and
      every one wrote that prohibition into a permanent invariant instead of into its commit. None
      was detectable while nobody tried to act. The pattern is now named in the register rather
      than rediscovered a fourth time: a control written at step N must assert what is true of the
      MODEL, and if the author cannot separate that from what is true of step N, the control
      belongs in the commit message.

  - id: the_authority_model_freezes_closure_until_c10_is_reviewed
    raised_by: the C10B remediation actor
    proposition: >-
      With per-finding closure authority required and every declared mechanism UNVERIFIED, no new
      lifecycle closure can pass the controls. That is the intended state and not a side effect:
      C10 introduces the authorization model, so C10 must not also be the checkpoint that uses it.
    how_it_is_asserted: >-
      Not left implicit. A control asserts that every mechanism reads UNVERIFIED and that no
      registered review declares any mechanism verified, so the freeze is observed rather than
      assumed, and lifting it requires a review to say what it verified.
    what_lifting_it_requires: >-
      An independent review of the C10 object that declares, per mechanism, which mechanism, its
      introduction object, the exact checkpoint reviewed, that the mechanism is present and
      effective there, and its verdict. Then a separate lifecycle-authority review granting or
      denying closure per finding. Then a separate disposition commit. Three acts, three
      authorities, in that order.

obligation_effect:
  mps_mat_009_hash_0:
    state: OPEN
    unchanged_by_this_register: true
    why: >-
      The obligation requires a NAMED reviewer. Four independent technical reviews, all by
      unnamed reviewers, establish independence from the implementer and nothing about named
      human authority. No state machinery is forced: the obligation's observer still reports
      it OPEN, and this register does not attempt to move it.
  assurance_state_unchanged: >-
    This checkpoint transports review evidence only. No acceptance item, obligation state,
    metric or model artifact is altered by it.
