schema_version: "0.1"
register_id: MPS-MAT-009-REVIEWS
title: Independent technical review results for the MPS-MAT-009 remediation sequence
status: open

purpose: >-
  One place, one convention. Before this register, F2 carried an independent-verification
  result and F1, F5 and MI-EXIT-01 did not, although all four had been reviewed. That
  asymmetry is misleading in a specific way: a reader is entitled to read absence as "not
  independently reviewed", so a record that omits the field says something false by omitting
  it. The remedy is a single normalized structure covering the whole reviewed population,
  including the ones that failed.

what_these_reviews_are_and_are_not:
  establish: >-
    Technical independence from the remediation actor. The reviewer did not implement the
    object being reviewed, so the verdict is not the implementer marking their own work.
  do_not_establish: >-
    The named human authority that MPS-MAT-009 requires. Every reviewer below is unnamed.
    INDEPENDENTLY VERIFIED must never be read as discharging MPS-MAT-009#0, which asks for a
    NAMED reviewer precisely because it is a human judgement that no gate and no unnamed
    process can stand in for.
  consequence: MPS-MAT-009#0 remains OPEN. See obligation_effect below.

closure_rule:
  purpose: >-
    NF-05 and NF-06. A finding was moved to CLOSED by writing a sentence in closed_by that
    described an independent review, and nothing resolved it. A convincing string was
    therefore sufficient to close a finding, whether or not the review it named existed,
    reviewed the right object, or returned a passing verdict.
  invariant: >-
    For every applicable CLOSED finding f there must exist exactly one review r in this
    register such that closure_review(f) = r, reviewed_object(r) = closure_target(f),
    verdict(r) is a closing verdict, AND r explicitly grants closure authority for f.
  invariant_amended_at_c10b: >-
    NF-33 / IR-03. The final clause is new and every earlier clause is untouched. All of them
    together were satisfiable by a review that had said nothing whatever about the finding,
    because closure authority was read off the review-LEVEL verdict: at 00c6e2f a review whose
    own retained artifact declares "repair support only; not lifecycle disposition" served as
    the warrant for four findings and the observer reported clean. The grant is now positive,
    per finding, and read from per_finding_authority -- see per_finding_authority_model. A
    closing verdict remains necessary and is no longer sufficient. The identity clause is NOT
    relaxed in either direction: this is an additional conjunct, not a substitution, and the
    relation between the old rule and the new one is a strict strengthening. That is stated
    deliberately, because NF-34 records this register describing a weakening as a strengthening
    one checkpoint ago; here every record the new rule accepts was accepted by the old one, and
    the converse fails.
  invariant_note: >-
    Amended at C6, and the amendment is to the target only. closure_target(f) is repair(f)
    unless f declares a repair_completion_object, in which case it is that object. The
    relation itself is unchanged and stays exact object identity: no ancestry, no
    descendant, no prefix, no most-recent review. Before C6 this sentence read
    reviewed_object(r) = repair(f), which stopped describing the observer the moment
    completion objects existed -- the stale-narrative defect NF-12 records, appearing in the
    rule NF-12 itself depends on.
  applies_to_finding_state: CLOSED
  requires_field: closure_review
  matched_against: >-
    the finding's closure target: its repair_completion_object when one is declared, and
    otherwise its repair field. Either way it names the one object the review must have
    reviewed.
  closing_verdicts:
    - INDEPENDENTLY VERIFIED
  closing_verdicts_note: >-
    Controlled data, read by the observer. It is deliberately NOT duplicated as a literal in
    test code: a control that carries its own copy of the rule stops testing the rule and
    starts testing its copy, and the two agree until they do not.
  prose_is_not_warrant: >-
    closure_note fields carry human-readable context and are explicitly non-authoritative.
    No observer parses them, and no closure rests on them.

repair_completion_rule:
  purpose: >-
    Some repairs are introduced at one commit and are only complete after later remediation
    commits. NF-06's mechanism landed at C1 and acquired population defects that were
    repaired at C3 and C4; the complete repaired proposition first existed at C5. The record
    could express where a repair was introduced, or it could express where it became
    complete, but not both -- so the closure rule, which matches object identity, had nothing
    correct to match against.
  what_it_is_not: >-
    This is NOT ancestry-based closure. A descendant of the repair object is not a substitute
    for it, "the latest review" is never adopted, no prefix matches, and no completion object
    is ever inferred. Ancestry appears below only as a validity precondition on a declaration
    a human wrote, never as a way of satisfying the closure match.
  fields:
    repair: >-
      Preserved unchanged. The historical object, or historical statement, identifying where
      the repair was introduced. C6 does not rewrite it for any finding.
    repair_introduced_object: >-
      The typed commit object corresponding to `repair`. Required alongside a completion
      declaration because `repair` is a commit sha on the RT-F findings and prose on the NF
      findings, and an ancestry precondition cannot be evaluated against prose. See NF-15.
    repair_completion_object: >-
      The exact commit object at which all changes necessary to complete this finding's
      repair are present. It does not erase or replace the repair object.
    repair_completion_reason: >-
      Why the original repair object alone was not the complete repaired proposition. Prose,
      and required, but never authority: the completion object is the machine-relevant field.
  closure_target: >-
    if repair_completion_object exists, the closure target is repair_completion_object;
    otherwise it is repair. The closure rule then requires reviewed_object(review) to equal
    that target EXACTLY, unchanged from before.
  validity_conditions:
    - the original repair field is present and unchanged
    - repair_completion_object is an exact commit object that resolves in this repository
    - repair_introduced_object is an exact commit object that resolves in this repository
    - repair_introduced_object is an ancestor of, or identical to, repair_completion_object
    - repair_completion_reason is present and non-empty
    - >-
      exactly one registered review both lists this finding in verified_repairs_of and has a
      reviewed_object equal to the completion object; zero or more than one is a failure
    - that review's verdict is in closing_verdicts
    - that review carries valid reviewer and evidence-retention semantics
    - no prose note substitutes for any failed condition
  no_closure_transition_in_c6: >-
    C6 establishes the model and the truthful completion metadata only. Even where the rule
    would now make a finding mechanically closable, its state is left OPEN: a changed closure
    model must itself be independently verified before it is used to move controlled finding
    state.

per_finding_authority_model:
  purpose: >-
    NF-33 / IR-03 and NF-36 / IR-06. Six overlapping representations answered questions about
    what a review established for a finding -- verified_repairs_of, per_finding_determinations,
    warrants_closure_of, the finding-side independent_review_support, the review-level verdict,
    and the narrative verdict_scope and scope_note. No two of them were reconciled against each
    other, and authority drifted into whichever one an observer happened to read. At 00c6e2f a
    review whose own artifact says "repair support only; not lifecycle disposition" served as the
    closure warrant for four findings, and every control reported clean.
  the_two_questions_and_where_each_is_answered:
    did_this_review_verify_this_findings_repair: >-
      Answered ONLY by per_finding_authority[<finding>].repair_support on the review record.
    did_this_review_grant_authority_to_close_this_finding: >-
      Answered ONLY by per_finding_authority[<finding>].closure_authority on the review record.
  why_they_are_separate: >-
    They are different propositions with different authorities behind them. A reviewer can
    establish that a repair does what it claims without deciding that the finding should leave
    OPEN -- residuals, dependencies and acceptance-blocking status are a governance judgement, not
    a technical one. REV-3188A11-PER-FINDING is the live case: its retained artifact determines
    six repairs SUPPORTED and states in its own words that it declares no finding CLOSED.
    Collapsing the two would make every competent technical review a closing instrument.
  canonical_location: reviews[].per_finding_authority
  canonical_shape: >-
    A mapping from finding id to a record carrying repair_support, closure_authority, and a basis
    for each. Absence of a finding from a review's mapping means that review answers neither
    question for that finding -- it is not a silent grant and not a silent denial.
  repair_support_values:
    VERIFIED: >-
      The review established that this finding's repair does what the finding claims, at the
      object the review reviewed.
    NOT_VERIFIED: >-
      The review examined the repair and did not establish it.
    INDETERMINATE: >-
      The review's record cannot establish the determination one way or the other. Used where a
      per-finding claim exists but its provenance does not support it.
  closure_authority_values:
    GRANTED: >-
      The review explicitly authorizes moving this finding to CLOSED at the object it reviewed.
    DENIED: >-
      The review explicitly declines to authorize closure of this finding.
    INDETERMINATE: >-
      The review's scope does not reach the question. Never a grant.
  closure_requires: GRANTED
  closure_requires_note: >-
    A hard invariant. GRANTED is the only value that permits closure; DENIED, INDETERMINATE and
    absence all refuse it. A closing review-LEVEL verdict is necessary and is not sufficient: it
    says the review passed, not that it authorized anything about a particular finding.
  exact_object_identity_is_unchanged: >-
    This model adds a positive per-finding requirement ON TOP of exact object identity. It
    removes nothing. reviewed_object(r) must still equal closure_target(f) exactly -- no
    ancestry, no prefix, no abbreviated equivalence, no case normalisation, no latest review, no
    nearest descendant, no promotion.
  derived_and_reconciled_fields:
    warrants_closure_of:
      status: derived
      rule: >-
        Where present, it must equal exactly the set of findings for which this review declares
        closure_authority GRANTED, in both directions. It is a reading convenience and never an
        independent authority source; a control refuses any divergence.
    verified_repairs_of:
      status: historical_non_authoritative
      rule: >-
        Retained for provenance and read by nothing. It is not permitted to answer either
        question, and where it diverges from the canonical structure the divergence must be
        declared on the review record rather than silently tolerated. See
        REV-C5-CUMULATIVE.verified_repairs_of_authority.
    per_finding_determinations:
      status: canonical_source_for_retained_reviews
      rule: >-
        Where a review declares primary_artifact_retention `retained`, its per-finding
        determinations are extracted from the retained bytes and must agree with
        per_finding_authority[<finding>].repair_support through the controlled mapping below.
        The retained artifact is the evidence; per_finding_authority is the typed reading of it.
    retained_determination_to_repair_support:
      SUPPORTED: VERIFIED
      NOT_SUPPORTED: NOT_VERIFIED
      INDETERMINATE: INDETERMINATE
  prose_is_never_authority: >-
    The finding-side independent_review_support, closure_note, governance_disposition rationale
    and every scope_note remain in the record as context. No observer parses them and no closure
    rests on them. A control asserts that the authority observers name none of those fields.

mechanism_verification_model:
  purpose: >-
    NF-31 / IR-01. repair_completion_rule.no_closure_transition_in_c6 required that a changed
    closure model be independently verified before it is next used to move lifecycle state. That
    requirement had no mechanism: no review declared what it verified, so the condition could only
    ever be satisfied by implication from a later cumulative review of a descendant object. That is
    ancestry reasoning, which this register refuses everywhere else.
  the_safety_property_retained: >-
    A changed closure or authorization mechanism must be independently verified BEFORE it is next
    used to move lifecycle state.
  what_is_relaxed_and_why: >-
    A dedicated review of every intermediate commit that introduced part of a mechanism is NOT
    required. An explicitly scoped cumulative review may satisfy the condition. What is no longer
    permitted is satisfying it silently: the review must say so.
  a_cumulative_review_satisfies_it_only_if_it_declares: >-
    mechanism, introduced_at, verified_at_checkpoint as an exact object, that the mechanism is
    present and effective at that checkpoint, and its verdict on the mechanism. All five, typed.
  ancestry_is_never_sufficient: >-
    That a verified object descends from the object introducing a mechanism establishes nothing
    about whether the review looked at it. A cumulative review with no mechanisms_verified entry
    does not verify any mechanism, however recent and however favourable.
  depends_when_vocabulary:
    always: >-
      Every lifecycle transition made at or after this mechanism's introduction depends on
      it.
    finding_declares_completion_object: >-
      Only a closure whose finding declares repair_completion_object depends on it.
    note: >-
      Typed because the observer must decide dependency mechanically. The prose key
      a_closure_depends_on_it_when states the same thing for a reader and is not read by any
      observer.
  what_this_observer_cannot_establish: >-
    The object at which a lifecycle transition was made is not recorded in the finding record,
    so `first used for state movement` cannot be resolved from the register alone. The
    observer therefore enforces the checkable half -- that every mechanism a CLOSED finding
    depends on is declared verified by some registered review at an exact object where the
    mechanism exists -- and reports the unresolvable half as a stated limitation rather than
    as an observation it made. This is deliberate: an observer that inferred transition order
    from Git committer timestamps would be treating metadata as controlled evidence, which no
    controlled process here declares it to be.
  three_states_kept_distinct:
    introduced: the object at which the mechanism first exists
    independently_verified: an exact object at which a review declares it verified
    first_used_for_state_movement: the transition that relies on it
  ordering_evidence: >-
    Ordering between two exact objects is taken from repository ancestry, which is a structural
    fact about the object graph. Git author and committer timestamps are NOT consulted and are not
    declared authoritative by any controlled process here. Where ordering cannot be established
    from ancestry -- unrelated objects, or an object not yet in the repository -- the observer
    reports the limitation as UNRESOLVED and counts it against the requirement rather than
    treating it as satisfied.
  applies_prospectively: >-
    To lifecycle transitions made at or after a mechanism's introduction. Closures that predate a
    mechanism are named explicitly in grandfathered_closures below rather than exempted silently;
    adding to that list is a visible controlled change.
  grandfathered_closures:
    findings: [RT-F-03, RT-F-04, RT-F-05, RT-F-06, NF-13]
    why: >-
      These five were CLOSED before any mechanism-verification requirement existed, and none of
      them depends on the closure-completion model: not one declares a repair_completion_object,
      so each closed against its own repair object under the original rule. They are listed
      individually rather than derived from a date, and each still satisfies every other closure
      predicate including the new per-finding authority requirement.
    what_this_is_not: >-
      Not an assertion that those closures were reviewed against the new model. It is an explicit
      statement of which closures the new mechanism requirement does not reach, so that the
      exemption is visible instead of implied by the requirement's start date.

mechanisms:
  closure-completion-model:
    what_it_is: >-
      The interpretation of repair_completion_object as the object a closure review must have
      reviewed, in place of the repair field.
    introduced_at: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
    introduced_at_phase: C6
    a_closure_depends_on_it_when: the finding declares repair_completion_object
    depends_when: finding_declares_completion_object
    verification_state: UNVERIFIED
    verification_state_basis: >-
      Derived, not declared: no registered review carries a mechanisms_verified entry naming this
      mechanism. REV-C9-CUMULATIVE returned INDEPENDENTLY VERIFIED against 5ec6b5f, a descendant of
      the introducing object, and says nothing about this mechanism. Under ancestry_is_never_
      sufficient that establishes nothing about it.
  per-finding-closure-authority:
    what_it_is: >-
      The requirement that a closure warrant explicitly grant closure authority for the finding it
      is cited to close, and the canonical per-finding authority representation it reads.
    introduced_at: pending
    introduced_at_phase: C10B
    introduced_at_note: >-
      Deliberately unresolved. A record cannot name the commit that contains it, and writing a
      placeholder object would be a false identity. The next independent review binds this to the
      exact C10B object it reviews. Until then the observer treats it as introduced at this
      checkpoint and unverified, which is the conservative direction.
    a_closure_depends_on_it_when: >-
      always, for any lifecycle transition made at or after its introduction
    depends_when: always
    verification_state: UNVERIFIED
    verification_state_basis: >-
      Introduced by this checkpoint and reviewed by nobody yet. This is the intended state: C10
      must itself be independently verified before the model it introduces may be used.
  repair-completion-declarations:
    what_it_is: >-
      The six repair_completion_object declarations naming 3188a11 as the object at which each
      repair became complete.
    introduced_at: 3e397dcbdb63bc30a7d19372ac1d00713bd8f17d
    introduced_at_phase: C6
    a_closure_depends_on_it_when: the finding declares repair_completion_object
    depends_when: finding_declares_completion_object
    verification_state: UNVERIFIED
    verification_state_basis: >-
      NF-37 / IR-07. These declarations did not exist at 3188a11 -- zero findings declare the field
      at that object, and the six first appear at 3e397dc -- so the retained review of 3188a11
      cannot have verified them, and no later review has. Whether each declaration truthfully
      identifies 3188a11 is an open question owed to a future reviewer.

three_propositions_kept_separate:
  purpose: >-
    NF-37 / IR-07. The record offered one review as support for three different claims. They are
    separated here so that no future reader can take the first as evidence of the other two.
  A_repair_mechanism_was_valid_at_3188a11:
    established_by: REV-3188A11-PER-FINDING
    status: ESTABLISHED
    scope: repair support only, per the retained artifact's own statement of its scope
  B_the_later_declaration_truthfully_identifies_3188a11:
    established_by: nothing
    status: NOT ESTABLISHED
    why: >-
      The declarations were introduced at 3e397dc, after the reviewed object. A review of 3188a11
      could not have examined an artifact that did not exist there.
    owed_to: the next independent review, explicitly
  C_the_model_interpreting_that_declaration_is_verified:
    established_by: nothing
    status: NOT ESTABLISHED
    why: >-
      The closure-completion model was introduced at 3e397dc and no review declares it verified.
    owed_to: the next independent review, explicitly
  no_retroactive_claim_is_made: >-
    Nothing here asserts that a later review retroactively satisfied a pre-use condition. The
    failed disposition at 00c6e2f remains failed, NF-31 remains open, and the revised rule applies
    prospectively.


verdict_vocabulary:
  PENDING: reviewed object exists; independent review has not returned
  FAIL: independent review returned a failing verdict against the reviewed object
  INDEPENDENTLY VERIFIED: independent review returned a passing verdict
  note: >-
    PENDING is a legitimate state. The control over this register checks that the reviewed
    population is represented consistently, not that every repair carries a verdict before a
    review has happened.

population:
  definition: >-
    An independently reviewable UNIT of remediation work. Defined by content, not by
    filename: the one record that already carried a verdict, f2-observability.yaml, is
    precisely the file a *-repair.yaml glob would miss, so a pattern-based population would
    have excluded the only member that already had what the others lacked.

  membership_kinds:
    record_file_backed: >-
      The unit is described by a controlled record file, which the entry names. Only these
      participate in directory classification, because only these possess a record path.
    commit_scoped: >-
      The unit is a reviewed commit with no backing record file. RT-F-06: a population
      derived only from record files cannot discover such a unit, so it would be invisible
      to the very control meant to detect omission. Requiring a synthetic record file to
      make it visible would be manufacturing evidence to satisfy an observer.
  why_the_discriminator_lives_here: >-
    This is the authoritative classification. A second scheme -- per-file self-declaration,
    an id list, another pattern -- would be a competing source of truth that drifts, and the
    drift would be invisible for exactly as long as the two happened to agree. One
    classification structure, two populations derived from it, zero competing schemes.

  reviewable_units:
    - kind: record_file_backed
      record: mps/materialization/mps-mat-009/f2-observability.yaml
      review: REV-F2
    - kind: record_file_backed
      record: mps/materialization/mps-mat-009/f1-repair.yaml
      review: REV-F1
    - kind: record_file_backed
      record: mps/materialization/mps-mat-009/f5-repair.yaml
      review: REV-F5
    - kind: commit_scoped
      reviewed_object: ae475138c77f9bcc6fb6508d90b4dafcc10a5cba
      review: REV-MI-EXIT-01-R1
    - kind: commit_scoped
      reviewed_object: 51261fdd73002143f2cc81d702740f468e251e76
      review: REV-MI-EXIT-01-R2
    - kind: commit_scoped
      reviewed_object: d6faf77d517a2b369033c38a99155f666982ff1e
      review: REV-RECORD-TRANSPORT
    - kind: commit_scoped
      reviewed_object: 7ad9b81e3bd7f67f7b1e87ef2cc0eafb76c349a7
      review: REV-RT-F-CLOSURE
    - kind: commit_scoped
      reviewed_object: 58d18db1f952ff18f9853161eb979048483e4bc5
      review: REV-RT-F-SUBSTANCE
    - kind: commit_scoped
      reviewed_object: 3188a11443e33c8c4f68933cf73282108957f356
      review: REV-C5-CUMULATIVE
    - kind: commit_scoped
      reviewed_object: 2f10b3e97e7461870700afb69db0ec6401326518
      review: REV-C7-CUMULATIVE
    - kind: commit_scoped
      reviewed_object: 0db0213be250a05bf32b9466ee836a6ebf31eb19
      review: REV-C8-CUMULATIVE
    - kind: commit_scoped
      reviewed_object: 5ec6b5f540c6dd75c2c97790e61b39d2280500e4
      review: REV-C9-CUMULATIVE
    - kind: commit_scoped
      reviewed_object: 3188a11443e33c8c4f68933cf73282108957f356
      review: REV-3188A11-PER-FINDING
    - kind: commit_scoped
      reviewed_object: 00c6e2f097f2fbc58371ca7d019c3d0a5610eee1
      review: REV-POST-C9-DISPOSITION

  membership_kind_is_not_object_identity_strength: >-
    Two independent dimensions, deliberately not conflated. REV-F2 is record_file_backed and
    its reviewed object is nonetheless only working-tree identified; REV-MI-EXIT-01-R1 is
    commit_scoped and SHA-bound. How a unit enters the population says nothing about how
    strongly the thing it reviewed was identified, and F2's weaker historical identity is
    preserved exactly as observed rather than silently upgraded to commit-scoped evidence.

  supporting_records:
    reason: >-
      These describe or support a reviewable unit without themselves being one. They are
      enumerated so that "not a reviewable unit" is a written classification rather than an
      absence.
    records:
      - mps/materialization/mps-mat-009/findings.yaml
      - mps/materialization/mps-mat-009/adjudication.yaml
      - mps/materialization/mps-mat-009/f2-demonstration-design.yaml
      - mps/materialization/mps-mat-009/f2-observation.yaml
      - mps/materialization/mps-mat-009/f2-restoration.yaml
      - mps/materialization/mps-mat-009/independent-reviews.yaml
  unclassified_is_an_error: >-
    Every file in mps/materialization/mps-mat-009/ must appear either as a record_file_backed
    reviewable unit or in supporting_records. A record added later that appears in neither is
    a control failure, not a silent pass -- otherwise a new file escapes by not matching a
    pattern, which is the same silence the control exists to end. Directory classification is
    defined only over record_file_backed units, because commit_scoped units have no record
    path to classify.

path_citation_note: >-
  No repository-relative path is cited for any external primary, so the declared-absent
  mechanism in spec/path_citation_allowlist.yaml has nothing to hold and no parallel
  convention is introduced. The retention fields below record a STATUS; they are not a second
  way of naming files. If a review primary is ever transported, it goes through the F1
  evidence rule -- canonicalize, type-validate, disclosure-scan, hash, bind -- and becomes a
  citable controlled path at that point and not before.

evidence_retention_vocabulary:
  retained: >-
    A primary artifact transported into the controlled evidence tree under the F1 rule --
    canonicalized, type-validated, disclosure-scanned, hashed, and bound to the record by the
    digest of the retained bytes.
  external_not_retained: >-
    The observation was made in a review workspace and its primary artifacts were not
    transported. No path is cited for these, because a path a clone cannot resolve is worse
    than no path: it implies the artifact is obtainable here.
  reproduction: >-
    An observation of the same proposition made later, by someone else, in another workspace.
    A reproduction is never labelled as the original independent-review artifact. Transport
    must preserve provenance, not merely content.

reviews:

  - review_id: REV-F2
    subject: F2 observability repairs, sequence item 2
    reviewed_object:
      kind: working_tree
      later_committed_as: edd6b0b
    reviewed_object_note: >-
      Unlike the later reviews, F2 was verified against an uncommitted working tree rather
      than a frozen commit; the review recorded HEAD 1b58895, the model tree hash and a
      333-test result. That is a weaker object identity than a commit sha and is recorded as
      it happened rather than tidied into one. It is NOT upgraded to commit-scoped evidence:
      the content reviewed was later committed as edd6b0b, which is a different statement
      from having reviewed that commit.
    verdict: INDEPENDENTLY VERIFIED
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    primary_artifact_retention: external_not_retained
    controlled_support:
      - mps/materialization/mps-mat-009/f2-observability.yaml
      - mps/materialization/evidence/MPS-MAT-009/f2-observability/historical-red.txt
      - mps/materialization/evidence/MPS-MAT-009/f2-observability/post-evidence-green.txt
    compatibility_note: >-
      f2-observability.yaml carries a pre-existing disposition block with the field
      independent_verification: VERIFIED. That field is left exactly as written. This entry
      is added alongside it and does not reinterpret it.

  - review_id: REV-F1
    subject: F1 repair, sequence item 3
    reviewed_object:
      kind: commit
      sha: 7db9bc13c4e159a4ced99be78926578bc966cbbc
    verdict: INDEPENDENTLY VERIFIED
