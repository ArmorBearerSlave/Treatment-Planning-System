schema_version: "0.1"
register_id: MPS-MAT-009-REVIEWS
title: Independent technical review results for the MPS-MAT-009 remediation sequence
status: open

purpose: >-
  One place, one convention. Before this register, F2 carried an independent-verification
  result and F1, F5 and MI-EXIT-01 did not, although all four had been reviewed. That
  asymmetry is misleading in a specific way: a reader is entitled to read absence as "not
  independently reviewed", so a record that omits the field says something false by omitting
  it. The remedy is a single normalized structure covering the whole reviewed population,
  including the ones that failed.

what_these_reviews_are_and_are_not:
  establish: >-
    Technical independence from the remediation actor. The reviewer did not implement the
    object being reviewed, so the verdict is not the implementer marking their own work.
  do_not_establish: >-
    The named human authority that MPS-MAT-009 requires. Every reviewer below is unnamed.
    INDEPENDENTLY VERIFIED must never be read as discharging MPS-MAT-009#0, which asks for a
    NAMED reviewer precisely because it is a human judgement that no gate and no unnamed
    process can stand in for.
  consequence: MPS-MAT-009#0 remains OPEN. See obligation_effect below.

closure_rule:
  purpose: >-
    NF-05 and NF-06. A finding was moved to CLOSED by writing a sentence in closed_by that
    described an independent review, and nothing resolved it. A convincing string was
    therefore sufficient to close a finding, whether or not the review it named existed,
    reviewed the right object, or returned a passing verdict.
  invariant: >-
    For every applicable CLOSED finding f there must exist exactly one review r in this
    register such that closure_review(f) = r, reviewed_object(r) = closure_target(f), and
    verdict(r) is a closing verdict.
  invariant_note: >-
    Amended at C6, and the amendment is to the target only. closure_target(f) is repair(f)
    unless f declares a repair_completion_object, in which case it is that object. The
    relation itself is unchanged and stays exact object identity: no ancestry, no
    descendant, no prefix, no most-recent review. Before C6 this sentence read
    reviewed_object(r) = repair(f), which stopped describing the observer the moment
    completion objects existed -- the stale-narrative defect NF-12 records, appearing in the
    rule NF-12 itself depends on.
  applies_to_finding_state: CLOSED
  requires_field: closure_review
  matched_against: >-
    the finding's closure target: its repair_completion_object when one is declared, and
    otherwise its repair field. Either way it names the one object the review must have
    reviewed.
  closing_verdicts:
    - INDEPENDENTLY VERIFIED
  closing_verdicts_note: >-
    Controlled data, read by the observer. It is deliberately NOT duplicated as a literal in
    test code: a control that carries its own copy of the rule stops testing the rule and
    starts testing its copy, and the two agree until they do not.
  prose_is_not_warrant: >-
    closure_note fields carry human-readable context and are explicitly non-authoritative.
    No observer parses them, and no closure rests on them.

repair_completion_rule:
  purpose: >-
    Some repairs are introduced at one commit and are only complete after later remediation
    commits. NF-06's mechanism landed at C1 and acquired population defects that were
    repaired at C3 and C4; the complete repaired proposition first existed at C5. The record
    could express where a repair was introduced, or it could express where it became
    complete, but not both -- so the closure rule, which matches object identity, had nothing
    correct to match against.
  what_it_is_not: >-
    This is NOT ancestry-based closure. A descendant of the repair object is not a substitute
    for it, "the latest review" is never adopted, no prefix matches, and no completion object
    is ever inferred. Ancestry appears below only as a validity precondition on a declaration
    a human wrote, never as a way of satisfying the closure match.
  fields:
    repair: >-
      Preserved unchanged. The historical object, or historical statement, identifying where
      the repair was introduced. C6 does not rewrite it for any finding.
    repair_introduced_object: >-
      The typed commit object corresponding to `repair`. Required alongside a completion
      declaration because `repair` is a commit sha on the RT-F findings and prose on the NF
      findings, and an ancestry precondition cannot be evaluated against prose. See NF-15.
    repair_completion_object: >-
      The exact commit object at which all changes necessary to complete this finding's
      repair are present. It does not erase or replace the repair object.
    repair_completion_reason: >-
      Why the original repair object alone was not the complete repaired proposition. Prose,
      and required, but never authority: the completion object is the machine-relevant field.
  closure_target: >-
    if repair_completion_object exists, the closure target is repair_completion_object;
    otherwise it is repair. The closure rule then requires reviewed_object(review) to equal
    that target EXACTLY, unchanged from before.
  validity_conditions:
    - the original repair field is present and unchanged
    - repair_completion_object is an exact commit object that resolves in this repository
    - repair_introduced_object is an exact commit object that resolves in this repository
    - repair_introduced_object is an ancestor of, or identical to, repair_completion_object
    - repair_completion_reason is present and non-empty
    - >-
      exactly one registered review both lists this finding in verified_repairs_of and has a
      reviewed_object equal to the completion object; zero or more than one is a failure
    - that review's verdict is in closing_verdicts
    - that review carries valid reviewer and evidence-retention semantics
    - no prose note substitutes for any failed condition
  no_closure_transition_in_c6: >-
    C6 establishes the model and the truthful completion metadata only. Even where the rule
    would now make a finding mechanically closable, its state is left OPEN: a changed closure
    model must itself be independently verified before it is used to move controlled finding
    state.

verdict_vocabulary:
  PENDING: reviewed object exists; independent review has not returned
  FAIL: independent review returned a failing verdict against the reviewed object
  INDEPENDENTLY VERIFIED: independent review returned a passing verdict
  note: >-
    PENDING is a legitimate state. The control over this register checks that the reviewed
    population is represented consistently, not that every repair carries a verdict before a
    review has happened.

population:
  definition: >-
    An independently reviewable UNIT of remediation work. Defined by content, not by
    filename: the one record that already carried a verdict, f2-observability.yaml, is
    precisely the file a *-repair.yaml glob would miss, so a pattern-based population would
    have excluded the only member that already had what the others lacked.

  membership_kinds:
    record_file_backed: >-
      The unit is described by a controlled record file, which the entry names. Only these
      participate in directory classification, because only these possess a record path.
    commit_scoped: >-
      The unit is a reviewed commit with no backing record file. RT-F-06: a population
      derived only from record files cannot discover such a unit, so it would be invisible
      to the very control meant to detect omission. Requiring a synthetic record file to
      make it visible would be manufacturing evidence to satisfy an observer.
  why_the_discriminator_lives_here: >-
    This is the authoritative classification. A second scheme -- per-file self-declaration,
    an id list, another pattern -- would be a competing source of truth that drifts, and the
    drift would be invisible for exactly as long as the two happened to agree. One
    classification structure, two populations derived from it, zero competing schemes.

  reviewable_units:
    - kind: record_file_backed
      record: mps/materialization/mps-mat-009/f2-observability.yaml
      review: REV-F2
    - kind: record_file_backed
      record: mps/materialization/mps-mat-009/f1-repair.yaml
      review: REV-F1
    - kind: record_file_backed
      record: mps/materialization/mps-mat-009/f5-repair.yaml
      review: REV-F5
    - kind: commit_scoped
      reviewed_object: ae475138c77f9bcc6fb6508d90b4dafcc10a5cba
      review: REV-MI-EXIT-01-R1
    - kind: commit_scoped
      reviewed_object: 51261fdd73002143f2cc81d702740f468e251e76
      review: REV-MI-EXIT-01-R2
    - kind: commit_scoped
      reviewed_object: d6faf77d517a2b369033c38a99155f666982ff1e
      review: REV-RECORD-TRANSPORT
    - kind: commit_scoped
      reviewed_object: 7ad9b81e3bd7f67f7b1e87ef2cc0eafb76c349a7
      review: REV-RT-F-CLOSURE
    - kind: commit_scoped
      reviewed_object: 58d18db1f952ff18f9853161eb979048483e4bc5
      review: REV-RT-F-SUBSTANCE
    - kind: commit_scoped
      reviewed_object: 3188a11443e33c8c4f68933cf73282108957f356
      review: REV-C5-CUMULATIVE

  membership_kind_is_not_object_identity_strength: >-
    Two independent dimensions, deliberately not conflated. REV-F2 is record_file_backed and
    its reviewed object is nonetheless only working-tree identified; REV-MI-EXIT-01-R1 is
    commit_scoped and SHA-bound. How a unit enters the population says nothing about how
    strongly the thing it reviewed was identified, and F2's weaker historical identity is
    preserved exactly as observed rather than silently upgraded to commit-scoped evidence.

  supporting_records:
    reason: >-
      These describe or support a reviewable unit without themselves being one. They are
      enumerated so that "not a reviewable unit" is a written classification rather than an
      absence.
    records:
      - mps/materialization/mps-mat-009/findings.yaml
      - mps/materialization/mps-mat-009/adjudication.yaml
      - mps/materialization/mps-mat-009/f2-demonstration-design.yaml
      - mps/materialization/mps-mat-009/f2-observation.yaml
      - mps/materialization/mps-mat-009/f2-restoration.yaml
      - mps/materialization/mps-mat-009/independent-reviews.yaml
  unclassified_is_an_error: >-
    Every file in mps/materialization/mps-mat-009/ must appear either as a record_file_backed
    reviewable unit or in supporting_records. A record added later that appears in neither is
    a control failure, not a silent pass -- otherwise a new file escapes by not matching a
    pattern, which is the same silence the control exists to end. Directory classification is
    defined only over record_file_backed units, because commit_scoped units have no record
    path to classify.

path_citation_note: >-
  No repository-relative path is cited for any external primary, so the declared-absent
  mechanism in spec/path_citation_allowlist.yaml has nothing to hold and no parallel
  convention is introduced. The retention fields below record a STATUS; they are not a second
  way of naming files. If a review primary is ever transported, it goes through the F1
  evidence rule -- canonicalize, type-validate, disclosure-scan, hash, bind -- and becomes a
  citable controlled path at that point and not before.

evidence_retention_vocabulary:
  retained: >-
    A primary artifact transported into the controlled evidence tree under the F1 rule --
    canonicalized, type-validated, disclosure-scanned, hashed, and bound to the record by the
    digest of the retained bytes.
  external_not_retained: >-
    The observation was made in a review workspace and its primary artifacts were not
    transported. No path is cited for these, because a path a clone cannot resolve is worse
    than no path: it implies the artifact is obtainable here.
  reproduction: >-
    An observation of the same proposition made later, by someone else, in another workspace.
    A reproduction is never labelled as the original independent-review artifact. Transport
    must preserve provenance, not merely content.

reviews:

  - review_id: REV-F2
    subject: F2 observability repairs, sequence item 2
    reviewed_object:
      kind: working_tree
      later_committed_as: edd6b0b
    reviewed_object_note: >-
      Unlike the later reviews, F2 was verified against an uncommitted working tree rather
      than a frozen commit; the review recorded HEAD 1b58895, the model tree hash and a
      333-test result. That is a weaker object identity than a commit sha and is recorded as
      it happened rather than tidied into one. It is NOT upgraded to commit-scoped evidence:
      the content reviewed was later committed as edd6b0b, which is a different statement
      from having reviewed that commit.
    verdict: INDEPENDENTLY VERIFIED
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    primary_artifact_retention: external_not_retained
    controlled_support:
      - mps/materialization/mps-mat-009/f2-observability.yaml
      - mps/materialization/evidence/MPS-MAT-009/f2-observability/historical-red.txt
      - mps/materialization/evidence/MPS-MAT-009/f2-observability/post-evidence-green.txt
    compatibility_note: >-
      f2-observability.yaml carries a pre-existing disposition block with the field
      independent_verification: VERIFIED. That field is left exactly as written. This entry
      is added alongside it and does not reinterpret it.

  - review_id: REV-F1
    subject: F1 repair, sequence item 3
    reviewed_object:
      kind: commit
      sha: 7db9bc13c4e159a4ced99be78926578bc966cbbc
    verdict: INDEPENDENTLY VERIFIED
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    primary_artifact_retention: external_not_retained
    controlled_support:
      - mps/materialization/mps-mat-009/f1-repair.yaml
      - mps/materialization/evidence/MPS-MAT-009/f1/historical-red.txt
      - mps/materialization/evidence/MPS-MAT-009/f1/repaired-green.txt
    review_raised_follow_ups: [F1-FU-01, F1-FU-02, F1-FU-03]

  - review_id: REV-F5
    subject: F5 model-binding repair, sequence item 4
    reviewed_object:
      kind: commit
      sha: 6803828b24f6377c9bc9cc9a4106dae49ac824fa
    verdict: INDEPENDENTLY VERIFIED
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    primary_artifact_retention: external_not_retained
    controlled_support:
      - mps/materialization/mps-mat-009/f5-repair.yaml
      - mps/materialization/evidence/MPS-MAT-009/f5/historical-counterexample.txt
    review_raised: >-
      The two MEASUREMENT INVALID sites that exited 1, which became MI-EXIT-01; and a
      gate-population-definition discrepancy carried to F6.

  - review_id: REV-MI-EXIT-01-R1
    subject: MI-EXIT-01 measurement-invalid exit semantics, round 1
    reviewed_object:
      kind: commit
      sha: ae475138c77f9bcc6fb6508d90b4dafcc10a5cba
    verdict: FAIL
    first_class_result: true
    not_superseded_by: REV-MI-EXIT-01-R2
    why_it_is_retained: >-
      A review population containing only passes cannot be distinguished from a review
      process that ratifies. This failure is the evidence that the mechanism discriminates.
      Collapsing the sequence into "MI-EXIT-01: VERIFIED" would delete the only proof that
      the reviews are capable of returning anything else.
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    findings_raised: [MI-R-01, MI-R-02, MI-R-03, MI-R-04, MI-R-05]
    findings_raised_note: >-
      Plus an inaccurate defect-class label, corrected to
      measurement-state-to-process-verdict corruption.
    primary_artifact_retention: external_not_retained
    controlled_support:
      - mps/materialization/mps-mat-009/findings.yaml

  - review_id: REV-MI-EXIT-01-R2
    subject: MI-EXIT-01 measurement-invalid exit semantics, round 2
    reviewed_object:
      kind: commit
      sha: 51261fdd73002143f2cc81d702740f468e251e76
    verdict: INDEPENDENTLY VERIFIED
    preceded_by: REV-MI-EXIT-01-R1
    sequence: >-
      ae47513 independent review FAIL, then remediation, then 51261fd independent review
      INDEPENDENTLY VERIFIED. Both objects and both verdicts are retained.
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    verbatim_review_statement: >-
      The verification apparatus became correct; no assurance number moved because of it.
    high_value_observations:
      - id: round_1_failure_re_derived_independently
        observation: >-
          The round-1 defect was not accepted on the remediation actor's report. The reviewer
          re-derived it: ae47513 executed from a cold state gave "Ran 404" and
          "FAILED (failures=1)".
        why_it_is_stronger_than_tests_passed: >-
          It establishes failure sensitivity of the review itself. A reviewer who only
          re-runs the repaired object learns whether it passes, not whether the defect was
          real.
        primary_artifact_retention: external_not_retained
        reproduction_by_remediation_actor: >-
          The same contrast was reproduced in the remediation workspace during round 2: a
          cold clone at ae47513 failed with an empty derived population, and a cold clone at
          51261fd passed 414/414. Recorded as a reproduction, not as the reviewer's artifact.
      - id: ast_guard_certified_by_mutation_against_the_real_defect
        observation: >-
          The guard was certified against the historical defect rather than against invented
          examples. The single-line form is caught; the wrapped metrics form is caught by the
          round-2 AST guard; and the round-1 substring guard was independently shown to miss
          the wrapped form.
        why_it_matters: >-
          It establishes historical discrimination. A guard proven only on examples written
          after the defect cannot show it would have caught the defect.
        primary_artifact_retention: external_not_retained
        controlled_support:
          - tests/test_measurement_invalid_exit.py
    primary_artifact_retention: external_not_retained
    controlled_support:
      - mps/materialization/mps-mat-009/findings.yaml
      - tests/test_measurement_invalid_exit.py

  - review_id: REV-RECORD-TRANSPORT
    subject: Review-record normalization and transport checkpoint
    reviewed_object:
      kind: commit
      sha: d6faf77d517a2b369033c38a99155f666982ff1e
    verdict: INDEPENDENTLY VERIFIED
    verdict_label_as_returned: RECORD-TRANSPORT -- INDEPENDENTLY VERIFIED
    reviewer:
      relationship: reviewer did not implement the reviewed object
      identity: unnamed / not a named human reviewer
      satisfies_mps_mat_009_named_reviewer_obligation: false
    primary_artifact_retention: external_not_retained
    findings_raised:
      - RT-F-01
      - RT-F-02
      - RT-F-03
      - RT-F-04
      - RT-F-05
      - RT-F-06
      - RT-F-07
      - RT-F-08
    controlled_support:
      - mps/materialization/mps-mat-009/findings.yaml

  - review_id: REV-RT-F-CLOSURE
