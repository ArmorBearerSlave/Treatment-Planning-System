schema_version: "0.2"
package_id: MPS-MAT-01
status: in_progress
authority_stage: A_mirror
patient_data_permitted: false
clinical_credentials_permitted: false
signing_keys_permitted: false

workspace:
  kind: independent_clone
  synchronized_directory_permitted: false
  whitespace_in_path_permitted: false
  branch: mps/stage-a-materialization
  note: >-
    Supersedes the earlier linked-worktree requirement. A linked worktree relocates the
    working tree only; its object database, refs, worktree metadata, locks, and index
    state stay under the controlling common directory. The clone carries its own common
    directory, which is the configuration chosen for persistent MPS authoring. See
    spec/relocation_verification.yaml.

pinned_toolchain:
  product: JetBrains MPS
  version: "2026.1"
  build: MPS-261.25134.779
  bundled_runtime: openjdk 25.0.3
  install_verified: "2026-08-19"
  note: >-
    Recorded as the pinned experiment build required by the ENG-PKG-01 acceptance
    condition. A different build is a separate qualification decision.

controlled_inputs:
  - mps/bootstrap/mps1-concept-features.yaml
  - mps/bootstrap/language-skeleton.json
  - mps/bootstrap/language-skeleton.schema.json
  - mps/import/hlr-baseline.json
  - mps/import/hlr-baseline.schema.json
  - spec/architecture.yaml
  - spec/decisions.yaml
  - spec/terminology.yaml

execution_policy:
  - MPS creates its own persistence. No agent or text tool authors or patches MPS
    persistence, module descriptors, or model XML. ADR-001 and ADR1-R-05 govern this.
  - Materialization proceeds in four checkpoints with a commit and review boundary at
    each. A single large construction is prohibited because it removes the boundary
    between whether the metamodel is correct and whether the migration is correct.
  - The first live-MPS commit shall not contain the 119 HLR roots.
  - Negative examples are created and shown to be rejected before the corresponding
    positive content is imported.
  - Materializing an entity in MPS shall not increase the source-explicit hazard count.
    Structural representation and hazard-specific engineering review are different
    claims. See spec/construction_policy.yaml, progress_metric.numerator_integrity.

native_check_results:
  - checkpoint: MPS-0
    tool: MPS Check Project
    errors: 0
    warnings: 3
    warning_class: >-
      Superfluous extended module nltps.foundation, not referenced from structure aspect
    warning_count_by_module:
      nltps.governance: 1
      nltps.clinicalintent: 1
      nltps.realization: 1
    disposition: EXPECTED_TRANSIENT_MPS0
    quick_fix_applied: false
    dependency_removed: false
    rationale: >-
      Each Extends relation to nltps.foundation is intentional and forward-looking. MPS
      reports it unused because concept declarations live in the structure aspect and
      MPS-0 deliberately contains none. Applying the quick fix would delete the
      dependency graph that MPS-MAT-004A just verified, so a zero-warning result here
      would be obtained by weakening the architecture.
    expected_closure:
      MPS-1: >-
        Requirement, Hazard, RiskControl and peers extend GovernedElement, which should
        clear the nltps.governance warning.
      MPS-2: >-
        PlanIntent, ReleaseProfile, Component and peers extend GovernedElement, which
        should clear the nltps.clinicalintent and nltps.realization warnings.
    reassessment_rule: >-
      If a warning persists after its expected closure checkpoint, treat it as a finding
      rather than carrying it forward as expected.
  - checkpoint: MPS-1
    tool: MPS rebuild plus node-scope and model-scope checking
    errors: 0
    warnings: 0
    scope: nltps.foundation and nltps.governance
    module_scope_check_project: UNAVAILABLE_THROUGH_CURRENT_MCP_SURFACE
    module_scope_attempt: >-
      The MPS Console is reachable through the MCP surface and accepts an inserted
      command, but MPS platform classes are not resolvable from the console model:
      a jetbrains.mps.smodel.MPSModuleRepository call parsed into the console input
      produced only UnknownInstanceMethodCall / unresolved-method errors. Making the
      platform API resolvable would require adding dependencies to the console temp
      module, which is outside the sanctioned agent surface. get_file_problems on
      nltps.governance.mpl returned no entries, which is an IntelliJ inspection result
      and not the MPS module-scope checker.
    superfluous_extended_module_warning: >-
      NOT RE-MEASURED. The condition that produced it no longer holds -- 17 governance
      concepts now take GovernedElement, a nltps.foundation concept, as superconcept --
      but that is an inference from the structure aspect, not the native module-scope
      diagnostic. It is recorded as unavailable evidence rather than as cleared.
    disposition: EVIDENCE_UNAVAILABLE_NOT_CLEARED


checkpoints:
  - id: MPS-0
    title: Project and languages
    scope: >-
      Create the NLTPSGovernance project and the four language modules. Establish only
      the dependency graph and persistence policy. No domain concepts.
    commit_boundary: true
    contains_hlr_roots: false
    acceptance_items: [MPS-MAT-001, MPS-MAT-002, MPS-MAT-004A]

  - id: MPS-1
    title: Foundation and governance metamodel
    scope: >-
      Materialize stable identifiers, version and lifecycle vocabulary, physical
      quantities and units, Requirement, Hazard, RiskControl, TraceLink, typed relations,
      and the minimum editors and constraints. Create invalid nodes deliberately and
      demonstrate that the constraints reject them.
    commit_boundary: true
    contains_hlr_roots: false
    acceptance_items: [MPS-MAT-003A, MPS-MAT-005A]

  - id: MPS-2
    title: Clinical intent and shared role holders
    scope: >-
      Add PlanIntentDefinition, roles and permissions, state transitions, release
      profiles and commissioned-use envelopes, together with the role model
      (ProfessionalRole, OperationalRole, RoleCapability, AuthorizedActor) and the
      shared holder language nltps.roles.common. Validate negative examples first.
      AuthorizedActor is what makes the GOV-C-007 deferral reactivatable.
    commit_boundary: true
    contains_hlr_roots: false
    acceptance_items: [MPS-MAT-003B, MPS-MAT-005B]

  - id: MPS-3
    title: Professional role projections
    scope: >-
      Add the four projection languages nltps.roles.radonc, nltps.roles.physics,
      nltps.roles.dosimetry and nltps.roles.therapy, each EXTENDS nltps.roles.common.
      A projection introduces no clinical semantics of its own: it may contain only
      what it or an EXTENDS ancestor owns, and references semantic-core concepts.
    commit_boundary: true
    contains_hlr_roots: false
    acceptance_items: [MPS-MAT-003C, MPS-MAT-005C]

  - id: MPS-4
    title: Realization and the 119-HLR import
    scope: >-
      Add components, interfaces, allocations and verification claims. Only after the
      language passes model checks, run the Stage A importer to create 119
      file-per-root Requirement roots, then export the neutral comparison
      representation and begin Stage B equivalence evidence.
    commit_boundary: true
    contains_hlr_roots: true
    acceptance_items:
      [MPS-MAT-003D, MPS-MAT-005D, MPS-MAT-004B, MPS-MAT-006, MPS-MAT-007,
       MPS-MAT-008, MPS-MAT-009]

acceptance_items:
  - id: MPS-MAT-001
    checkpoint: MPS-0
    item: >-
      Engineering workspace is an independent clone at a space-free path outside
      synchronized storage, with its Git common directory inside the clone.
    status: complete
    evidence:
      - spec/relocation_verification.yaml
      - "tools/repo/check_workspace_location.py --enforce"
      - "14/14 gates green from the relocated clone at 7fc8217"
  - id: MPS-MAT-002
    checkpoint: MPS-0
    item: NLTPSGovernance and all four controlled language modules are created through MPS.
    status: complete
    evidence:
      - mps/NLTPSGovernance/.mps/modules.xml
      - mps/NLTPSGovernance/languages/nltps.foundation/nltps.foundation.mpl
      - mps/NLTPSGovernance/languages/nltps.governance/nltps.governance.mpl
      - mps/NLTPSGovernance/languages/nltps.clinicalintent/nltps.clinicalintent.mpl
      - mps/NLTPSGovernance/languages/nltps.realization/nltps.realization.mpl
      - "all persistence created by MPS; no file hand-authored or patched"
  - id: MPS-MAT-003A
    checkpoint: MPS-1
    item: >-
      Foundation and governance concepts are disjoint, exhaustive, and single-owner
      against the blueprint inventory.
    status: complete
    evidence:
      - "40 concepts materialized through MPS MCP model-aware operations: nltps.foundation 13, nltps.governance 27"
      - "30 domain concepts + 10 representation concepts; the 10 exist only because MPS cannot express multi-valued properties or references"
      - "240 structure-aspect nodes = 40 ConceptDeclaration + 70 PropertyDeclaration + 47 LinkDeclaration + 10 EnumerationDeclaration + 73 EnumerationMemberDeclaration"
      - "tools/mps/check_concept_features.py - 40 concepts, superconcepts respect EXTENDS discipline"
      - "tools/mps/check_language_skeleton.py - disjoint root/non-root collections, single owner per concept"
      - "tools/mps/check_module_graph.py --max-concepts 40 - 40 concepts declared across 240 structure nodes"
      - "conformance read back twice against mps1-concept-features.yaml: MPS runtime descriptors and persisted own-declarations, zero deviations"
  - id: MPS-MAT-003B
    checkpoint: MPS-2
    item: >-
      Clinical-intent and roles.common concepts are disjoint, exhaustive, and
      single-owner against the blueprint inventory.
    status: complete
    evidence:
    - '26 concepts materialized through MPS MCP model-aware operations, transcribing
      mps2-concept-features.yaml exactly: nltps.clinicalintent 20, nltps.roles.common 6'
    - 128 structure-aspect nodes = 26 ConceptDeclaration + 47 PropertyDeclaration
      + 37 LinkDeclaration + 3 EnumerationDeclaration + 15 EnumerationMemberDeclaration
    - cumulative total 66 concepts across 368 structure nodes; check_module_graph.py
      --checkpoint MPS-2 derives the ceiling from the blueprint and observes 66 of 66
    - nltps.roles.common created as a language module with the blueprint dependency
      shape, EXTENDS nltps.foundation and DEFAULT on nltps.governance and
      nltps.clinicalintent; no external explicit dependency
    - read-back verification compared every persisted concept against the frozen
      specification feature by feature -- superconcept, rootability, abstractness,
      every property datatype, every link target, metaClass and cardinality -- and
      reports zero divergence
    read_back_finding: >-
      The creation calls returned ok:true for all 26 concepts and the model check
      reported no problems, yet 34 of the 37 declared links had silently taken the MPS
      default cardinality 0..1 instead of the specified 1 or 0..n. The tool ignores a
      cardinality key it does not recognise. All 34 were set explicitly and re-verified.
      This is the hazard CLAUDE.md records, observed at scale: a model-aware write can be
      accepted, report success, and still drop the part that mattered.
    external_dependency_events:
    - MPS auto-added a DEFAULT dependency on nltps.foundation to nltps.roles.common and,
      separately, to nltps.clinicalintent when their editor and typesystem models imported
      foundation.structure. Both were removed through model-aware tooling and the EXTENDS
      edges re-declared. Deleting a dependency removes the EXTENDS edge as well, so each
      removal was followed by an explicit Extends-scope re-add.
    - MPS auto-added a JDK dependency to nltps.clinicalintent when the checking rules
      called String methods. nltps.foundation performs the same calls with no JDK entry in
      its dependencies block, so the addition was unnecessary and was removed rather than
      escalated to a blueprint amendment.
    hazard_metric_unchanged: >-
      Materializing 26 concepts did not move the source-explicit hazard numerator. It
      remains 76 of 2,144, as construction_policy.progress_metric.numerator_integrity
      requires. Structural representation and hazard-specific engineering review are
      different claims.
  - id: MPS-MAT-003C
    checkpoint: MPS-3
    item: >-
      Professional role projection concepts are disjoint, exhaustive, and single-owner
      against the blueprint inventory, and every projection contains only concepts owned
      by itself or a transitive EXTENDS ancestor.
    status: complete
    evidence:
    - 12 concepts materialized through MPS MCP model-aware operations, transcribing
      mps3-concept-features.yaml exactly, three per professional language
    - 65 structure-aspect nodes across the four languages = 12 ConceptDeclaration
      + 8 PropertyDeclaration + 16 LinkDeclaration + 4 EnumerationDeclaration
      + 25 EnumerationMemberDeclaration
    - cumulative total 78 concepts across 433 structure nodes over nine modules;
      check_module_graph.py --checkpoint MPS-3 derives the ceiling from the blueprint
      and observes 78 of 78
    - each professional module carries exactly the frozen dependency shape, EXTENDS
      nltps.roles.common and DEFAULT nltps.clinicalintent, with no redundant foundation
      EXTENDS, no lang.core and no JDK; foundation visibility is transitive
    - 12 minimum editors created, one per concept; all four languages generate and
      compile with no error
    - read-back compared every persisted concept against the frozen specification feature
      by feature -- superconcept, rootability, abstractness, property datatypes, link
      targets, metaClass and cardinality -- plus all 25 enumeration members and their
      presentations, and reports zero divergence
    read_back_finding: >-
      Every one of the 16 declared links persisted with the MPS default cardinality 0..1
      instead of the specified 0..n or 1, with ok:true throughout. At MPS-2 the rate was
      34 of 37; here it was 16 of 16. The cardinality key on a link in CREATE_CONCEPTS is
      simply ignored. All 16 were set explicitly through sourceCardinality and re-verified.
    external_dependency_events: >-
      MPS auto-added a DEFAULT companion to the nltps.roles.common EXTENDS edge on all
      four modules. Each was removed through model-aware tooling and the EXTENDS edge
      re-declared, since deleting a dependency removes the EXTENDS collection entry too.
      No other undeclared dependency appeared, and no .mpl was edited.
    hazard_metric_unchanged: >-
      Materializing 12 concepts did not move the source-explicit hazard numerator. It
      remains 76 of 2,144.
    proof_sandbox_isolation: >-
      All MPS-3 proof instances live in the nltps.proof solution, whose descriptor is an
      .msd outside languages/. The module graph gate counts structure aspects under
      languages/ only, so the proof content contributes zero concepts and zero
      structure-aspect nodes to the 78 / 433 accounting.
    feature_specification: mps/bootstrap/mps3-concept-features.yaml
    frozen_inventory: >-
      12 concepts, three per professional language: a concrete rootable <Prof>Projection,
      a read-only <Prof>View, and a concrete <Prof>Task specialising RoleCommand. Four
      profession-owned enumerations carry the interaction vocabularies and cost nothing
      against the ceiling, which derives to 78.
    blueprint_dependency_amendment: >-
      Each professional language gained a DEFAULT dependency on nltps.clinicalintent so
      the projection can name the ProfessionalRole it is written for. DEFAULT is reference
      visibility only; the containment gate continues to reject containment of a
      clinicalintent concept. No concept was added or removed and the ceiling did not
      move.
  - id: MPS-MAT-003D
    checkpoint: MPS-4
    item: >-
      Realization concepts are disjoint, exhaustive, and single-owner against the
      blueprint inventory.
    status: pending
    evidence: []
  - id: MPS-MAT-004A
    checkpoint: MPS-0
    item: >-
      Module dependency direction matches the blueprint and is acyclic. MPS realizes the
      graph across two relation kinds and both count: extendedLanguages for concept-level
      extension, dependencies for module-level use.
    status: complete
    evidence:
      - "tools/mps/check_module_graph.py --max-concepts 0"
      - "4 modules, graph matches blueprint, acyclic, 0 concept nodes"
      - "extends: governance/clinicalintent/realization -> foundation"
      - "depends: clinicalintent -> governance; realization -> governance, clinicalintent"
  - id: MPS-MAT-004B
    checkpoint: MPS-4
    item: >-
      File-per-root persistence is demonstrated on normative instance models.
    status: pending
    evidence: []
    blocked_reason: >-
      MPS-0 contains no normative instance model, so the persistence mode cannot yet be
      exercised. Split from MPS-MAT-004 because dependency direction is demonstrable at
      MPS-0 and persistence is not; a single item would have had to be part-claimed.
  - id: MPS-MAT-005A
    checkpoint: MPS-1
    item: >-
      Foundation and governance constraints, typesystems, editors, and negative model
      tests pass, including demonstrated rejection of deliberately invalid nodes.
    status: complete
    completion_qualifier: COMPLETE WITH CONTROLLED, ATTRIBUTABLE PROOF DEFERRALS
    completion_basis: >-
      Every negative case that is instantiable in the MPS-1 metamodel is demonstrated and
      attributable. What is not demonstrated is recorded under scoped_exclusions with an
      explicit affected_concept and a reactivation condition, and the non-instantiability
      deferrals are mechanically enforced by the deferral_lapse_rule rather than carried
      as prose. Deferred obligations are not relabelled as PASS.
    controlled_constraint_inventory:
      declared: 11
      identifiers: >-
        FND-C-001, FND-C-002, FND-C-003, FND-C-004, GOV-C-001, GOV-C-002, GOV-C-003,
        GOV-C-004, GOV-C-005, GOV-C-006, GOV-C-007
      proven: 8
      semantic_deferral: 0
      proof_deferral_non_instantiability: 0
      reactivated_at_mps2: 1
      lapsed_at_mps2: 2
      transition_note: >-
        As frozen at MPS-1 this read 8 proven, 1 semantic deferral, 2 non-instantiability
        proof deferrals. The MPS-2 feature specification gave PhysicalQuantity and
        ExternalReference containment paths and declared AuthorizedActor, so FND-C-003 and
        FND-C-004 lapsed and GOV-C-007 was reactivated. All three are now active obligations
        carried to MPS-MAT-005B. MPS-1's acceptance is unchanged: it was granted with those
        deferrals in force, and that remains a true statement about what was demonstrated
        then.
      note: >-
        Representation-proof obligations under property_facet_policy are tracked
        separately and are not counted as controlled constraint identifiers. The
        inventory is not expanded by representation rule labels.
    evidence:
      - "40 minimum editors created through mps_mcp_scaffold_editor; both languages rebuild with no generation or compilation error"
      - "proof harness: nltps.proof solution with an .msd descriptor outside languages/, contributing zero structure-aspect nodes"
      - "FND-C-001 proven: duplicate StableId value flagged on both holders; unique value accepted"
      - "FND-C-002 proven structurally: Requirement without the mandatory version child rejected with 'No child in the obligatory role version'"
      - "GOV-C-001 proven: 'The system should log.' rejected; the sibling 'shall' requirement not flagged"
      - "GOV-C-002 proven: TraceLink source and target validated against the referenced TraceRelation allowed lists"
      - "GOV-C-003 proven positive: RiskControl MITIGATES Hazard accepted with no false rejection"
      - "GOV-C-004 proven: Hazard MITIGATES a non-permitted target rejected on both source and target"
      - "directional near-miss proven: the exact reversal of the permitted case rejected, excluding accept-all, reject-all, and direction-insensitive implementations"
      - "GOV-C-005 proven: DerivedRequirement identifier XXX-999 rejected; GOV-001-1 derived from parent GOV-001 accepted"
      - "GOV-C-006 proven: rationale shorter than 20 characters rejected; compliant rationale accepted"
      - "date representation proven: 2026-8-1 rejected as lexical, 2026-02-31 rejected as calendar, 2024-02-29 accepted; lexical and calendar diagnostics are distinct"
      - "calendar validity implemented once as the Version.isValidCalendarDate behavior method using strict java.time.LocalDate parsing, not hand-rolled month arithmetic"
    scoped_exclusions:
      - constraint: GOV-C-007
        deferral_class: semantic_model_absence
        status: reactivated at MPS-2, active proof obligation
        reactivation_concept: AuthorizedActor
        reactivated_at: MPS-2
        realized_by: CLI-C-005
        carried_to: MPS-MAT-005B
        transition_rationale: >-
          The deferral was justified by the absence of actor semantics. AuthorizedActor and
          ActionDefinition.autonomyLevel are declared in mps2-concept-features.yaml, so that
          justification no longer holds. semantic_model_absence does not lapse on
          reachability, so this reclassification is deliberate and human-made; the gate now
          refuses to stay quiet once the named concept is declared, but it cannot make the
          transition itself.
        realized_in_clinicalintent_because: >-
          The predicate reads AuthorizedActor and ActionDefinition.autonomyLevel, both
          clinicalintent concepts. governance declares no dependency on clinicalintent, so a
          governance rule cannot read them; placing it there would invert the acyclic
          direction. GOV-C-007 keeps its identifier and traceability while CLI-C-005
          discharges it.
        active_means: >-
          Required, not demonstrated. The behavioural proof belongs to MPS-2 materialization
          and includes four separate non-human rejections and one authorized-human
          acceptance.
        prior_status: deferred, not implemented
        reason: >-
          The actor semantics required to distinguish human authority from a model node,
          a generator, or an automated actor do not yet exist in the current metamodel.
        dependency: >-
          AuthorizedActor, declared in nltps.clinicalintent alongside ProfessionalRole,
          OperationalRole and RoleCapability. RoleCapability binds ActionDefinition and
          WorkflowState, which are clinicalintent concepts, so placing the role model in
          governance would invert the acyclic dependency direction.
        reactivation_checkpoint: >-
          MPS-2, the checkpoint that introduces AuthorizedActor and role capability
          semantics. The deferral becomes reactivatable there and may not be closed
          without the demonstrated rejection its acceptance wording requires.
        reactivation_condition: >-
          Reactivates when AuthorizedActor and role capability semantics are introduced.
          This is a semantic-model dependency, not a containment-reachability one, so the
          non-instantiability lapse rule deliberately does not apply to it.
        traceability_retained: true

      - constraint: GOV-C-004
        deferral_class: literal_example_substitution
        status: mechanism implemented and proven, literal negative example substituted
        specified_negative_example: >-
          A TraceLink from Hazard to a verification entity using MITIGATES.
        not_literally_instantiable_because: >-
          the verification concept named by the frozen example is allocated to a later
          checkpoint and does not exist in the MPS-1 metamodel.
        substituted_negative_example: Hazard MITIGATES Requirement
        result: source and target validation both reject the invalid relationship
        must_be_reexercised_when: >-
          the verification concept becomes available; the literal frozen example is then
          run against the same unchanged mechanism.
        traceability_retained: true

      - constraint: FND-C-003
        deferral_class: non_instantiability
        lapsed_at: MPS-2
        carried_to: MPS-MAT-005B
        lapse_trigger: >-
          ConstraintDefinition.limit gives PhysicalQuantity a containment path: PlanIntentDefinition -> constraints -> ConstraintDefinition -> limit.
        lapse_note: >-
          Recorded rather than deleted. The MPS-1 acceptance was granted with this deferral
          in force and that history stands; the obligation has moved, not vanished.
        affected_concept: PhysicalQuantity
        status: >-
          implemented, type-checks, generates, not behaviorally proven in MPS-1 because
          the applicable concept is non-rootable and unreachable from any legal MPS-1
          containment path.
        implemented_evidence: >-
          FND_C_003_unit_dimension is present in nltps.foundation.typesystem, type-checks
          clean, and generates and compiles in a successful language rebuild.
        blocked_because: >-
          Unit and UnitCatalog are reachable and are not the cause of this deferral. The
          blocked concept is PhysicalQuantity alone.
        reactivation_condition: >-
          Reactivates at the first checkpoint that declares a concept aggregating the
          affected concept. That checkpoint must exercise the deferred negative examples
          before its own acceptance items may close.
        reachability_guidance: >-
          Guidance only, not a binding checkpoint assignment. PhysicalQuantity is expected
          to become reachable through a later clinicalintent concept such as
          ConstraintDefinition, ComputableRule or RobustnessScenarioDefinition, or through
          AcceptanceCriterion in realization.
        traceability_retained: true

      - constraint: FND-C-004
        deferral_class: non_instantiability
        lapsed_at: MPS-2
        carried_to: MPS-MAT-005B
        lapse_trigger: >-
          ConstraintDefinition.limit gives PhysicalQuantity a containment path: PlanIntentDefinition -> constraints -> ConstraintDefinition -> limit.
        lapse_note: >-
          Recorded rather than deleted. The MPS-1 acceptance was granted with this deferral
          in force and that history stands; the obligation has moved, not vanished.
        affected_concept: PhysicalQuantity
        status: >-
          implemented, type-checks, generates, not behaviorally proven in MPS-1 because
          the applicable concept is non-rootable and unreachable from any legal MPS-1
          containment path.
        implemented_evidence: >-
          FND_C_004_dose_basis is present in nltps.foundation.typesystem, type-checks
          clean, and generates and compiles in a successful language rebuild.
        blocked_because: >-
          Unit and UnitCatalog are reachable and are not the cause of this deferral. The
          blocked concept is PhysicalQuantity alone.
        reactivation_condition: >-
          Reactivates at the first checkpoint that declares a concept aggregating the
