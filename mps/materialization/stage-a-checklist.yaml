      consequence: >-
        CLI-C-006 keeps its three explicit reference checks. They are no longer a
        substitute for absent enforcement but defence in depth and an attributable,
        constraint-named diagnostic, which a bare obligatory-role message is not. The
        durable control moved to read-back discipline: a session that inspects only
        node-level problems will not see an obligatory-role violation for either a child
        or a reference.
      acceptance_unchanged: >-
        This corrects a finding, not the acceptance. CLI-C-006 was demonstrated at MPS-2
        with five separate diagnostics and remains proven; the five-case GOV-C-007 matrix
        and every other item of MPS-2 evidence are untouched.
