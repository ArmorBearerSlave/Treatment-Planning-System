  - id: MPS-MAT-008
    checkpoint: MPS-4
    item: Headless build and model tests pass without the experimental agent toolkit.
    status: pending
    blocked_reason: >-
      Not for want of a mechanism any more. The native headless mechanism is identified,
      implemented and runs: MPS 2026.1 ships Apache Ant, a JDK and the MPS Ant task library,
      and build/nltps-headless-build.xml drives <mps.make>, which forks
      jetbrains.mps.tool.builder.CoreWorker into its own JVM with no IDE involvement. It is
      blocked because the project does not build from a clean state -- by any means, headless
      or interactive -- and because a build that does succeed would not be evaluating the
      checking rules.
    discovered_defect:
      id: POST-MPS4-01
      summary: The project has never been buildable from a clean generated state.
      detail: >-
        nltps.foundation.behavior contains exactly one root, a baseLanguage ClassConcept
        holding the CalendarDates helper, and no ConceptBehavior at all. MPS treats a model
        named *.behavior as the language's behaviour aspect, so the language descriptor
        generates Language.java referencing nltps.foundation.behavior.BehaviorAspectDescriptor;
        the behaviour aspect generator emits that class only from ConceptBehavior roots, of
        which there are none. The reference therefore dangles and Java compilation fails with
        "cannot find symbol: class BehaviorAspectDescriptor".
      pre_existing: >-
        Confirmed, and not introduced by this work. After deleting every source_gen,
        classes_gen and source_gen.caches directory, a whole-project rebuild issued through
        the agent toolkit into the running IDE fails with the identical error. Every green
        build in MPS-0 through MPS-4 was incremental on top of generated output produced
        before the behaviour aspect reached its current shape. The staleness was invisible
        precisely because no build had ever started from nothing.
      why_it_matters: >-
        This is the class of finding a headless build exists to produce. An interactive IDE
        is a long-lived process with a warm output tree, and a project can remain green in it
        for four checkpoints while not being reproducible at all.
      disposition: CORRECTED
      correction:
        decision: >-
          CalendarDates is a static language utility, not concept behaviour. Its placement in
          the behaviour aspect was semantically wrong and was what caused the clean-build
          failure. It was moved unchanged into nltps.foundation.typesystem, where all three
          controlled callers already live, leaving the behaviour aspect empty. No
          ConceptBehavior was invented to make the descriptor generator fire; that would have
          satisfied the compiler while leaving the language design dishonest.
        mechanism: >-
          mps_mcp_alter_nodes MOVE_NODE_TO_PARENT with a modelReference, which moves the root
          between models rather than recreating it. Node identity 1365532761375215457 is
          preserved across the move, which is what allowed the incoming references to be
          repaired rather than rebuilt.
        feasibility_checked_first: >-
          nltps.foundation.typesystem declares jetbrains.mps.baseLanguage among its used
          languages and already held six NonTypesystemRule roots whose bodies are baseLanguage,
          so a ClassConcept root is metamodel-legal there. Whether the aspect generation plan
          would emit it was left to the cold build, which it did.
        empty_aspect_is_sufficient: >-
          The behaviour model was left in place and empty rather than deleted, and the
          generated Language.java now carries zero BehaviorAspectDescriptor references. The
          model's existence is not what triggers the reference; its having content is. Three of
          the eight empty behaviour models -- governance, clinicalintent and realization --
          were created at MPS-0 before their languages had any concepts, so every generation
          of their Language.java has occurred with an empty behaviour model already present.
          foundation is the controlled differential: identical until CalendarDates arrived.
        defect_population: >-
          One. The cold build reaches and completes all nine languages, and no
          BehaviorAspectDescriptor reference exists anywhere in generated output. The eight
          empty behaviour aspects are unaffected, which the nine-language completion is what
          establishes rather than the prediction that preceded it.
        accepted_residue:
          decision: >-
            Recorded, not mutated. None of it has roots, none produces a
            BehaviorAspectDescriptor, and the nine-language clean build establishes that none
            of it is functionally relevant. Editing MPS persistence for cosmetic parity would
            put avoidable model-aware writes on the critical path of an acceptance item, for
            no acceptance benefit. If a trivial MPS-native cleanup exists and its behaviour is
            understood, it can be considered later and separately.
          in_the_emptied_behaviour_model: >-
            nltps.foundation.behavior retains three used languages, the general-purpose devkit,
            an empty registry, and four imports -- nltps.foundation.structure plus java.lang,
            java.time and java.time.format -- that followed CalendarDates in and no longer have
            anything to serve.
          in_the_receiving_model: >-
            nltps.foundation.typesystem now imports nltps.foundation.behavior, a model that is
            empty, which the move left behind when the reference stopped crossing models. It
            also gained java.time and java.time.format marked implicit="true" rather than as
            declared imports. Both are weaker declarations than the explicit ones they replace,
            and both are functionally sufficient: the leap-date positive control passing is
            what proves java.time.LocalDate resolves, not the import table.
      evidence:
      - 'Call sites re-verified through MPS''s usage index, not grep: three StaticMethodCall
        nodes resolving to CalendarDates.isValidCalendarDate(string):boolean -- two in
        FND_REPR_version_dates, one in FND_REPR_externalreference_date, none in
        FND_REPR_magnitude_numeric. Same three node identities as before the move.'
      - 'Behavioural re-proof, run before trusting any build, because this utility once
        returned false for every input and produced a false calendar PASS caught only by
        read-back: 2026-8-1 rejected as lexical, 2026-02-31 rejected as calendar with a
        distinct diagnostic, 2024-02-29 accepted with the whole proof model clean. A no-op
        implementation would have passed the first two; the old false-success mode would have
        failed the third.'
      - 'Clean build: every source_gen, source_gen.caches and classes_gen directory deleted,
        then the headless build completed all nine languages -- foundation, governance,
        clinicalintent, the four roles languages, realization -- with BUILD SUCCESSFUL in 55s.'
      - 'Second independent build on the output of the first: BUILD SUCCESSFUL in 32s. Before
        the correction this was the run that failed, because the first build had consumed a
        source_gen tree left behind by the IDE and then overwritten it.'
      - 'Controlled drift: two model files, the behaviour aspect losing its root and the
        typesystem aspect gaining it. 258 tests, 96/96 concepts, 119/119 corpus roots,
        Stage-B 119/119, hazard profile 73/46/18/94, metric 76/2,144 all unchanged.'
      silent_failure_found:
        what: >-
          MOVE_NODE_TO_PARENT across models does not repoint incoming references, and nothing
          reports the result. Immediately after the move, all three call sites still pointed
          into the vacated model, printed as "null.null", and
          check_root_node_problems on the containing model returned "no problems found".
        remedy: >-
          mps_mcp_alter_nodes FIX_REFERENCES per affected root repaired all six references,
          four in FND_REPR_version_dates and two in FND_REPR_externalreference_date. Verified
          by re-running FIND_USAGES, not by trusting the fix count.
        rule: >-
          After moving a node between models, re-run FIND_USAGES on it. The model checker will
          not tell you, and a fix count is a claim about what the tool did, not about what the
          model now says.
    established:
    - 'Mechanism: bundled Apache Ant at MPS_HOME/lib/ant, driven by the bundled JDK at
      MPS_HOME/jbr, loading jetbrains/mps/build/ant/antlib.xml from lib/ant/lib/ant-mps.jar
      and running <mps.make>. No system Ant and no ambient JAVA_HOME participate.'
    - 'Invocation: python tools/mps/headless_build.py. It validates MPS_HOME/build.txt
      against the pinned MPS-261.25134.779 and refuses a mismatch, checks the bundled JDK,
      Ant, launcher and task jar, the build descriptor and the project, then runs the build
      in a subprocess and captures the log.'
    - 'Two classpath facts that are not optional: ant-mps.jar needs org.jdom from
      lib/util-8.jar and both must be on the taskdef classpath rather than Ant''s own, or
      MakeTask fails to instantiate; and the worker needs its own idea.system, idea.config
      and idea.log paths, or it tries to write into the installation directory under Program
      Files and dies before doing any work.'
    - 'autoPluginDiscovery="true" is unusable in this build: CoreWorker raises
      IllegalArgumentException "The flag ''myAutoLoadPluginsMode'' is set, nothing to return"
      before loading anything. The attribute is left off.'
    - 'Generated-output policy, decided before the first build and then verified against what
      the build actually emitted rather than assumed: source_gen, source_gen.caches,
      classes_gen, test_gen and test_gen.caches are derived and ignored, and build/work joins
      them. Across four headless builds the controlled-source diff stayed empty.'
    semantic_teeth_result:
      verdict: THE HEADLESS BUILD DOES NOT EVALUATE MPS CHECKING RULES
      method: >-
        A VerificationClaim with verdict passed and no bound evidence was added to
        nltps.proof.cases through model-aware tooling. The model checker rejected it, naming
        REA-C-002 and REA-C-003. The headless build was then run from a fresh process against
        that same persisted model and reported BUILD SUCCESSFUL with exit code 0. The fixture
        was removed and the model re-verified clean.
      reading: >-
        Generation and compilation are not checking. A reproducible headless generator is not
        a reproducible headless validator, and this one is the former. Recorded rather than
        concealed, because a build whose success cannot be distinguished from "nothing was
        checked" must not be presented as validation coverage.
      consequence_for_this_item: >-
        The acceptance wording asks for a headless build AND model tests. The project declares
        no jetbrains.mps.lang.test model, so the second clause currently has nothing to run.
        Closing on it would be a pass over an empty population -- the failure mode this
        programme has now caught four times -- so it is not claimed.
    non_idempotence_finding: >-
      The first headless build succeeded and every later one failed. The first ran against a
      source_gen tree left behind by the IDE and consumed artifacts it does not itself
      produce; once it had rewritten that tree, the missing BehaviorAspectDescriptor was
      exposed. A single green run is therefore not evidence for this item, which is why the
      contract requires a second independent build.
    native_test_mechanism_found:
      task: launchtests
      registered_in: jetbrains/mps/build/ant/antlib.xml inside lib/ant/lib/ant-mps.jar
      since: MPS 2022.3
      surface: >-
        LaunchTestTask accepts a nested <project>, <testmodules>, <library> and <macro>, and
        carries haltOnFailure, failOnError, reports, fork and openPackages. Unlike mps.make it
        does take a <project> element. jetbrains.mps.lang.test ships in
        plugins/mps-testing/languages, its generator in plugins/mps-testing/languages/gentest,
        and lib/mpsant/mps-tool.jar carries ConsoleTestReporter, ITestReporter and
        XmlTestReporter.
      reading: >-
        The full antlib was enumerated rather than searched for one task: migrate, generate,
        gentest, copyModels, runMPS, mps.make, mps.run-worker and launchtests. A native
        headless model-test mechanism therefore exists, so the model-tests clause of this
        item should be satisfied rather than amended. Trying to make mps.make evaluate
        checking rules would be the weaker answer to a question MPS already answers.
      test_concept_surface: >-
        jetbrains.mps.lang.test resolves in this project. NodesTestCase is rootable and
        declares nodesToCheck of type TestNode with cardinality 0..n, alongside testMethods,
        beforeTests and afterTests. A node placed under nodesToCheck is checked by the test
        harness, so an error reported on it by a checking rule becomes a test failure. That
        is the mechanism the teeth case needs, and it is why launchtests can assert what
        mps.make cannot.
      teeth_case_design: >-
        A NodesTestCase whose nodesToCheck holds a VerificationClaim with verdict passed and
        no bound evidence. REA-C-002 and REA-C-003 both reject that node, and the E2
        experiment already established that mps.make completes over it with exit code 0. The
        same fixture therefore demonstrates both halves of the pipeline at once: mps.make
        BUILD SUCCESSFUL, launchtests TEST FAILURE.
      evidence_required_beyond_verdict: >-
        A green task that discovered nothing is not a pass. Record the test module and model
        selected, the number of tests discovered, the names of the tests executed, passed
        and failed counts, the report location and the process exit code.
      frozen_contract:
        testmodules_resolves: required
        authored_test_count: frozen as N before the first run
        discovered_test_count: must equal N
        executed_test_count: must equal N
        haltOnFailure: >-
          true, required. Without it a real semantic failure degrades into a successful Ant
          invocation with the failure buried in a report nobody reads, which is the same
          shape as a build that succeeds over an invalid model.
        failure_status_observable: required
        reports_retained: required
      teeth_cycle:
        - baseline, valid population - N of N discovered, N of N pass
        - introduce the deliberate REA-C-002 violation - verdict passed with no evidence
        - rerun - the same N discovered, the intended semantic test fails by name, the task fails
        - repair the fixture
        - rerun - the same N discovered, N of N pass
        - repeat from a fresh process - N of N pass again
      first_contact_result:
        verdict: THE CONTRACT CAUGHT A FALSE GREEN ON ITS FIRST RUN
        what_happened: >-
          The sentinel test was authored deliberately red -- a VerificationClaim with verdict
          passed and no evidence, which REA-C-002 and REA-C-003 both reject -- and launchtests
          returned BUILD SUCCESSFUL with exit code 0. The JUnit reports it wrote say
          tests="0" failures="0", contain no testcase element, and never name the authored
          test.
        why_it_matters: >-
          Without the frozen authored = discovered = executed = N requirement this would have
          been recorded as launchtests PASS, and MPS-MAT-008 would have closed on a task that
          ran nothing. The contract was written before the fixture precisely so that it could
          not be relaxed once a green result was in hand, and it earned that on first contact.
        not_a_missing_test: >-
          The test generated and compiled. test_gen holds
          REA_C_002_evidence_required_for_assessed_verdict_Test.java and classes_gen holds
          the corresponding .class, which imports org.junit.jupiter. The gap is between the
          compiled test classes and what the runner discovers, not in the fixture.
        terminology: >-
          This is a discovery-control failure, not a semantic RED. authored = 1,
          discovered = 0, executed = 0: the sentinel node is red, but its semantics were
          never exercised, so this run cannot serve as the RED member of the later red-green
          proof. That cycle starts only once discovery is exactly 1.
        diagnosis_so_far:
          testmodules_resolution: >-
            PROVEN. The fileset form resolves and the runner logs "Registered module
            nltps.modeltests for test auto-discovery". What TestModules consumes is a module
            descriptor named by an Ant resource collection.
          project_and_module_visibility: >-
            PROVEN. The runner loads 286 modules into its classloading graph and registers
            the test module. Generation and compilation were already established:
            test_gen holds the _Test.java and classes_gen the matching .class.
          first_cause_found_and_fixed: >-
            Discovery was throwing. NoClassDefFoundError "Could not initialize class
            com.sun.jna.Native" was raised inside ModelSourceRootWalker while collecting a
            module's models, and launchtests swallowed it into a zero-test run reported as
            BUILD SUCCESSFUL. MpsLoadTask exposes jnaLibraryPath; setting it to
            MPS_HOME/lib/jna, where jnidispatch.dll lives, clears the exception entirely.
            This is the third instance of one pattern: the headless worker must be told
            where its own dependencies live, after org.jdom on the taskdef classpath and
            idea.system.path for the worker's writable directories.
          read_only_probes:
            executable_test_methods: >-
              ZERO. The generated sentinel class carries a @RegisterExtension, a constructor
              and a TestBody.initTestNodes, and no @Test method at all. The model holds only
              NodesTestCase and TestNode; no test-method concept was ever authored. MPS's
              discovery participant returns no descriptor when a NodesTestCase has an empty
              test-method set, so discovery = 0 is correct behaviour here, not a runner
              defect. A compiled _Test.class proves generation and compilation and says
              nothing about whether the root contributes a test.
            dependency_derivation: >-
              CORRECT ALREADY. source_gen.caches/deps.cp for nltps.modeltests contains
              org.junit.junit5, jetbrains.mps.lang.test.runtime and
              jetbrains.mps.baseLanguage.unitTest. MPS derives these through the test-language
              dependency machinery, and JetBrains' own NodesTestCase solutions carry no
              dependencies block at all. Adding org.junit.junit5 to the .msd by hand would
              have been a noncanonical change with no diagnostic value: it would have produced
              a green or not without identifying anything.
            launcher_plugin_wiring: >-
              MISSING. The launchtests invocation declares zero plugin elements. JetBrains'
              own generated 2026.1 configuration loads jetbrains.mps.core, jetbrains.mps.junit5
              and jetbrains.mps.testing before project and testmodules. A missing plugin leaves
              the module and the generated class perfectly intact while the language-test
              discovery extension is unavailable to the headless runtime, which fits
              generated - compiled - registered - zero discovered better than any dependency
              explanation.
          two_independent_gaps: >-
            Both are confirmed and neither alone yields discovery = 1. The fixture has no
            executable test operation, and the launcher lacks the canonical plugin wiring.
            Fixing either in isolation would leave discovery at zero and invite the wrong
            conclusion about the other.
          fixture_completion_attempt: >-
            A NodesTestMethod with name, VoidType return and an empty body was added and
            immediately reverted: generation fails with "NodesTestMethod is not a subconcept
            of jetbrains.mps.baseLanguage.structure.ClassifierMember", raised from
            BehaviorChecker during textgen. Structural placement under testMethods is accepted
            by the metamodel, so the authoring needs more than name, return type and body.
            That is the next thing to establish, and it is fixture completion, not the
            semantic repair.
          retired_hypotheses: >-
            mps.test.project.path needs no explicit -D: addConfiguredProject records the path
            and the launcher converts it to SystemProperties.PROJECT_PATH internally, which
            the 286-module graph already demonstrates. REQUIRES_MPS_PLATFORM is set by the
            discovery participant from ITestable.isMpsStartRequired, which NodesTestCase
            answers true. Both removed from the hypothesis tree.
          discovery_repaired:
            fixture: >-
              NodesTestMethod is abstract; testMethods must hold its concrete subtype
              SimpleNodeTest. With one SimpleNodeTest authored -- final name
              testAssessedClaimWithoutEvidenceIsRejected, node 1365532761392382836, VoidType
              return, trivial body -- generation produces exactly one @Test and the class
              compiles. N = 1 is now an executable-test count, not a count of test roots.
            launcher: >-
              The three plugins JetBrains' own generated 2026.1 test builds declare --
              jetbrains.mps.core, jetbrains.mps.junit5, jetbrains.mps.testing -- are added to
              launchtests only, before project and testmodules. Generation was already proven
              and was not touched. LaunchTestTask does put the mps-testing launcher jar on the
              forked classpath by itself, which is not the same as loading these plugins into
              the MPS runtime.
            result: >-
              MPS test-root recognition works. The runner reports "error building test suite -
              java.lang.ClassNotFoundException:
              nltps.modeltests.headless.REA_C_002_evidence_required_for_assessed_verdict_Test",
              naming the exact generated class, where before the plugin wiring it reported
              tests="0" and named nothing.
            state_stated_precisely: >-
              An earlier wording of this entry said "discovery now selects the test" and
              "selection is repaired". That overstates it and is corrected here.
              TestDiscoveryContributor calls moduleClassLoader.loadClass(testClassName) and
              only then adds the ClassSelector, so the ClassNotFoundException is raised
              before tests.add. The exact state is: authored executable test 1, MPS test root
              recognized 1, JUnit selector constructed 0, executed 0. Structural and model
              discovery is fixed; class materialization is the sole remaining boundary.
            java_facet_ruled_out: >-
              Do not change ext="no". JetBrains' own testSubtypingTest, the same class of
              NodesTestCase solution, carries exactly
              facet type="java" compile="mps" classes="mps" ext="no" with generated classes
              at ${module}/classes_gen, plus a bare tests facet. ext="no" is canonical, not
              an anomaly, and the earlier pairing of it with addLibraryJar as two equally
              plausible candidates was wrong.
            packaging_is_a_hypothesis_not_a_cause: >-
              An earlier wording of this entry called the artifact shape the actual cause.
              That is the same overstatement this entry was written to correct, made once
              more one paragraph later, and it is withdrawn. What is observed is a failed
              class load. Everything about jars is inference from how JetBrains builds its
              own distribution tests.
              MPS 2026.1 argues against the inference: for an unpackaged source module the
              module classloader derives its classpath from the JavaModuleFacet, and
              JavaModuleFacetImpl.getClassPath adds the configured classes_gen directory when
              it exists. This module's facet already declares
              classes generated="true" path="${module}/classes_gen". So a raw .msd is not
              intrinsically incapable of supplying compiled classes, and that JetBrains
              packages test solutions for CI shows a canonical deployment shape, not a
              limitation of launchtests.
            proven_state: >-
              authored executable test 1, MPS test root recognized 1, module classloader
              obtained 1, moduleClassLoader.loadClass(FQN) FAILED, own-class and resource
              visibility UNKNOWN, JUnit selector constructed 0, executed 0.
              An earlier wording said "own test class load FAILED". That is withdrawn:
              TestDiscoveryContributor calls the ordinary loadClass path, which searches self
              then dependency classloaders then parent, and neither getOwnResource nor
              loadOwnClass has ever been exercised. Recording the self-classpath as failed
              would have presupposed the answer the probe exists to find.
              A missing JDK dependency remains a weak explanation, since MPS routes java.*
              through the system classloader directly.
            static_half_already_answered: >-
              Two probe rows do not need the runtime. The java facet declares
              classes generated="true" path="${module}/classes_gen", and the compiled class
              exists on disk at
              tests/nltps.modeltests/classes_gen/nltps/modeltests/headless/REA_C_002_evidence_required_for_assessed_verdict_Test.class
              alongside its $TestBody class. What this does not settle is the case that
              matters most: a duplicate or differently-originated module instance would make
              every static file inspection look correct while the classloader is built from
              another representation. Module identity has to come from the runtime, and until
              it does these two rows constrain the answer without deciding it.
            step_zero_cache_clear:
              why_first: >-
                build/work had reached 159M and its system/ -- caches, index including
                binarymodeldigest2, LocalHistory -- had never been cleared in this item. Every
                make and every launchtests invocation, the POST-MPS4-01 cold build included,
                shared one idea.system.path. That build was cold with respect to source_gen
                and classes_gen and warm with respect to the worker index, which does not
                weaken it, but nltps.modeltests was created after most of those cached runs.
                A stale module or classpath entry is exactly the shape that produces a
                classloader unable to see a module's classes. The ordering matters more than
                the possibility: the introspection probe reads the same values, so a stale
                getClassPath would have been reported as a wrong classpath and a defect fixed
                that did not exist.
              result: >-
                THE FAILURE SURVIVES. With system, config and log deleted, the run reproduces
                java.lang.ClassNotFoundException on the same fully-qualified class and the
                reports still read tests="0". The stale-index explanation is ruled out and
                every subsequent probe reading is trustworthy, which is the property this
                step was run for rather than a hoped-for fix.
              standing_gap: >-
                The build descriptor creates work.dir and deletes reports.dir, and removes
                nothing else. Worker state accumulates across every invocation with nothing
                to bound it. Whether the test target should clear system/ each run is a
                decision for the unit that closes this item, not something to change while a
                diagnosis is open.
            acceptance_for_the_probe: >-
              Not a green. One uniquely identified boundary along descriptor, facet path,
              physical class, own resource, own class, delegated class. If the probe ends
              without locating that boundary, nothing is changed afterwards in the same unit.
            next_unit: >-
              Runtime classloader introspection, before any artifact is built. Establish what
              the worker thinks nltps.modeltests is: its descriptor file, isPackaged,
              JavaModuleFacet.getClassesGen, JavaModuleFacet.getClassPath, the absolute path
              the compiled class is expected at, whether it exists there, and whether
              moduleCL.getOwnResource returns
              nltps/modeltests/headless/REA_C_002_evidence_required_for_assessed_verdict_Test.class
            decisive_fork: >-
              If the resolved classpath does not contain the real compiled location, that is
              the source-module classpath defect and it is fixed directly. If the classpath is
              right and the class is there but getOwnResource returns null, investigate how
              the IClassPathItem was built or whether a duplicate module instance is being
              resolved. If getOwnResource finds the class and loadClass still fails, capture
              the nested exception: that is linkage, not packaging. Only if the source-module
              path is demonstrably unsuitable does the packaged jar topology become the
              answer.
            frozen_meanwhile: >-
              No JDK or JUnit dependency additions, no change to ext, no change to the
              sentinel or its trivial body, and no packaging, until the probe says which
              boundary is broken.
          still_open: >-
            Discovery remains 0 after the JNA fix. The crash is gone and the module is
            registered, so what remains is why TestDiscovery.surveyModule finds no test root
            in a module whose test class is generated and compiled. Do not touch
            openTest or openPackages first: changing selection controls before the
            resolution path is understood risks a working configuration nobody can explain.
      why_the_count_must_not_move: >-
        Holding the discovered count equal before, during and after the deliberate failure
        excludes three false-green cases in one control: testmodules resolving to nothing,
        discovery silently changing between runs, and the failing test simply disappearing
        rather than failing. A verdict alone distinguishes none of them.
    remaining_to_close:
    - 'DONE: POST-MPS4-01 corrected; cold build completes all nine languages, and a second
      independent build succeeds on the first build''s own output.'
    - 'Re-verify the build clause in MPS-MAT-005A, 005B, 005C and 005D against the cold
      build now that one exists, and clear their build_clause_status from unreproduced with
      attributable evidence. The obligation is recorded on those four items; this line is
      here so the session that closes MPS-MAT-008 cannot discharge the cold build without
      seeing that four completed items were waiting on exactly that artifact.'
    - 'Decide what satisfies the model-tests clause: either author jetbrains.mps.lang.test
      models and run them through the launchtests task the same antlib registers, or amend
      the acceptance wording. Do not treat zero tests as tests passing.'
    - Only then add tools/mps/check_headless_build_currency.py, keyed on a hash of the
      controlled model tree rather than on a commit sha so a documentation commit does not
      invalidate build evidence, and bind it to this item the way the persistence gate is
      bound to MPS-MAT-004B.
  - id: MPS-MAT-009
    checkpoint: MPS-4
    item: Independent Stage A review confirms no patient data, credentials, signing keys, or
      authority cutover.
    status: pending
    blocked_reason: >-
      Independent review is not something the party that did the work can record for itself.
      What is recorded here is the state offered for that review, not its outcome.
    evidence:
    - 'Offered for review: the imported corpus is the published high-level requirements
      document and nothing else. No patient data, no credentials, no signing keys.'
    - Every imported root carries authoritative false and references the one Stage A mirror
      lifecycle state, whose value is proposed. That is the document-control baseline of the
      source, not a claim about any requirement's clinical maturity, and it asserts no
      approval and no authority cutover.
    - The source-explicit hazard metric is unchanged at 76 / 2,144. Materializing an entity in
      MPS is structural representation; only a named reviewer replacing a derived hazard set
      with one determined for that entity moves the numerator.

post_mps1_actions:
  - id: POST-MPS1-01
    title: Module-graph gate does not constrain non-NL-TPS dependencies
    finding: >-
      tools/mps/check_module_graph.py filters module references to nltps.* and therefore
      does not constrain unexpected external dependencies. MPS repeatedly re-added
      explicit DEFAULT dependencies on jetbrains.mps.lang.core and JDK across the MPS-1
      session, after concept creation, after the behavior aspect appeared, and after the
      governance typesystem began referencing foundation model elements. Each was removed
      and both languages still rebuild, so none was required. Descriptor byte parity with
      b0eff6f is therefore an actively maintained state, re-established by hand after
      each recurrence, and not something the existing gate guarantees or would notice.
    action: >-
      Extend the module blueprint to declare the expected external, non-nltps dependency
      set for each module, and update check_module_graph.py to compare those dependencies
      explicitly rather than filtering them out.
    scope: post-MPS-1 controlled amendment, not MPS-1
  - id: POST-MPS1-02
    title: V and V matrix generator is not line-ending portable
    finding: >-
      scripts/generate_vv_check_matrix.ps1 builds output with StringBuilder.AppendLine,
      so line endings follow Environment.NewLine. The repository pins LF through
      .gitattributes and the -Check comparison is byte-exact, so local Windows execution
      always fails while Linux CI passes. Regeneration produced zero content difference
      after normalization and spec/allocations.yaml is unchanged, so this is a
      portability defect and not generated-document drift.
    action: >-
      Normalize generated line endings explicitly and add a Windows regression test.
    status: resolved
    resolution: >-
      The assembled text is normalized to canonical LF at the single assembly site
      before it is compared or written, so output no longer follows Environment.NewLine.
      The byte-exact comparison is unchanged and the generated content is unchanged:
      regeneration produces a byte-identical document. Four regression assertions cover
      it, including one that fails if the normalization is removed and one that fails if
      the byte-exact comparison is weakened, so this cannot regress on a host where it
      currently happens to pass.
    scope: >-
      post-MPS-1 maintenance, delivered in its own controlled commit; deliberately not
      mixed into constraint materialization.
  - id: POST-MPS1-03
    title: Logical-real storage must not narrow generated runtime schemas
    finding: >-
      PhysicalQuantity.magnitude remains logically numeric despite string-backed MPS
      storage, because MPS offers only string, integer and boolean primitives.
    obligation: >-
      Any generated runtime schema must preserve or re-widen the logical numeric contract
      and must not blindly emit a string-only contract from the MPS storage
      representation. Where the current runtime or schema contract already permits
      numeric values, that fact is preserved here so later generator work does not
      silently narrow it.
    scope: >-
      downstream obligation record only; no Stage B or Stage D generator work is
      authorized by this entry.
