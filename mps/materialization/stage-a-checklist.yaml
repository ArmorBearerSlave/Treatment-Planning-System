        traceability_retained: true

      - representation_proof: PhysicalQuantity.magnitude
        deferral_class: non_instantiability
        lapsed_at: MPS-2
        carried_to: MPS-MAT-005B
        lapse_trigger: >-
          ConstraintDefinition.limit gives PhysicalQuantity a containment path.
        lapse_note: >-
          Recorded rather than deleted. The MPS-1 acceptance was granted with this deferral
          in force and that history stands; the obligation has moved, not vanished.
        affected_concept: PhysicalQuantity
        property: magnitude
        governing_policy: property_facet_policy
        logical_type: real
        mps_storage: string
        implementation_status: numeric lexical rule implemented
        behavioral_proof_status: >-
          deferred because PhysicalQuantity is non-rootable and unreachable from any legal
          MPS-1 containment path.
        not_a_controlled_constraint: >-
          This is a representation-proof obligation under property_facet_policy, not a
          twelfth controlled constraint. The declared inventory remains exactly
          FND-C-001..FND-C-004 and GOV-C-001..GOV-C-007.
        reactivation_condition: >-
