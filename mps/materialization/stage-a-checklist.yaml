    reusable_behaviour_mechanism:
      question: Can Version.isValidCalendarDate() be invoked from an
        ExternalReference.retrievedDate checking rule?
      answer: >-
        No. Concept behaviour dispatch is per-concept and ExternalReference is not a
        Version, so the method is not in scope for its rule.
      mechanism: >-
        A single ClassConcept utility, CalendarDates.isValidCalendarDate(string), called
        from both rules by StaticMethodCall. This is ordinary Java static dispatch, not the
        concept-behaviour registry that silently returned false for every input at MPS-1.
        The superseded Version_Behavior root was deleted after a usage search returned
        empty, so calendar validity has exactly one implementation.
      verified_behaviourally: >-
        Malformed and impossible dates are rejected and 2024-02-29 is accepted, on both
        Version and ExternalReference. Both directions matter: a utility stuck at false
        would reject the leap date and one stuck at true would accept 2026-02-31.
      logical_date_semantics_unchanged: true
    metamodel_finding:
      finding: >-
        CORRECTED AT MPS-3. As recorded at MPS-2 this read "MPS 2026.1 does not enforce
        cardinality 1 on a reference link". That is wrong. MPS does enforce it, and
        reports the violation on the reference descriptor rather than in the node-level
        problems array.
      original_observation: >-
        A StateTransition whose source, target and actorRole references were all unset
        appeared to pass check_root_node_problems, passed IntelliJ file inspection, and
        built successfully.
      what_was_actually_wrong: >-
        The reader, not the toolchain. The MPS-2 session printed only the node-level
        problems array from the check result and never inspected children[].problems or
        references[].problems, where MPS reports obligatory-role violations. The
        diagnostic was present in the result and was discarded before it was read.
      mps3_re_test: >-
        A controlled experiment on one concept, RequirementBaseline, in the proof sandbox:
        one probe omitted the mandatory child version, one omitted the mandatory reference
        lifecycleState. The child probe produced "No child in the obligatory role
        'version'" and the reference probe produced "No reference in the obligatory role
        'lifecycleState'", both on the feature descriptor, both silent at node level, both
        invisible to file inspection and to a native build. The MPS-1 mandatory-child
        result therefore reproduces exactly, and children and references behave
        identically. Both probes were deleted and the sandbox restored byte-identical.
      consequence: >-
        CLI-C-006 keeps its three explicit reference checks. They are no longer a
        substitute for absent enforcement but defence in depth and an attributable,
        constraint-named diagnostic, which a bare obligatory-role message is not. The
        durable control moved to read-back discipline: a session that inspects only
        node-level problems will not see an obligatory-role violation for either a child
        or a reference.
      acceptance_unchanged: >-
        This corrects a finding, not the acceptance. CLI-C-006 was demonstrated at MPS-2
        with five separate diagnostics and remains proven; the five-case GOV-C-007 matrix
        and every other item of MPS-2 evidence are untouched.
