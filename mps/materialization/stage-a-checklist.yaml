        traceability_retained: true

      - representation_proof: ExternalReference.retrievedDate
        deferral_class: non_instantiability
        lapsed_at: MPS-2
        carried_to: MPS-MAT-005B
        lapse_trigger: >-
          EvidenceProfile.citations gives ExternalReference a containment path: ReleaseProfile -> evidenceProfiles -> EvidenceProfile -> citations.
        lapse_note: >-
          Recorded rather than deleted. The MPS-1 acceptance was granted with this deferral
          in force and that history stands; the obligation has moved, not vanished.
        affected_concept: ExternalReference
        property: retrievedDate
        governing_policy: property_facet_policy
        logical_type: date
        mps_storage: string
        implementation_status: >-
          not implemented at MPS-1; the reusable Version.isValidCalendarDate behavior
          method exists and is ready to be applied when a container appears.
        behavioral_proof_status: >-
          deferred because ExternalReference is non-rootable and unreachable from any
          legal MPS-1 containment path.
        not_a_controlled_constraint: >-
          This is a representation-proof obligation under property_facet_policy, not a
          controlled constraint identifier.
        reactivation_condition: >-
          Reactivates at the first checkpoint that declares a concept aggregating the
          affected concept. That checkpoint must exercise the deferred negative examples
          before its own acceptance items may close.
        reachability_guidance: >-
          Guidance only, not a binding checkpoint assignment. ExternalReference may become
          reachable through EvidenceProfile in clinicalintent, or through
          EvidenceRequirement or ManualEvidenceRef in realization.
        traceability_retained: true

    deferral_lapse_rule: >-
      A deferral whose deferral_class is non_instantiability becomes invalid automatically
      once its affected_concept becomes reachable from a legal root.
      tools/mps/check_materialization_plan.py imports the reachability computation from
      tools/mps/check_concept_features.py and fails while any such deferral remains active
      for a concept that is now reachable. Reactivation is therefore a mechanically
      enforced obligation, not a documentation reminder.

    magnitude_comparison_safety:
      comparison_present: false
      detail: >-
        No MPS-1 rule compares magnitude values. FND-C-003 and FND-C-004 compare only
        dose-basis and dimension enumeration member names; FND-REPR-REAL checks lexical
        numeric form only. No lexicographic ordering is applied to a numeric value
        anywhere in the MPS-1 constraint set. Any future rule that compares magnitudes
        must parse the string-backed value numerically first.
