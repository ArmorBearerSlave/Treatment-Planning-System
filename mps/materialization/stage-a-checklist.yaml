post_mps1_actions:
  - id: POST-MPS1-01
    title: Module-graph gate does not constrain non-NL-TPS dependencies
    finding: >-
      tools/mps/check_module_graph.py filters module references to nltps.* and therefore
      does not constrain unexpected external dependencies. MPS repeatedly re-added
      explicit DEFAULT dependencies on jetbrains.mps.lang.core and JDK across the MPS-1
      session, after concept creation, after the behavior aspect appeared, and after the
      governance typesystem began referencing foundation model elements. Each was removed
      and both languages still rebuild, so none was required. Descriptor byte parity with
      b0eff6f is therefore an actively maintained state, re-established by hand after
      each recurrence, and not something the existing gate guarantees or would notice.
    action: >-
      Extend the module blueprint to declare the expected external, non-nltps dependency
      set for each module, and update check_module_graph.py to compare those dependencies
      explicitly rather than filtering them out.
    scope: post-MPS-1 controlled amendment, not MPS-1
  - id: POST-MPS1-02
    title: V and V matrix generator is not line-ending portable
    finding: >-
      scripts/generate_vv_check_matrix.ps1 builds output with StringBuilder.AppendLine,
      so line endings follow Environment.NewLine. The repository pins LF through
      .gitattributes and the -Check comparison is byte-exact, so local Windows execution
      always fails while Linux CI passes. Regeneration produced zero content difference
      after normalization and spec/allocations.yaml is unchanged, so this is a
      portability defect and not generated-document drift.
    action: >-
      Normalize generated line endings explicitly and add a Windows regression test.
    status: resolved
    resolution: >-
      The assembled text is normalized to canonical LF at the single assembly site
      before it is compared or written, so output no longer follows Environment.NewLine.
      The byte-exact comparison is unchanged and the generated content is unchanged:
      regeneration produces a byte-identical document. Four regression assertions cover
      it, including one that fails if the normalization is removed and one that fails if
      the byte-exact comparison is weakened, so this cannot regress on a host where it
      currently happens to pass.
    scope: >-
      post-MPS-1 maintenance, delivered in its own controlled commit; deliberately not
      mixed into constraint materialization.
  - id: POST-MPS1-03
    title: Logical-real storage must not narrow generated runtime schemas
    finding: >-
      PhysicalQuantity.magnitude remains logically numeric despite string-backed MPS
      storage, because MPS offers only string, integer and boolean primitives.
    obligation: >-
      Any generated runtime schema must preserve or re-widen the logical numeric contract
      and must not blindly emit a string-only contract from the MPS storage
      representation. Where the current runtime or schema contract already permits
      numeric values, that fact is preserved here so later generator work does not
      silently narrow it.
    scope: >-
      downstream obligation record only; no Stage B or Stage D generator work is
      authorized by this entry.
