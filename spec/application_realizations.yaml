schema_version: "0.1"
status: proposed_application_realization_catalog
purpose: >-
  Registers concrete software applications that realize NL-TPS components,
  distinct from spec/components.yaml (the abstract component catalog) and
  overleaf/NL_TPS_Component_Realization.tex (the team/component allocation
  narrative). An entry here does not constitute an approved design, risk
  acceptance, verification, commissioning, or clinical release. The program
  has decided to produce multiple applications from the NL-TPS controlled
  requirements; this file exists so each one is discoverable and traceable
  from the moment it starts, rather than retrofitted after code exists.

naming_convention:
  namespace_root: nltps.apps
  rule: >-
    Every registered application uses a namespace under nltps.apps.<name>,
    per ADR-002's requirement that machine identifiers use the existing
    nltps namespace. The namespace is assigned at registration and is a
    configuration change like any other identifier, not an editorial detail.

registration_requirements:
  - Every application shall be registered here before its component or
    requirement realization claims are cited elsewhere as traceable.
  - realizes_requirements shall list only sub-requirement IDs with actual
    attributable traceability, risk, and verification evidence for this
    application. A component allocation alone does not populate this list.
  - clinical_use_permitted shall be false until a named clinical, quality,
    and regulatory approval record exists for this application specifically.
  - Removing or renaming an application entry is a controlled change; it does
    not delete history the entry has already accumulated.

applications:
  - id: APP-VIEWER-001
    name: NL-TPS Cornerstone3D Viewer Prototype
    namespace: nltps.apps.viewer
    repo_path: app/cornerstone-tps
    status: independent_prototype
    clinical_use_permitted: false
    realizes_components:
      - C-UX-01
      - C-VOICE-01
      - C-SEG-01
      - C-DOSE-01
    realizes_requirements: []
    maturity:
      formal_traceability: not_started
      risk_analysis: not_started
      verification_evidence: not_started
      human_factors_evaluation: not_started
    notes: >-
      Technical feasibility spike: Cornerstone3D + Vite, hosted locally and
      on a DGX Spark. Renders CT volumes, an RTDOSE color-wash overlay, and
      RTSTRUCT contour outlines from synthetic XCAT-derived DICOM data, all
      via ad hoc manual DICOM parsing rather than a reviewed, requirement-
      driven data pipeline. Also includes a natural-language command bar
      (typed text and user-initiated push-to-talk speech transcribed fully
      in-browser by a local Whisper model -- not the browser's built-in
      cloud-dependent SpeechRecognition -- deterministic keyword/regex
      parsing only, a versioned typed intent compiled before any state-
      changing action, a structured read-back requiring explicit
      confirm-button execution, a separate explicit transcript-confirmation
      step for speech input, and an in-memory audit ledger) built to the
      architectural pattern of NLI-001..008 and C-VOICE-01, scoped only to
      non-clinical viewer actions (slice navigation, dose/structure
      visibility, camera reset/zoom) -- it makes no prescription, approval,
      or signature claim of any kind. Also includes an auto-segmentation
      feasibility spike: a separate FastAPI inference service
      (app/cornerstone-tps/autoseg-service) running the published
      open-source TotalSegmentator tool (not an NL-TPS-authored or
      validated model) on a DGX Spark GPU, returning proposed contours
      rendered as a visually distinct dashed-outline overlay, entirely
      separate from any loaded RTSTRUCT, with an explicit discard action
      and no automatic acceptance into any structure set. In the program's
      own testing on this synthetic XCAT phantom, only 4 of the model's
      104 candidate structures were returned above the noise threshold,
      and their spatial agreement with the corresponding ground-truth
      RTSTRUCT contours was inconsistent (reasonably close for one
      structure, notably offset for another) -- entirely expected and
      unsurprising for a real-CT-trained model applied to synthetic
      phantom data, but a concrete, observed illustration of why this
      output must never be treated as anything but an unreviewed proposal
      requiring independent expert review before any use whatsoever.
      Also includes an AI dose-prediction feasibility spike: a separate
      FastAPI inference service (app/cornerstone-tps/dosepred-service)
      running a small custom-trained 3D U-Net (NOT a published or
      independently validated model, unlike TotalSegmentator) trained from
      scratch on only 10 synthetic XCAT prostate cases -- a severely small
      dataset for a deep-learning dose-prediction task by any standard.
      Given a loaded CT series and RTSTRUCT, the service rasterizes the
      structure contours into label channels, runs the network, and
      returns a predicted dose volume rendered as a visually distinct
      magenta/orange colormap overlay, entirely separate from any real
      RTDOSE, with an explicit discard action and no automatic acceptance
      anywhere. Informal review of the rendered output on the program's own
      synthetic phantom shows a plausible-magnitude but spatially very
      confined hotspot near the GTV rather than a realistic PTV-conforming
      dose distribution shape, consistent with training on only 10 cases;
      the one demonstrated inference case was also a case the model was
      trained on, not a held-out test, so no generalization claim can be
      made even informally. This output must never be treated as anything
      but an unreviewed, unvalidated proposal requiring independent expert
      review before any use whatsoever.
      Claims no realized sub-requirement yet -- component allocation to
      C-UX-01, C-VOICE-01, C-SEG-01, and C-DOSE-01 records intended future
      scope, not completed assurance work. No formal traceability
      mapping, risk analysis, verification evidence, or human factors
      evaluation exists for this code; all such review is independent human
      reviewer work this entry does not and cannot substitute for.
