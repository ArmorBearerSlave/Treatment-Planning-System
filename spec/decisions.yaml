schema_version: "0.3"

decisions:
  - id: ADR-001
    title: MPS Authority, Scope, and Runtime Boundary
    version: "0.2"
    date: "2026-08-19"
    status: provisionally_accepted_for_controlled_nonclinical_implementation
    approval_state: pending_named_approval
    authority_cutover_status: not_approved
    owner: architecture_board_proposed
    human_readable_source: overleaf/NL_TPS_ADR_001_MPS_Authority_Scope_and_Runtime_Boundary.tex
    related_architecture_baselines:
      - AB-002
      - AB-003
      - AB-004
      - AB-008
      - AB-011
    partially_resolves:
      - D-ENG-006
    decision: >-
      Use JetBrains MPS as the proposed offline governance compiler. After a
      separately approved, field-specific Stage C cutover, MPS may become the
      semantic source of truth for the approved structured normative scope.
      The clinical runtime consumes only immutable, versioned,
      integrity-verified release bundles and never depends on a live MPS
      repository.
    current_authority: existing_controlled_source_documents
    permits_now:
      - Stage A mirror implementation
      - preparation and execution of Stage B equivalence checks
      - four-language bootstrap specification
      - deterministic 119-HLR import bundle generation
      - synthetic nonclinical MPS model and generator experiments
    does_not_permit:
      - authority cutover
      - patient data in MPS
      - MPS in the clinical runtime path
      - clinical use of a generated artifact
      - approval, signature, release, transfer, or delivery by AI or MPS
      - direct text editing of MPS persistence XML
    required_languages:
      - nltps.foundation
      - nltps.governance
      - nltps.clinicalintent
      - nltps.realization
    alternatives_considered:
      - permanent document authority
      - YAML or JSON as sole semantic source
      - conventional requirements database as sole semantic source
      - MPS in the clinical runtime
      - MPS offline with staged authority transition
    stage_c_approval_required_from:
      - architecture decision owner
      - clinical governance
      - quality and configuration management
      - independent verification and validation
      - cybersecurity and privacy
    recorded_approvals: []

  - id: ADR-002
    title: Program Identity and Naming Hierarchy
    version: "0.2"
    date: "2026-08-19"
    status: provisionally_accepted_for_controlled_nonclinical_program_use
    approval_state: pending_named_approval
    owner: program_sponsor_and_architecture_board_proposed
    human_readable_source: overleaf/NL_TPS_ADR_002_Program_Identity_and_Naming_Hierarchy.tex
    related_architecture_baselines:
      - AB-001
      - AB-003
      - AB-004
      - AB-011
      - AB-012
    decision:
      preferred_descriptive_title: Governed Clinical Language for AI-Assisted Radiation Treatment Planning
      subtitle: A Model-Based, Safety-Constrained Orchestration Framework
      technology_name: Governed Clinical Planning Language
      technology_acronym: GCPL
      implementation_name: Natural-Language Treatment Planning System
      implementation_acronym: NL-TPS
      concise_relationship: the NL-TPS implementation of GCPL
      research_title: >-
        Design and Realization of a Governed Clinical Planning Language for
        AI-Assisted Radiotherapy: A Model-Based Framework for Intent
        Compilation, Deterministic Safety, Traceability, and Commissioned
        Execution
    preserves:
      - controlled requirement and assurance identifiers
      - NL_TPS filenames and repository links
      - nltps namespaces and machine identifiers
      - exact historical document titles in citations
      - current intended use and authority boundaries
    does_not_permit:
      - bulk corpus rename
      - alteration of normative requirement meaning
      - autonomous AI or clinical-authority claims
      - regulatory, accreditation, commissioning, or validation claims
      - repository or namespace migration without a separate decision
    recorded_approvals: []

  - id: ADR-003
    title: Governed Computational Hosting, Workload Integrity, and the DGX Reference Host
    version: "0.1"
    date: "2026-08-23"
    status: provisionally_accepted_for_controlled_nonclinical_architecture
    approval_state: pending_named_approval
    authority_cutover_status: no_authority_transition_proposed
    owner: architecture_board_proposed
    human_readable_source: overleaf/NL_TPS_ADR_003_Governed_Computational_Hosting.tex
    human_readable_source_state: not_yet_authored
    architecture_amendment: ARCH-DGX-01
    structural_representation: spec/architecture.yaml
    related_architecture_baselines:
      - AB-001
      - AB-003
      - AB-004
      - AB-005
      - AB-010
      - AB-011
      - AB-013
    decision: >-
      Where a governed NL-TPS workload executes is an architecture decision
      separate from what that workload is authorized to do. A governed workload
      is a provider-neutral object whose authorized identity is bound by digest
      before dispatch. A scheduler selects an approved execution provider and may
      change nothing the authorization bound. An execution provider runs the
      workload and returns results together with an execution attestation, and
      acquires no authority by doing so. The DGX Spark is designated the first
      reference complete computational host for NL-TPS model development,
      inference, and locally executed clinical language-model services, and the
      abstraction that lets it host them is the same abstraction by which an
      oversized governed workload leaves it for a larger qualified computational
      platform.
    current_authority: existing_professional_and_commissioned_system_authority
    permits_now:
      - controlled nonclinical architecture representation of computational hosting
      - provider-neutral governed workload contract drafting and negative-test development
      - structural gate development for workload integrity, dispatch separation, and model-development governance
      - nonclinical portability and capacity investigation on candidate hosts using synthetic or nonclinical data
    does_not_permit:
      - compute-host selection as an authorization to treat
      - remote dispatch as an enlargement of authorized scope
      - remote execution as a substitute for professional approval
      - computational success as a basis for clinical authority in an artifact
      - scale-out as an authorization for a different model, algorithm, or parameter set
      - a DGX-specific or otherwise provider-specific governed workload envelope
      - designation of a computational host as the authoritative clinical TPS
      - bypass of validation, reconciliation, professional authorization, external TPS import, downstream QA, or site commissioning for an artifact computed on a governed host
      - treating a remote execution claim as an independently established fact
      - treating a matching workload digest as evidence that the authorized workload is what executed
      - accepting a returned result without checking it against the output and acceptance contracts the workload declared
      - a cross-host equivalence claim without the workload-class-specific verification and validation
      - silent substitution of a model, model version, checkpoint, precision mode, preprocessing pipeline, or inference implementation
      - identification of a dataset by directory name, mount point, or filename
      - silent movement of a case between training, validation, test, or external independent test after an experiment is frozen
      - treating training success or evaluation success as qualification or as clinical authorization
      - a parallel approval mechanism for models outside the existing controlled authority structures
      - clinical, professional, or release authority for language-model output
      - patient data or clinical credentials on an unqualified compute provider
    alternatives_considered:
      - a DGX-specific workload envelope with one format per provider
      - embedding vendor compute APIs directly in clinical intent
      - treating remotely supplied execution claims as direct observations
      - performing authorization at dispatch time inside the scheduler
      - a single-host architecture with no scale-out path
      - deferring any computational-hosting architecture until a platform is procured
      - one workload class covering model development and clinical inference together
    qualification_required_before_use:
      - platform commissioning and site acceptance for the reference host
      - qualification of any remote compute provider, naming its attestation mechanism, how that mechanism is authenticated, and which claims are rechecked after return
      - workload-class-specific cross-host equivalence verification and validation
      - model-specific qualification and professional authorization before any model is used clinically
      - dataset governance review covering representativeness, permitted use, and labeling provenance
    qualification_approval_required_from:
      - architecture decision owner
      - clinical governance
      - quality and configuration management
      - independent verification and validation
      - cybersecurity and privacy
    recorded_approvals: []
