schema_version: "0.1"
register_id: DENG-001
title: Open engineering decisions
status: controlled_mirror_of_eng_pkg_01_open_decisions
human_readable_source: overleaf/NL_TPS_Engineering_Architecture_and_MVP_Implementation_Plan.tex
baseline: ENG-PKG-01-v0.6

purpose: >-
  The plan's open decisions existed only as printed prose, so no gate could refuse
  work that depends on them. This register makes each decision machine-readable and
  names what it blocks, so the plan's "work permitted meanwhile" column becomes an
  enforced constraint rather than an intention.

blocking_semantics:
  - A blocked entity may be constructed and reviewed but shall not reach approved state.
  - blocks_entities lists identifier prefixes evaluated against construction records.
  - blocks_gates lists release gates that cannot be recommended while the decision is open.
  - An empty blocks_entities means the decision constrains the program, not a record set.
  - Recording a decision here does not approve it; approval_state carries that.

